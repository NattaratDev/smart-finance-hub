        return `<button type="button" ${cov || c ? `data-rg-cell="${e.id}|${mo.y}|${mo.m}"` : 'disabled'} class="rounded-xl border px-1 py-1.5 text-center ${!cov && !c ? 'bg-slate-50 border-slate-100 text-slate-300' : c ? (c.status === 'paid' ? 'border-mint-200 bg-mint-50' : 'border-cream-200 bg-cream-50') : due ? 'border-blush-200 bg-blush-50' : 'border-slate-200 bg-white'}">
          <span class="block text-[10px] text-slate-500">${mo.short}</span><span class="block text-xs tabular-nums ${c ? 'text-slate-700' : due && cov ? 'text-blush-500' : 'text-slate-300'}">${c ? rentMoney(c.amount) : cov ? (due ? 'ค้าง' : '+') : '–'}</span></button>`; }).join('')}</div>
    </div>`).join('')}</div>`}
    <p class="text-xs text-slate-400 mt-3">${ic('info', 'w-3.5 h-3.5 inline')} กดช่องเดือนเพื่อบันทึก/แก้ไขการเบิก · ตัวเลขสีเขียว = เบิกแล้ว, สีเหลือง = รอเบิก, "ค้าง" = ถึงกำหนดแต่ยังไม่บันทึก, "–" = ไม่อยู่ในช่วงที่มีสิทธิ์</p>`;
  body.oninput = debounce((e) => { if (e.target.matches('[data-rg-q]')) { Rg.filter = e.target.value; const pos = e.target.selectionStart; rentRenderRegister(body, el); refreshIcons(); const q2 = $('[data-rg-q]', body); q2.focus(); q2.setSelectionRange(pos, pos); } }, 250);
  body.onclick = (ev) => {
    const cell = ev.target.closest('[data-rg-cell]');
    if (cell) { const [id, y, m] = cell.dataset.rgCell.split('|'); rentOpenClaim(Rg.ents.find(x => x.id === id), +y, +m, el); return; }
    const vw = ev.target.closest('[data-rg-view]'); if (vw) { Rg.person = vw.dataset.rgView; rentRender(el); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const en = ev.target.closest('[data-rg-ent]'); if (en) { rentOpenEnt(Rg.ents.find(x => x.id === en.dataset.rgEnt), null, el); return; }
    const a = ev.target.closest('[data-rg-act]'); if (!a) return;
    const k = a.dataset.rgAct;
    if (k === 'add-ent') rentPickPerson(el);
    if (k === 'batch') rentOpenBatch(el);
    if (k === 'print') rentPrintMenu('print');
    if (k === 'pdf') rentPrintMenu('pdf');
    if (k === 'excel') rentExportExcel();
  };
}

/* ---------- ทะเบียนคุม: มุมมองรายคน (เลือกบุคลากร 1 คน → ทะเบียน 12 เดือนของปีงบ) ---------- */
/** รายชื่อผู้มีสิทธิ์ในปีงบ (ไม่ซ้ำคน) สำหรับตัวเลือก "รายคน" */
const rentPeopleInFy = () => { const seen = new Set(); return rentRows().filter(r => r.p.id && !seen.has(r.p.id) && seen.add(r.p.id)).map(r => r.p); };
const rentPersonSelect = () => `<select class="input !w-auto max-w-full" data-rg-person title="เลือกดูทะเบียนรายคน">
    <option value="">ทุกคน (ตารางรวม)</option>${rentPeopleInFy().map(p => `<option value="${p.id}" ${Rg.person === p.id ? 'selected' : ''}>${esc(p.full_name)}</option>`).join('')}</select>`;
function rentRenderPerson(body, el) {
  const people = rentPeopleInFy(), idx = people.findIndex(p => p.id === Rg.person), p = people[idx];
  const ents = rentRows().filter(r => r.p.id === Rg.person).map(r => r.e).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const months = rentMonths(Rg.fy), today = calToday(), st = rentStats(ents.map(e => ({ e })));
  const entOf = (mo) => ents.find(e => rentClaim(e.id, mo.y, mo.m)) || ents.find(e => rentCovered(e, mo.y, mo.m)) || null;
  const rows = months.map(mo => { const e = entOf(mo), c = e ? rentClaim(e.id, mo.y, mo.m) : null, cov = e ? rentCovered(e, mo.y, mo.m) : false;
    return { mo, e, c, cov, due: rentMonthFirst(mo.y, mo.m) <= today, sg: e && cov ? rentSuggest(e, mo.y, mo.m) : null }; });
  const entitled = rows.reduce((a, r) => a + (r.sg ? r.sg.amount : 0), 0), claimed = st.paid + st.pending;
  const nav = (d) => people[idx + d] ? `<button class="btn btn-ghost btn-sm" data-rg-nav="${people[idx + d].id}" title="${esc(people[idx + d].full_name)}">${ic(d < 0 ? 'chevron-left' : 'chevron-right', 'w-4 h-4')}${d < 0 ? 'คนก่อน' : 'คนถัดไป'}</button>` : '';
  const entCard = (e) => `<div class="rounded-2xl border border-slate-100 bg-white/70 px-3 py-2 text-sm flex flex-wrap items-center gap-x-4 gap-y-1">
      <span class="badge bg-brand-50 text-brand-600">${RENT_HOUSING[e.housing_type]}</span>
      <span>สิทธิ์ ${formatThaiDate(calDate(e.start_date))} – ${e.end_date ? formatThaiDate(calDate(e.end_date)) : 'ปัจจุบัน'}</span>
      <span>เบิกได้เดือนละ <b class="font-semibold tabular-nums">${rentMoney(rentLimit(e))}</b> บาท</span>
      ${e.contract_end ? `<span class="${e.contract_end < today ? 'text-blush-500' : e.contract_end <= calAddDays(today, 60) ? 'text-cream-600' : 'text-slate-500'}">สัญญาถึง ${formatThaiDate(calDate(e.contract_end))}</span>` : ''}
      ${e.address ? `<span class="text-slate-500 truncate max-w-[18rem]">${esc(e.address)}</span>` : ''}
      <button class="btn btn-ghost btn-sm ml-auto" data-rg-ent="${e.id}">${ic('pencil', 'w-4 h-4')} แก้ไขสิทธิ์</button></div>`;
  body.innerHTML = `
    <div class="flex flex-col lg:flex-row gap-2 lg:items-center mb-3">
      <div class="flex items-center gap-2 flex-1 min-w-0"><span class="text-sm text-slate-500 shrink-0">${ic('user-round', 'w-4 h-4 inline')} รายคน</span>${rentPersonSelect()}</div>
      <div class="flex flex-wrap gap-2">${nav(-1)}${nav(1)}
        <button class="btn btn-ghost" data-rg-act="pprint">${ic('printer')} พิมพ์รายคน</button><button class="btn btn-ghost" data-rg-act="ppdf">${ic('file-down')} PDF</button>
        <button class="btn btn-soft" data-rg-act="all">${ic('table', 'w-4 h-4')} ดูทุกคน</button></div>
    </div>
    <div class="card p-4 mb-4">
      <div class="flex items-center gap-3 mb-3"><span class="w-11 h-11 rounded-2xl grid place-items-center bg-brand-100 text-brand-600 shrink-0">${ic('user-round', 'w-5 h-5')}</span>
        <div class="min-w-0"><div class="font-semibold text-slate-800 text-lg">${esc(p.full_name)}</div><div class="text-sm text-slate-500">${esc([rentPositionText(p), p.unit_name].filter(Boolean).join(' · '))}</div></div></div>
      <div class="grid gap-2">${ents.map(entCard).join('')}</div>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
      ${statCard({ label: `สิทธิ์เบิกทั้งปีงบ ${Rg.fy}`, value: rentMoney(entitled), icon: 'wallet', tone: 'brand', hint: 'บาท (ตามเดือนที่มีสิทธิ์)' })}
      ${statCard({ label: 'เบิกแล้ว', value: rentMoney(st.paid), icon: 'check-circle-2', tone: 'mint', hint: st.pending ? `รอเบิก ${rentMoney(st.pending)} บาท` : 'บาท' })}
      ${statCard({ label: 'คงเหลือสิทธิ์', value: rentMoney(Math.max(0, entitled - claimed)), icon: 'piggy-bank', tone: 'cream', hint: 'บาท (สิทธิ์ − เบิกแล้ว − รอเบิก)' })}
      ${statCard({ label: 'เดือนที่ยังไม่บันทึก', value: formatNumber(st.missing), icon: 'alert-circle', tone: 'blush', hint: 'ถึงกำหนดแล้วแต่ยังไม่มีรายการ' })}
    </div>
    <div class="card !p-0 overflow-x-auto"><table class="sfh-table w-full text-sm min-w-[720px]">
      <thead class="bg-gradient-to-r from-brand-50 via-white to-lilac-50 text-slate-500"><tr><th>เดือน</th><th class="text-right">สิทธิ์เบิก</th><th class="text-right">จำนวนเบิก</th><th>เลขที่ฎีกา</th><th>วันที่วางฎีกา</th><th>สถานะ</th><th></th></tr></thead>
      <tbody class="divide-y divide-slate-100">${rows.map(({ mo, e, c, cov, due, sg }) => `<tr class="${!cov && !c ? 'bg-slate-50/60 text-slate-400' : c ? '' : due ? 'bg-blush-50/40' : ''}">
        <td class="whitespace-nowrap font-medium ${!cov && !c ? '' : 'text-slate-700'}">${TH_MONTHS[mo.m - 1]} ${mo.y + 543}</td>
        <td class="text-right tabular-nums">${sg ? rentMoney(sg.amount) + (sg.prorated ? `<div class="text-[11px] text-slate-400">${sg.days}/${sg.dim} วัน</div>` : '') : '–'}</td>
        <td class="text-right tabular-nums font-semibold ${c ? (c.status === 'paid' ? 'text-mint-600' : 'text-cream-600') : ''}">${c ? rentMoney(c.amount) : '-'}</td>
        <td>${esc(c?.doc_no || '')}</td><td class="whitespace-nowrap">${c?.paid_date ? formatThaiDate(calDate(c.paid_date)) : ''}</td>
        <td>${c ? `<span class="badge ${RENT_STATUS[c.status].cls}">${RENT_STATUS[c.status].label}</span>` : cov ? (due ? `<span class="badge bg-blush-100 text-blush-500">${ic('alert-circle', 'w-3 h-3')} ค้างบันทึก</span>` : '<span class="text-xs text-slate-400">ยังไม่ถึงกำหนด</span>') : '<span class="text-xs">ไม่มีสิทธิ์</span>'}</td>
        <td class="text-right">${e && (cov || c) ? `<button class="btn ${c ? 'btn-ghost' : 'btn-soft'} btn-sm" data-rg-cell="${e.id}|${mo.y}|${mo.m}">${ic(c ? 'pencil' : 'plus', 'w-4 h-4')} ${c ? 'แก้ไข' : 'บันทึก'}</button>` : ''}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="bg-slate-50 font-semibold"><td>รวมปีงบประมาณ ${Rg.fy}</td><td class="text-right tabular-nums">${rentMoney(entitled)}</td><td class="text-right tabular-nums">${rentMoney(claimed)}</td><td colspan="4"></td></tr></tfoot>
    </table></div>
    <p class="text-xs text-slate-400 mt-3">${ic('info', 'w-3.5 h-3.5 inline')} "สิทธิ์เบิก" คิดตามส่วนจำนวนวันในเดือนแรก/เดือนสุดท้ายของสิทธิ์ · กดปุ่มบันทึก/แก้ไขในแต่ละเดือน · ปุ่มคนก่อน/คนถัดไป เลื่อนดูทีละคนตามลำดับชื่อ</p>`;
  body.onclick = (ev) => {
    const cell = ev.target.closest('[data-rg-cell]');
    if (cell) { const [id, y, m] = cell.dataset.rgCell.split('|'); rentOpenClaim(Rg.ents.find(x => x.id === id), +y, +m, el); return; }
    const en = ev.target.closest('[data-rg-ent]'); if (en) { rentOpenEnt(Rg.ents.find(x => x.id === en.dataset.rgEnt), null, el); return; }

/* ---------- ยืนยันก่อนบันทึกการแก้ไข (แสดงเฉพาะช่องที่เปลี่ยน: ค่าเดิม → ค่าใหม่) ---------- */
function rentFieldNorm(kind, v) {
  if (kind === 'money' || kind === 'num') { const n = Number(String(v ?? '').replace(/,/g, '')); return String(v ?? '').trim() === '' || !isFinite(n) || n === 0 ? null : n; }   // ว่าง = 0
  if (kind === 'bool') return v !== false;
  if (kind === 'date') return v ? String(v).slice(0, 10) : null;
  return String(v ?? '').trim() || null;
}
function rentFieldText(kind, v, rec) {
  if (v == null || v === '') return '<span class="text-slate-400">(ว่าง)</span>';
  if (kind === 'money') return `${rentMoney(v)} บาท`;
  if (kind === 'date') return formatThaiDate(calDate(v));
  if (kind === 'housing') return RENT_HOUSING[v] || esc(v);
  if (kind === 'status') return RENT_STATUS[v]?.label || esc(v);
  if (kind === 'bool') return v ? 'ใช่' : 'ไม่ใช่';
  if (kind === 'sem') return EDU_SEM[v] || esc(v);
  if (kind === 'ratekey') return esc(eduItem(v)?.name || v);
  if (kind === 'role') return v === 'mother' ? 'มารดา' : 'บิดา';
  if (kind === 'spstatus') return EDU_SPOUSE[v] || esc(v);
  if (kind === 'instype') return INS_TYPE[v]?.label || esc(v);
  if (kind === 'poltype') return INS_POLICY[v] || esc(v);
  if (kind === 'claimst') return INS_CLAIM[v]?.label || esc(v);
  if (kind === 'fueltype') return INS_FUEL_TYPES[v] || esc(v);
  const types = rentSetFor()?.config.types || [];
  if (kind === 'ptype') return esc(types.find(t => t.key === v)?.name || v);
  if (kind === 'plevel') return esc(types.find(t => t.key === rec?.position_type)?.levels.find(l => l.key === v)?.name || v);
  return esc(v);
}
async function rentConfirmEdit(title, oldRec, newData, fields) {
  const diff = fields.filter(([k, , kind]) => k in newData).map(([k, label, kind]) => ({ label, kind, a: rentFieldNorm(kind, oldRec[k]), b: rentFieldNorm(kind, newData[k]) }))
    .filter(d => d.a !== d.b);
  if (!diff.length) { showToast('ไม่มีข้อมูลที่เปลี่ยนแปลง', 'info'); return false; }
  return confirmModal({ title: esc(title), danger: false, icon: 'alert-triangle', confirmText: 'ยืนยันแก้ไข', confirmIcon: 'check',
    message: `<p class="mb-2">กรุณาตรวจสอบข้อมูลที่จะแก้ไข (${diff.length} รายการ)</p>
      <div class="rounded-2xl border border-slate-100 overflow-hidden"><table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr><th class="text-left px-3 py-1.5">ข้อมูล</th><th class="text-left px-3 py-1.5">เดิม</th><th class="text-left px-3 py-1.5">ใหม่</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${diff.map(d => `<tr><td class="px-3 py-1.5 text-slate-600">${esc(d.label)}</td><td class="px-3 py-1.5 text-slate-400 line-through decoration-blush-300">${rentFieldText(d.kind, d.a, oldRec)}</td>
        <td class="px-3 py-1.5 font-medium text-slate-800">${rentFieldText(d.kind, d.b, newData.position_type ? newData : oldRec)}</td></tr>`).join('')}</tbody></table></div>
      <p class="text-xs text-slate-400 mt-2">การแก้ไขจะถูกบันทึกใน Audit Log</p>` });
}

/* ---------- แท็บ: ผู้มีสิทธิ์ (รายชื่อผู้มีสิทธิ์ทั้งหมดของปีงบ + แก้ไข) ---------- */

    filters: [

        match: (r, v) => v === 'active' ? !(r.e.end_date && r.e.end_date < today) : v === 'ended' ? !!(r.e.end_date && r.e.end_date < today) : !!(r.e.contract_end && r.e.contract_end <= soon) },

    columns: [
      { key: 'full_name', label: 'ชื่อ-สกุล', render: r => `<div class="font-medium text-slate-700">${esc(r.p.full_name)}</div><div class="text-xs text-slate-400 max-w-[15rem]">${esc(rentPositionText(r.p) || r.p.unit_name || '')}</div>` },
      { key: 'start', label: 'ช่วงที่มีสิทธิ์', class: 'whitespace-nowrap', render: r => `<div class="text-sm text-slate-600">${period(r.e)}</div><div class="text-xs text-slate-400">${RENT_HOUSING[r.e.housing_type]}</div>` },
      { key: 'limit', label: 'สิทธิ์/เดือน', class: 'whitespace-nowrap', render: r => `<div class="tabular-nums font-medium text-slate-700">${rentMoney(rentLimit(r.e))}</div><div class="text-xs text-slate-400">อัตรา ${rentMoney(r.e.rate_cap)}${+r.e.monthly_rent ? ` · ค่าเช่า ${rentMoney(r.e.monthly_rent)}` : ''}</div>` },
      { key: 'contract', label: 'สัญญาสิ้นสุด', class: 'whitespace-nowrap', render: r => `<div class="text-sm">${contract(r.e)}</div>` },
      { key: 'order_no', label: 'คำสั่ง', render: r => `<div class="text-xs text-slate-600 max-w-[10rem]">${esc(r.e.order_no || '-')}</div>` },
      { key: '_paid', label: 'เบิกแล้วปีนี้', class: 'whitespace-nowrap', render: r => `<span class="tabular-nums">${rentMoney(r._paid)}</span>` },
    ],
    actions, emptyText: `ยังไม่มีผู้มีสิทธิ์ในปีงบประมาณ ${Rg.fy}`,
  });
  table.setRows(rows);
  body.onclick = (ev) => {
    if (ev.target.closest('[data-rg-act="add-ent"]')) { rentPickPerson(el); return; }
    const a = ev.target.closest('[data-el-ent]'); if (a) { rentOpenEnt(Rg.ents.find(x => x.id === a.dataset.elEnt), null, el); return; }
    const b = ev.target.closest('[data-el-person]'); if (b) { rentOpenPerson(rentPerson(b.dataset.elPerson), el); return; }
    const vw = ev.target.closest('[data-el-view]'); if (vw) { Rg.person = vw.dataset.elView; Rg.tab = 'register'; rentRender(el); return; }
    const c = ev.target.closest('[data-el-print]'); if (c) rentPrint('person', [c.dataset.elPrint], 'print');
  };
}

/* ---------- เลือกบุคลากรเพื่อเพิ่มสิทธิ์ ---------- */
function rentPickPerson(el) {
  const has = new Set(Rg.ents.map(e => e.person_id));
  const avail = Rg.people.filter(p => p.is_active && !has.has(p.id));
  const m = openModal({ title: `เพิ่มผู้มีสิทธิ์ค่าเช่าบ้าน ปีงบ ${Rg.fy}`, icon: 'user-plus', size: 'md',
    body: avail.length ? `<input type="search" class="input mb-3" placeholder="ค้นหาชื่อ..." data-pk-q>
      <div class="grid gap-1.5 max-h-[55vh] overflow-y-auto" data-pk-list></div>
      <p class="text-xs text-slate-400 mt-3">ไม่พบชื่อ? เพิ่มบุคลากรได้ที่แท็บ "บุคลากร"</p>`
      : emptyState('ไม่มีบุคลากรที่ยังไม่ได้รับสิทธิ์ในปีนี้ · ไปที่แท็บ "บุคลากร" เพื่อดึงรายชื่อจากสลิปเงินเดือนหรือเพิ่มเอง', 'users') });
  const draw = (q = '') => { const box = $('[data-pk-list]', m.el); if (!box) return;
    const list = avail.filter(p => !q || p.full_name.includes(q) || (p.position_title || '').includes(q));
    box.innerHTML = list.map(p => { const r = rentRateFor(p, rentMonthFirst(Rg.fy - 544, 10)); return `<button type="button" class="text-left rounded-2xl border border-slate-100 px-3 py-2 hover:border-brand-200 hover:bg-brand-50/50" data-pk="${p.id}">
      <div class="font-medium text-slate-700">${esc(p.full_name)}</div><div class="text-xs text-slate-400">${esc([p.employee_type, rentPositionText(p)].filter(Boolean).join(' · '))}</div>
      <div class="text-xs ${r.ok ? 'text-mint-600' : 'text-cream-600'}">${r.ok ? `สิทธิ์ตามบัญชี เดือนละไม่เกิน ${rentMoney(r.rate)} บาท` : esc(r.msg)}</div></button>`; }).join('') || emptyState('ไม่พบชื่อ', 'search-x'); };
  draw();
  m.el.addEventListener('input', (e) => { if (e.target.matches('[data-pk-q]')) draw(e.target.value.trim()); });
  m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-pk]'); if (b) { m.close(); rentOpenEnt(null, rentPerson(b.dataset.pk), el); } });
}

/* ---------- สิทธิ์รายปี (เพิ่ม/แก้ไข) ---------- */
function rentOpenEnt(ent, person, el) {
  const e = ent || {}, p = person || rentPerson(e.person_id); if (!p) return;
  const fyStart = rentMonthFirst(Rg.fy - 544, 10);
  const rate = rentRateFor(p, e.start_date && e.start_date > fyStart ? e.start_date : fyStart);
  const m = openModal({
    title: `${ent ? 'สิทธิ์ค่าเช่าบ้าน' : 'เพิ่มสิทธิ์ค่าเช่าบ้าน'} · ${esc(p.full_name)}`, icon: 'home', size: 'lg',
    body: `<div class="rounded-2xl bg-slate-50 border border-slate-100 px-3 py-2 mb-3 text-sm">
        <div class="text-slate-700">${esc([p.employee_type, rentPositionText(p), p.unit_name].filter(Boolean).join(' · ') || 'ยังไม่ได้ระบุตำแหน่ง')}</div>
        <div class="text-xs mt-0.5 ${rate.ok ? 'text-mint-600' : 'text-cream-600'}">${ic(rate.ok ? 'check-circle-2' : 'alert-triangle', 'w-3.5 h-3.5 inline')} ${esc(rate.ok ? rate.text : rate.msg + ' – แก้ไขได้ที่แท็บ "บุคลากร" หรือกรอกอัตราเอง')}</div></div>
      <form class="grid gap-3 sm:grid-cols-2" novalidate>
        <div><label class="label">ปีงบประมาณ</label><input class="input" value="${Rg.fy}" disabled></div>
        <div><label class="label">ประเภท</label><select class="input" name="housing_type">${Object.entries(RENT_HOUSING).map(([k, l]) => `<option value="${k}" ${k === (e.housing_type || 'rent') ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div><label class="label">มีสิทธิ์ตั้งแต่วันที่ *</label><input type="date" class="input" name="start_date" value="${esc(e.start_date || fyStart)}" max="${rentMonthLast(Rg.fy - 543, 9)}">
          <p class="text-xs text-slate-400 mt-1">กรอกย้อนหลังได้ (เช่น วันที่ได้รับสิทธิ์ครั้งแรก) · ทะเบียนปีนี้คุมเฉพาะเดือน ต.ค.–ก.ย. ของปีงบ ${Rg.fy}</p></div>
        <div><label class="label">สิ้นสุดสิทธิ์ (ถ้ามี)</label><input type="date" class="input" name="end_date" value="${esc(e.end_date || '')}"></div>
        <div><label class="label">ค่าเช่า/ค่าผ่อนจริงต่อเดือน</label><input class="input" inputmode="decimal" name="monthly_rent" value="${esc(e.monthly_rent ?? '')}" placeholder="0.00"></div>
        <div><label class="label">สิทธิ์เบิก เดือนละไม่เกิน *</label><div class="flex gap-2"><input class="input" inputmode="decimal" name="rate_cap" value="${esc(e.rate_cap ?? (rate.ok ? rate.rate : ''))}" placeholder="0.00">
          ${rate.ok ? `<button type="button" class="btn btn-soft btn-sm shrink-0" data-use-rate title="ใช้อัตราตามบัญชี">${ic('wand-2', 'w-4 h-4')}</button>` : ''}</div></div>
        <div class="sm:col-span-2 text-xs text-slate-500" data-limit></div>
        <div><label class="label">สัญญาเริ่ม</label><input type="date" class="input" name="contract_start" value="${esc(e.contract_start || '')}"></div>
        <div><label class="label">สัญญาสิ้นสุด</label><input type="date" class="input" name="contract_end" value="${esc(e.contract_end || '')}"></div>
        <div class="sm:col-span-2"><label class="label">ที่อยู่บ้านเช่า</label><input class="input" name="address" value="${esc(e.address || '')}"></div>
        <div class="sm:col-span-2"><label class="label">คำสั่ง/หนังสืออนุมัติสิทธิ์</label><input class="input" name="order_no" value="${esc(e.order_no || '')}" placeholder="เช่น ที่ 123/2569 ลว. 1 ต.ค. 2569"></div>
        <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input class="input" name="note" value="${esc(e.note || '')}"></div>
      </form>
      ${ent ? `<div class="mt-4"><div class="text-sm font-medium text-slate-700 mb-1">การเบิกปีงบ ${Rg.fy}</div><div class="grid grid-cols-3 sm:grid-cols-4 gap-1.5">${rentMonths(Rg.fy).map(mo => { const c = rentClaim(e.id, mo.y, mo.m);
        return `<div class="rounded-xl border ${c ? (c.status === 'paid' ? 'border-mint-200 bg-mint-50' : 'border-cream-200 bg-cream-50') : 'border-slate-100'} px-2 py-1 text-center"><div class="text-[10px] text-slate-500">${mo.label}</div><div class="text-xs tabular-nums">${c ? rentMoney(c.amount) : '–'}</div></div>`; }).join('')}</div></div>` : ''}`,
    footer: `${ent ? `<button type="button" class="btn btn-danger mr-auto" data-del>${ic('trash-2')} ลบสิทธิ์ปีนี้</button><button type="button" class="btn btn-ghost" data-print-one>${ic('printer')} พิมพ์รายบุคคล</button>` : ''}
      <button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>`,
  });
  const F = $('form', m.el).elements;
  const showLimit = () => { const cap = trvNum(F.rate_cap.value), rent = trvNum(F.monthly_rent.value);
    $('[data-limit]', m.el).innerHTML = cap ? `เบิกได้เดือนละไม่เกิน <b class="text-slate-700">${rentMoney(rent > 0 ? Math.min(cap, rent) : cap)} บาท</b> ${rent > 0 && rent < cap ? '(ตามค่าเช่าจริง)' : ''}` : ''; };
  showLimit();
  m.el.addEventListener('input', showLimit);
  $('[data-use-rate]', m.el)?.addEventListener('click', () => { F.rate_cap.value = rate.rate; showLimit(); });
  $('[data-print-one]', m.el)?.addEventListener('click', () => rentPrint('person', [ent.id], 'print'));
  $('[data-del]', m.el)?.addEventListener('click', async () => {
    const n = Rg.claims.filter(c => c.entitlement_id === ent.id).length;
    if (!(await confirmModal({ title: 'ลบสิทธิ์ค่าเช่าบ้าน', message: `ลบสิทธิ์ปีงบ ${Rg.fy} ของ <b>${esc(p.full_name)}</b>${n ? ` และรายการเบิก <b>${n}</b> เดือน` : ''} ใช่หรือไม่?` }))) return;
    const r = await rpcSecure('sfh_rent_ent_delete', { p_id: ent.id }, { loaderText: 'กำลังลบ...', error: 'ลบไม่สำเร็จ', success: 'ลบสิทธิ์แล้ว' });
    if (r.ok) { m.close(); rentRefresh(el); }
  });
  $('[data-save]', m.el).onclick = async () => {
    const data = { person_id: p.id, fiscal_year: Rg.fy };
    ['housing_type', 'start_date', 'end_date', 'monthly_rent', 'rate_cap', 'contract_start', 'contract_end', 'address', 'order_no', 'note'].forEach(k => { data[k] = String(F[k].value ?? '').trim().replace(/,/g, k === 'monthly_rent' || k === 'rate_cap' ? '' : ','); });
    if (!data.start_date) { showToast('กรุณาระบุวันที่มีสิทธิ์', 'warning'); return; }
    if (!(trvNum(data.rate_cap) > 0)) { showToast('กรุณาระบุสิทธิ์เบิก (เดือนละไม่เกิน)', 'warning'); F.rate_cap.focus(); return; }
    if (rate.ok && trvNum(data.rate_cap) > rate.rate && !(await confirmModal({ title: 'อัตราสูงกว่าบัญชี', danger: false, icon: 'alert-triangle', confirmText: 'บันทึกต่อ',
      message: `อัตราที่กรอก (${rentMoney(data.rate_cap)}) สูงกว่าบัญชีอัตรา (${rentMoney(rate.rate)}) ต้องการบันทึกต่อหรือไม่?` }))) return;
    if (ent && !(await rentConfirmEdit(`ยืนยันแก้ไขสิทธิ์ค่าเช่าบ้าน · ${p.full_name}`, ent, data, RENT_ENT_FIELDS))) return;
    const r = await rpcSecure('sfh_rent_ent_save', { p_id: ent?.id || null, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกสิทธิ์แล้ว' });
    if (r.ok) { m.close(); rentRefresh(el); }
  };
}

/* ---------- บันทึกการเบิกรายเดือน ---------- */
function rentOpenClaim(e, y, m, el) {
  if (!e) return;
  const p = rentPerson(e.person_id) || {}, c = rentClaim(e.id, y, m), sg = rentSuggest(e, y, m), cov = rentCovered(e, y, m);
  const label = `${TH_MONTHS[m - 1]} ${y + 543}`;
  const md = openModal({
    title: `ค่าเช่าบ้าน ${label}`, icon: 'receipt', size: 'md',
    body: `<div class="rounded-2xl bg-slate-50 border border-slate-100 px-3 py-2 mb-3 text-sm">
        <div class="font-medium text-slate-700">${esc(p.full_name)}</div>
        <div class="text-xs text-slate-500">เบิกได้เดือนละไม่เกิน ${rentMoney(sg.limit)} บาท${sg.prorated ? ` · เดือนนี้มีสิทธิ์ ${sg.days}/${sg.dim} วัน → ${rentMoney(sg.amount)} บาท` : ''}</div>
        ${!cov ? `<div class="text-xs text-blush-500 mt-1">${ic('alert-triangle', 'w-3.5 h-3.5 inline')} เดือนนี้อยู่นอกช่วงที่มีสิทธิ์ (บันทึกใหม่ไม่ได้ ลบได้อย่างเดียว)</div>` : ''}</div>
      <form class="grid gap-3 sm:grid-cols-2" novalidate>
        <div class="sm:col-span-2"><label class="label">จำนวนเงินที่เบิก *</label><input class="input text-lg" inputmode="decimal" name="amount" value="${esc(c ? c.amount : sg.amount)}"></div>
        <div class="sm:col-span-2"><label class="label">สถานะ</label><div class="grid grid-cols-2 gap-2">${Object.entries(RENT_STATUS).map(([k, s]) => `<label class="flex items-center justify-center gap-2 rounded-2xl border px-3 py-2 text-sm cursor-pointer has-[:checked]:border-brand-300 has-[:checked]:bg-brand-50 has-[:checked]:text-brand-700 border-slate-200 text-slate-600">
          <input type="radio" name="status" value="${k}" class="sr-only" ${k === (c?.status || 'paid') ? 'checked' : ''}>${s.label}</label>`).join('')}</div></div>
        <div><label class="label">เลขที่ฎีกา/ใบสำคัญ</label><input class="input" name="doc_no" value="${esc(c?.doc_no || '')}"></div>
        <div><label class="label">วันที่วางฎีกา</label><input type="date" class="input" name="paid_date" value="${esc(c?.paid_date || '')}"></div>
        <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input class="input" name="note" value="${esc(c?.note || '')}"></div>
      </form>${c?.updated_by_name ? `<p class="text-xs text-slate-400 mt-2">บันทึกล่าสุดโดย ${esc(c.updated_by_name)} · ${timeAgo(c.updated_at)}</p>` : ''}`,
    footer: `${c ? `<button type="button" class="btn btn-danger mr-auto" data-del>${ic('trash-2')} ลบ</button>` : ''}<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button>
      ${cov ? `<button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` : ''}`,
  });
  const F = $('form', md.el).elements;
  $('[data-del]', md.el)?.addEventListener('click', async () => {
    if (!(await confirmModal({ title: 'ลบรายการเบิก', message: `ลบรายการเบิกเดือน${label} ของ <b>${esc(p.full_name)}</b> ใช่หรือไม่?` }))) return;
    const r = await rpcSecure('sfh_rent_claim_delete', { p_id: c.id }, { loaderText: 'กำลังลบ...', error: 'ลบไม่สำเร็จ', success: 'ลบรายการแล้ว' });
    if (r.ok) { md.close(); rentRefresh(el); }
  });
  $('[data-save]', md.el)?.addEventListener('click', async () => {
    const amount = trvNum(F.amount.value);
    if (!(amount > 0)) { showToast('กรุณาระบุจำนวนเงิน', 'warning'); F.amount.focus(); return; }
    if (amount > sg.limit) { showToast(`จำนวนเงินเกินสิทธิ์ (เดือนละไม่เกิน ${rentMoney(sg.limit)} บาท)`, 'warning'); return; }
    const data = { amount, status: F.status.value, doc_no: F.doc_no.value.trim() || null, paid_date: F.paid_date.value || null, note: F.note.value.trim() || null };
    if (c && !(await rentConfirmEdit(`ยืนยันแก้ไขการเบิก${label} · ${p.full_name}`, c, data, RENT_CLAIM_FIELDS))) return;
    const r = await rpcSecure('sfh_rent_claim_save', { p_ent_id: e.id, p_year: y, p_month: m, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกการเบิกแล้ว' });
    if (r.ok) { md.close(); rentRefresh(el); }
  });
  setTimeout(() => F.amount?.select(), 120);
}

/* ---------- บันทึกประจำเดือน (หลายคนพร้อมกัน) ---------- */
function rentOpenBatch(el) {
  const months = rentMonths(Rg.fy), today = calToday();
  const def = months.filter(mo => rentMonthFirst(mo.y, mo.m) <= today).at(-1) || months[0];
  const md = openModal({
    title: 'บันทึกการเบิกประจำเดือน', icon: 'calendar-check', size: 'xl',
    body: `<div class="grid gap-3 sm:grid-cols-4 mb-3">
        <div><label class="label">เดือน</label><select class="input" data-b-month>${months.map(mo => `<option value="${mo.y}|${mo.m}" ${mo.key === def.key ? 'selected' : ''}>${TH_MONTHS[mo.m - 1]} ${mo.y + 543}</option>`).join('')}</select></div>
        <div><label class="label">สถานะ</label><select class="input" data-b-status>${Object.entries(RENT_STATUS).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join('')}</select></div>
        <div><label class="label">เลขที่ฎีกา (ทุกคน)</label><input class="input" data-b-doc></div>
        <div><label class="label">วันที่วางฎีกา</label><input type="date" class="input" data-b-date></div>
      </div><div data-b-list></div>`,
    footer: `<span class="mr-auto text-sm text-slate-600" data-b-sum></span><button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>`,
  });
  const draw = () => {
    const [y, m] = $('[data-b-month]', md.el).value.split('|').map(Number);
    const rows = rentRows().filter(({ e }) => rentCovered(e, y, m));
    $('[data-b-list]', md.el).innerHTML = rows.length ? `<div class="overflow-x-auto rounded-2xl border border-slate-100"><table class="sfh-table w-full text-sm">
      <thead class="bg-slate-50 text-slate-500"><tr><th class="w-10"><input type="checkbox" class="rounded" data-b-all checked></th><th>ชื่อ-สกุล</th><th class="text-right">สิทธิ์</th><th class="text-right w-40">จำนวนเงิน</th><th>สถานะเดิม</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${rows.map(({ e, p }) => { const c = rentClaim(e.id, y, m), sg = rentSuggest(e, y, m);
        return `<tr><td><input type="checkbox" class="rounded" data-b-chk="${e.id}" ${c ? '' : 'checked'}></td><td>${esc(p.full_name)}${sg.prorated ? `<div class="text-[11px] text-cream-600">ตามส่วน ${sg.days}/${sg.dim} วัน</div>` : ''}</td>
          <td class="text-right tabular-nums">${rentMoney(sg.limit)}</td><td><input class="input !py-1 text-right" inputmode="decimal" data-b-amt="${e.id}" value="${c ? c.amount : sg.amount}"></td>
          <td>${c ? `<span class="badge ${RENT_STATUS[c.status].cls}">${RENT_STATUS[c.status].label} ${rentMoney(c.amount)}</span>` : '<span class="text-xs text-slate-400">ยังไม่บันทึก</span>'}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="text-xs text-slate-400 mt-2">รายการที่บันทึกแล้วจะไม่ถูกเลือกไว้ (ติ๊กเพื่อบันทึกทับ)</p>` : emptyState('ไม่มีผู้มีสิทธิ์ในเดือนนี้', 'users');
    sum();
  };
  const sum = () => { const chk = $$('[data-b-chk]:checked', md.el); const tot = chk.reduce((a, x) => a + trvNum($(`[data-b-amt="${x.dataset.bChk}"]`, md.el).value), 0);
    $('[data-b-sum]', md.el).textContent = `เลือก ${chk.length} คน · รวม ${rentMoney(tot)} บาท`; };
  draw();
  md.el.addEventListener('change', (ev) => {
    if (ev.target.matches('[data-b-month]')) draw();
    if (ev.target.matches('[data-b-all]')) { $$('[data-b-chk]', md.el).forEach(x => { x.checked = ev.target.checked; }); sum(); }
    if (ev.target.matches('[data-b-chk]')) sum();
  });
  md.el.addEventListener('input', (ev) => { if (ev.target.matches('[data-b-amt]')) sum(); });
  $('[data-save]', md.el).onclick = async () => {
    const [y, m] = $('[data-b-month]', md.el).value.split('|').map(Number);
    const items = $$('[data-b-chk]:checked', md.el).map(x => ({ entitlement_id: x.dataset.bChk, year: y, month: m, amount: trvNum($(`[data-b-amt="${x.dataset.bChk}"]`, md.el).value),
      status: $('[data-b-status]', md.el).value, doc_no: $('[data-b-doc]', md.el).value.trim() || null, paid_date: $('[data-b-date]', md.el).value || null }));
    if (!items.length) { showToast('กรุณาเลือกอย่างน้อย 1 คน', 'warning'); return; }
    const bad = items.find(it => { const e = Rg.ents.find(x => x.id === it.entitlement_id); return !(it.amount > 0) || it.amount > rentLimit(e); });
    if (bad) { showToast(`จำนวนเงินของ ${rentPerson(Rg.ents.find(x => x.id === bad.entitlement_id).person_id).full_name} ไม่ถูกต้องหรือเกินสิทธิ์`, 'warning'); return; }
    const r = await rpcSecure('sfh_rent_claim_batch', { p_items: items }, { loaderText: `กำลังบันทึก ${items.length} รายการ...`, error: 'บันทึกไม่สำเร็จ' });
    if (r.ok) { showToast(`บันทึกการเบิก ${r.data.saved} รายการแล้ว`, 'success'); md.close(); rentRefresh(el); }
  };
}

  const upd = () => { const t = types.find(x => x.key === F.position_type.value); $('[data-step]', m.el).classList.toggle('hidden', t?.by === 'salary');
    const r = rentRateFor(vals()); $('[data-rate]', m.el).innerHTML = `<span class="${r.ok ? 'text-mint-600' : 'text-cream-600'}">${ic(r.ok ? 'check-circle-2' : 'info', 'w-4 h-4 inline')} ${esc(r.ok ? r.text : r.msg)}</span>`; refreshIcons(); };
  F.position_type.addEventListener('change', () => { F.position_level.innerHTML = `<option value="">– เลือก –</option>${lvOpts(F.position_type.value, '')}`; upd(); });
  m.el.addEventListener('input', upd); m.el.addEventListener('change', upd); upd();
  $('[data-save]', m.el).onclick = async () => {

    if (r.ok) { m.close(); rentRefresh(el); }

      <table class="w-full text-xs"><tbody class="divide-y divide-slate-100">${t.levels.map(l => `<tr><td class="px-3 py-1.5 text-slate-600 whitespace-nowrap align-top">${esc(l.name)}</td>

function rentOpenRates(src, el) {
  if (!requirePermission('register.manage_rates')) return;
  const cfg = JSON.parse(JSON.stringify(src.config));
  const tierRow = (ti, li, x, i, by) => `<div class="grid grid-cols-[1fr,1fr,1fr,auto] gap-1.5 items-center" data-tier>
    <input class="input !py-1 !text-xs text-right" inputmode="decimal" placeholder="${by === 'salary' ? 'เงินเดือนตั้งแต่' : 'ขั้นตั้งแต่'}" value="${x.min ?? ''}" data-k="min">
    <input class="input !py-1 !text-xs text-right" inputmode="decimal" placeholder="ถึง (ว่าง = ขึ้นไป)" value="${x.max ?? ''}" data-k="max">
    <input class="input !py-1 !text-xs text-right" inputmode="decimal" placeholder="บาท/เดือน" value="${x.rate ?? ''}" data-k="rate">
    <button type="button" class="btn-icon !w-7 !h-7" data-rm-tier>${ic('x', 'w-3.5 h-3.5')}</button></div>`;
  const m = openModal({ title: 'แก้ไขบัญชีอัตราค่าเช่าบ้าน', icon: 'list-ordered', size: 'xl',
    body: `<div class="grid gap-3 sm:grid-cols-2 mb-4">
        <div class="sm:col-span-2"><label class="label">ชื่อชุดอัตรา</label><input class="input" data-f="name" value="${esc(src.name)}"></div>
        <div class="sm:col-span-2"><label class="label">อ้างอิง</label><input class="input" data-f="reference" value="${esc(src.reference || '')}"></div>
        <div><label class="label">มีผลตั้งแต่ (ว่าง = ชุดตั้งต้น)</label><input type="date" class="input" data-f="effective_from" value="${esc(src.effective_from || '')}"></div>
        <div><label class="label">หมายเหตุ</label><input class="input" data-f="note" value="${esc(src.note || '')}"></div></div>
      <p class="text-xs text-slate-500 mb-2">แต่ละแถว: ตั้งแต่ – ถึง (เว้น "ถึง" ว่าง = ขึ้นไป) → ค่าเช่าบ้านไม่เกินเดือนละ (บาท)</p>
      <div class="grid gap-3 lg:grid-cols-2">${cfg.types.map((t, ti) => `<div class="rounded-2xl border border-slate-100 p-3"><div class="font-medium text-slate-700 mb-2">${esc(t.name)}</div>
        ${t.levels.map((l, li) => `<div class="mb-3" data-level="${ti}|${li}"><div class="flex items-center justify-between text-sm text-slate-600 mb-1">${esc(l.name)}<button type="button" class="btn btn-ghost btn-sm !py-0.5" data-add-tier>${ic('plus', 'w-3.5 h-3.5')} แถว</button></div>
          <div class="grid gap-1.5" data-tiers>${l.tiers.map((x, i) => tierRow(ti, li, x, i, t.by)).join('')}</div></div>`).join('')}</div>`).join('')}</div>`,
    footer: `<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` });
  m.el.addEventListener('click', (ev) => {
    const add = ev.target.closest('[data-add-tier]'); if (add) { const lv = add.closest('[data-level]'), [ti, li] = lv.dataset.level.split('|').map(Number);
      $('[data-tiers]', lv).insertAdjacentHTML('beforeend', tierRow(ti, li, {}, 0, cfg.types[ti].by)); refreshIcons(); return; }
    const rm = ev.target.closest('[data-rm-tier]'); if (rm) rm.closest('[data-tier]').remove();
  });
  $('[data-save]', m.el).onclick = async () => {
    const num = (v) => { const s = String(v).replace(/,/g, '').trim(); if (s === '') return null; const n = Number(s); return isFinite(n) && n >= 0 ? n : NaN; };
    let err = '';
    $$('[data-level]', m.el).forEach(lv => {
      const [ti, li] = lv.dataset.level.split('|').map(Number), name = `${cfg.types[ti].name} ${cfg.types[ti].levels[li].name}`;
      const tiers = $$('[data-tier]', lv).map(r => ({ min: num($('[data-k=min]', r).value), max: num($('[data-k=max]', r).value), rate: num($('[data-k=rate]', r).value) }));
      if (!tiers.length) err = err || `${name}: ต้องมีอย่างน้อย 1 แถว`;
      tiers.forEach(x => { if ([x.min, x.max, x.rate].some(Number.isNaN) || !(x.rate > 0)) err = err || `${name}: ตัวเลขไม่ถูกต้อง`; if (x.min != null && x.max != null && x.max < x.min) err = err || `${name}: "ถึง" ต้องไม่น้อยกว่า "ตั้งแต่"`; });
      cfg.types[ti].levels[li].tiers = tiers.sort((a, b) => (a.min ?? -1) - (b.min ?? -1));
    });
    if (err) { showToast(err, 'warning', 5000); return; }
    const f = (k) => $(`[data-f="${k}"]`, m.el).value.trim();
    const r = await rpcSecure('sfh_rent_rates_save', { p_id: src.id, p_data: { name: f('name'), reference: f('reference') || null, effective_from: f('effective_from') || null, note: f('note') || null, is_active: true, config: cfg } },
      { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกบัญชีอัตราแล้ว' });
    if (r.ok) { m.close(); Rg.rates = []; rentRefresh(el); }

/** ผูกการทำงานของตัวเลือกในหน้าต่าง · คืน selected(): null = ทุกคน, Set(id) = เลือกรายคน, false = ยังไม่ได้เลือก (แจ้งเตือนแล้ว) */
function rgPickerBind(root, people) {
  const picking = () => $('input[name="who"]:checked', root).value === 'pick';
  const checked = () => $$('[data-plist] input:checked', root).map(x => x.value);
  const sync = () => { $('[data-pickbox]', root).classList.toggle('hidden', !picking()); $('[data-pcount]', root).textContent = `เลือกแล้ว ${checked().length} จาก ${people.length} คน`; };
  root.addEventListener('change', sync);
  root.addEventListener('input', (e) => { if (!e.target.matches('[data-pq]')) return; const q = e.target.value.trim().toLowerCase(); $$('[data-prow]', root).forEach(r => r.classList.toggle('hidden', !!q && !r.dataset.prow.includes(q))); });
  root.addEventListener('click', (e) => {
    if (e.target.closest('[data-pall]')) { $$('[data-prow]:not(.hidden) input', root).forEach(x => { x.checked = true; }); sync(); }
    if (e.target.closest('[data-pnone]')) { $$('[data-plist] input', root).forEach(x => { x.checked = false; }); sync(); }
  });
  sync();
  return { selected: () => { if (!picking()) return null; const ids = new Set(checked()); if (!ids.size) { showToast('กรุณาเลือกอย่างน้อย 1 คน', 'warning'); return false; } return ids; } };
}

async function rentPrint(kind, entIds, mode, opts = {}) {
  const { root, orientation, count } = rentBuildPages(kind, entIds, opts);
  if (!count) { showToast('ไม่มีข้อมูลสำหรับพิมพ์', 'warning'); return; }
  rpcSecure('sfh_rent_log', { p_kind: `${mode}_${kind}`, p_details: { fiscal_year: Rg.fy, count, ...(kind === 'month' ? { year: opts.y, month: opts.m } : {}) } }, { loader: false });
  if (mode === 'pdf') {
    const label = kind === 'summary' ? 'รวม' : kind === 'month' ? `ประจำเดือน${TH_MONTHS[opts.m - 1]}${opts.y + 543}`
      : (() => { const ids = new Set((entIds || []).map(id => Rg.ents.find(e => e.id === id)?.person_id)); return ids.size === 1 ? rentPerson([...ids][0])?.full_name || 'รายบุคคล' : 'รายบุคคล'; })();
    await sfhPagesToPdf($$('.rg-page', root), `ทะเบียนค่าเช่าบ้าน_${label}_ปีงบ${Rg.fy}.pdf`, orientation);
    root.innerHTML = '';
    return;
  }
  let pg = $('#rg-page-size'); if (!pg) { pg = document.createElement('style'); pg.id = 'rg-page-size'; document.head.appendChild(pg); }
  pg.textContent = `@media print{@page{size:A4 ${orientation};margin:0}}`;
  document.body.classList.add('rg-printing');
  const done = () => { document.body.classList.remove('rg-printing'); root.innerHTML = ''; pg.textContent = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 150);
}
/** แปลงหน้าเอกสาร (A4) หลายหน้าเป็นไฟล์ PDF – ใช้ตัวแปลงเดียวกับโปรแกรมคำนวณค่าใช้จ่ายไปราชการ */

    <div class="flex items-center justify-between gap-2 mb-2"><p class="text-xs text-slate-500">เจ้าหน้าที่ ${groups.length} คน · บุตร ${shown.length} คน${q ? ' (ผลการค้นหา – ขยายให้อัตโนมัติ)' : ''}</p><div class="flex gap-1">${eduExpandBtns('ed')}</div></div>

      <tbody class="divide-y divide-slate-100">${groups.map(g => personRow(g) + (isOpen(g.p.id) ? g.kids.map(childRow).join('') : '')).join('') || `<tr><td colspan="8">${emptyState('ไม่พบตามคำค้น', 'search-x')}</td></tr>`}</tbody>

        <td class="text-right tabular-nums">${rentMoney(kidsTotal(shown))}</td><td colspan="2"></td></tr></tfoot></table></div>
    <div class="md:hidden grid gap-2">${groups.map(g => { const open = isOpen(g.p.id); return `<div class="card !p-0 overflow-hidden">
      <button type="button" class="w-full text-left flex items-center gap-2 px-4 py-3" data-ed-toggle="${g.p.id}"><span class="text-slate-400 transition ${open ? 'rotate-90' : ''}">${ic('chevron-right', 'w-4 h-4')}</span>

        <span class="font-semibold tabular-nums">${rentMoney(kidsTotal(g.kids))}</span></button>
      ${open ? `<div class="border-t border-slate-100 bg-slate-50/50 p-3 grid gap-2">${g.kids.map(c => { const tot = eduTotal(c.id), cap = eduCap(c.id); return `<div class="rounded-2xl bg-white border border-slate-100 p-3">
        <button type="button" class="text-left w-full" data-ed-child="${c.id}"><div class="flex justify-between gap-2"><span class="font-medium text-slate-800">${esc(c.full_name)}</span><span class="font-semibold tabular-nums">${rentMoney(tot)}</span></div>
          <div class="text-xs text-slate-400">${cap != null ? `เพดาน ${rentMoney(cap)} · คงเหลือ ${rentMoney(Math.max(0, cap - tot))}` : 'ยังไม่มีรายการเบิก'}</div></button>
        <div class="grid grid-cols-3 gap-1.5 mt-2">${['1', '2', 'year'].map(s => { const x = eduClaim(c.id, s); return `<button type="button" class="rounded-xl border px-1 py-1.5 text-center ${x ? (x.status === 'paid' ? 'border-mint-200 bg-mint-50' : 'border-cream-200 bg-cream-50') : 'border-slate-200 bg-white'}" data-ed-cell="${c.id}|${s}">

    </div>`; }).join('')}</div>`}
    <p class="text-xs text-slate-400 mt-3">${ic('info', 'w-3.5 h-3.5 inline')} กดชื่อเจ้าหน้าที่เพื่อขยายดูบุตร · กดช่องภาคเรียนเพื่อบันทึก/แก้ไข · เพดานคุมรวมทั้งปีการศึกษา</p>`;
  body.oninput = debounce((e) => { if (e.target.matches('[data-ed-q]')) { Ed.filter = e.target.value; const pos = e.target.selectionStart; eduRenderRegister(body, el); refreshIcons(); const q2 = $('[data-ed-q]', body); q2.focus(); q2.setSelectionRange(pos, pos); } }, 250);
  body.onclick = (ev) => {
    const cell = ev.target.closest('[data-ed-cell]');
    if (cell) { const [cid, sem] = cell.dataset.edCell.split('|'); eduOpenClaim(eduChild(cid), sem, el); return; }
    const ch = ev.target.closest('[data-ed-child]'); if (ch) { eduOpenChild(eduChild(ch.dataset.edChild), null, el); return; }
    const tg = ev.target.closest('[data-ed-toggle]');
    if (tg) { const id = tg.dataset.edToggle; Ed.openReg.has(id) ? Ed.openReg.delete(id) : Ed.openReg.add(id); eduRenderRegister(body, el); refreshIcons(); return; }
    const ex = ev.target.closest('[data-ed-expand]');
    if (ex) { Ed.openReg = new Set(ex.dataset.edExpand === 'all' ? groups.map(g => g.p.id) : []); eduRenderRegister(body, el); refreshIcons(); return; }
    const a = ev.target.closest('[data-ed-act]'); if (!a) return;
    if (a.dataset.edAct === 'claim') eduPickChild(el);
    if (a.dataset.edAct === 'print') eduPrintMenu('print');
    if (a.dataset.edAct === 'pdf') eduPrintMenu('pdf');
    if (a.dataset.edAct === 'excel') eduExportExcel();
  };
}
function eduPickChild(el) {
  const list = Ed.children.filter(c => c.is_active).map(c => ({ c, p: eduPerson(c.person_id) })).sort((a, b) => (a.p?.full_name || '').localeCompare(b.p?.full_name || '', 'th'));
  const m = openModal({ title: `บันทึกการเบิก ปีการศึกษา ${Ed.ay}`, icon: 'file-plus', size: 'md',
    body: list.length ? `<input type="search" class="input mb-3" placeholder="ค้นหาชื่อผู้มีสิทธิ์หรือบุตร..." data-pk-q><div class="grid gap-1.5 max-h-[55vh] overflow-y-auto" data-pk-list></div>`
      : emptyState('ยังไม่มีข้อมูลบุตร · เพิ่มได้ที่แท็บ "ผู้มีสิทธิ์และบุตร"', 'graduation-cap') });
  const draw = (q = '') => { const box = $('[data-pk-list]', m.el); if (!box) return;
    box.innerHTML = list.filter(r => !q || (r.p?.full_name + ' ' + r.c.full_name).includes(q)).map(({ c, p }) => `<button type="button" class="text-left rounded-2xl border border-slate-100 px-3 py-2 hover:border-mint-200 hover:bg-mint-50/50" data-pk="${c.id}">
      <div class="font-medium text-slate-700">${esc(c.full_name)}</div><div class="text-xs text-slate-400">${esc(p?.full_name || '')} · ${eduAge(c.birth_date) ?? '-'} ปี · เบิกแล้วปีนี้ ${rentMoney(eduTotal(c.id))}</div></button>`).join('') || emptyState('ไม่พบ', 'search-x'); };
  draw();
  m.el.addEventListener('input', (e) => { if (e.target.matches('[data-pk-q]')) draw(e.target.value.trim()); });
  m.el.addEventListener('click', (e) => { const b = e.target.closest('[data-pk]'); if (!b) return; m.close();
    const c = eduChild(b.dataset.pk), sem = ['1', '2', 'year'].find(s => !eduClaim(c.id, s) && !(s === 'year' && (eduClaim(c.id, '1') || eduClaim(c.id, '2'))) && !(s !== 'year' && eduClaim(c.id, 'year')));
    if (!sem) { showToast('บุตรคนนี้บันทึกครบทุกภาคเรียนของปีนี้แล้ว', 'info'); return; }
    eduOpenClaim(c, sem, el); });
}

/* ---------- บันทึก/แก้ไขการเบิก ---------- */
function eduOpenClaim(c, sem, el) {
  if (!c) return;
  const p = eduPerson(c.person_id) || {}, x = eduClaim(c.id, sem), prev = [...eduClaimsOf(c.id)].sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)))[0];
  const set = eduSet(), items = set?.config.items || [], groups = [...new Set(items.map(i => i.group))];
  const v = x || { semester: sem, school_name: prev?.school_name || '', school_district: prev?.school_district || '', school_province: prev?.school_province || '', grade: prev?.grade || '', rate_key: prev?.rate_key || '', status: 'paid' };
  const warns = eduWarnings(c);
  const md = openModal({ title: `${x ? 'แก้ไข' : 'บันทึก'}การเบิก · ${esc(c.full_name)}`, icon: 'graduation-cap', size: 'lg',
    body: `<div class="rounded-2xl bg-slate-50 border border-slate-100 px-3 py-2 mb-3 text-sm">
        <div class="text-slate-700">ผู้มีสิทธิ์: <b class="font-medium">${esc(p.full_name)}</b> · บุตร: ${esc(c.full_name)} ${eduAge(c.birth_date) != null ? `(อายุ ${eduAge(c.birth_date)} ปี)` : ''}</div>
        ${warns.length ? `<ul class="text-xs text-blush-500 mt-1 list-disc pl-4">${warns.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : '<div class="text-xs text-mint-600 mt-0.5">ไม่พบข้อควรตรวจสอบ</div>'}</div>
      <form class="grid gap-3 sm:grid-cols-2" novalidate>
        <div><label class="label">ปีการศึกษา</label><input class="input" value="${Ed.ay}" disabled></div>
        <div><label class="label">ภาคเรียน</label><select class="input" name="semester">${Object.entries(EDU_SEM).map(([k, l]) => `<option value="${k}" ${k === v.semester ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="sm:col-span-2"><label class="label">สถานศึกษา *</label><input class="input" name="school_name" value="${esc(v.school_name)}"></div>
        <div><label class="label">อำเภอ</label><input class="input" name="school_district" value="${esc(v.school_district || '')}"></div>
        <div><label class="label">จังหวัด</label><input class="input" name="school_province" value="${esc(v.school_province || '')}"></div>
        <div class="sm:col-span-2"><label class="label">ประเภทสถานศึกษา / ระดับ *</label><select class="input" name="rate_key"><option value="">– เลือก –</option>
          ${groups.map(g => `<optgroup label="${esc(g)}">${items.filter(i => i.group === g).map(i => `<option value="${i.key}" ${i.key === v.rate_key ? 'selected' : ''}>${esc(i.name)} – ไม่เกิน ${rentMoney(i.cap)}${i.half ? ' (ครึ่งหนึ่ง)' : ''}</option>`).join('')}</optgroup>`).join('')}</select></div>
        <div><label class="label">ชั้นที่ศึกษา</label><input class="input" name="grade" value="${esc(v.grade || '')}" placeholder="เช่น ป.3"></div>
        <div><label class="label">จำนวนเงินตามใบเสร็จ *</label><input class="input" inputmode="decimal" name="amount_paid" value="${esc(v.amount_paid ?? '')}" placeholder="0.00"></div>
        <div><label class="label">คู่สมรสได้รับจากหน่วยงานอื่นแล้ว</label><input class="input" inputmode="decimal" name="spouse_received" value="${esc(+v.spouse_received ? v.spouse_received : '')}" placeholder="0.00"></div>
        <div><label class="label">จำนวนเงินที่เบิก *</label><input class="input text-lg" inputmode="decimal" name="amount_claim" value="${esc(v.amount_claim ?? '')}"></div>
        <div class="sm:col-span-2 rounded-2xl bg-mint-50 border border-mint-100 px-3 py-2 text-xs text-slate-600" data-calc></div>
        <div class="sm:col-span-2"><label class="label">สถานะ</label><div class="grid grid-cols-2 gap-2">${Object.entries(RENT_STATUS).map(([k, s]) => `<label class="flex items-center justify-center gap-2 rounded-2xl border px-3 py-2 text-sm cursor-pointer has-[:checked]:border-mint-300 has-[:checked]:bg-mint-50 has-[:checked]:text-mint-700 border-slate-200 text-slate-600">
          <input type="radio" name="status" value="${k}" class="sr-only" ${k === (v.status || 'paid') ? 'checked' : ''}>${s.label}</label>`).join('')}</div></div>
        <div><label class="label">เลขที่ฎีกา</label><input class="input" name="doc_no" value="${esc(v.doc_no || '')}"></div>
        <div><label class="label">วันที่วางฎีกา</label><input type="date" class="input" name="doc_date" value="${esc(v.doc_date || '')}"></div>
        <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input class="input" name="note" value="${esc(v.note || '')}"></div>
      </form>`,
    footer: `${x ? `<button type="button" class="btn btn-danger mr-auto" data-del>${ic('trash-2')} ลบ</button>` : ''}<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button>
      <button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` });
  const F = $('form', md.el).elements;
  let touched = !!x;
  const calc = () => {
    const it = eduItem(F.rate_key.value), paid = trvNum(F.amount_paid.value), sp = trvNum(F.spouse_received.value);
    const used = eduClaimsOf(c.id).filter(o => o.id !== x?.id).reduce((a, o) => a + (+o.amount_claim), 0);
    if (!it) { $('[data-calc]', md.el).textContent = 'เลือกประเภทสถานศึกษา/ระดับ เพื่อคำนวณยอดที่เบิกได้'; return null; }
    const base = it.half ? Math.round(paid / 2 * 100) / 100 : paid, remain = Math.max(0, it.cap - used), max = Math.max(0, Math.min(base - sp, remain));
    $('[data-calc]', md.el).innerHTML = `${it.half ? `ครึ่งหนึ่งของที่จ่ายจริง ${rentMoney(paid)} = ${rentMoney(base)}` : `ตามใบเสร็จ ${rentMoney(paid)}`}${sp ? ` − คู่สมรสได้รับแล้ว ${rentMoney(sp)}` : ''}
      · เพดานปีการศึกษา ${rentMoney(it.cap)}${used ? ` (เบิกไปแล้ว ${rentMoney(used)} คงเหลือ ${rentMoney(remain)})` : ''} → <b class="text-slate-800">เบิกได้ไม่เกิน ${rentMoney(max)} บาท</b>`;
    if (!touched) F.amount_claim.value = max || '';
    return max;
  };
  calc();
  md.el.addEventListener('input', (e) => { if (e.target.name === 'amount_claim') touched = true; calc(); });
  md.el.addEventListener('change', calc);
  $('[data-del]', md.el)?.addEventListener('click', async () => {
    if (!(await confirmModal({ title: 'ลบรายการเบิก', message: `ลบรายการ${EDU_SEM[x.semester]} ปีการศึกษา ${Ed.ay} ของ <b>${esc(c.full_name)}</b> ใช่หรือไม่?` }))) return;
    const r = await rpcSecure('sfh_edu_claim_delete', { p_id: x.id }, { loaderText: 'กำลังลบ...', error: 'ลบไม่สำเร็จ', success: 'ลบรายการแล้ว' });
    if (r.ok) { md.close(); eduRefresh(el); }
  });
  $('[data-save]', md.el).onclick = async () => {
    const max = calc(), val = (k) => String(F[k].value ?? '').trim();
    const data = { child_id: c.id, academic_year: Ed.ay, semester: val('semester'), school_name: val('school_name'), school_district: val('school_district') || null, school_province: val('school_province') || null,
      grade: val('grade') || null, rate_key: val('rate_key'), amount_paid: trvNum(val('amount_paid')), spouse_received: trvNum(val('spouse_received')), amount_claim: trvNum(val('amount_claim')),
      status: F.status.value, doc_no: val('doc_no') || null, doc_date: val('doc_date') || null, note: val('note') || null };
    if (!data.school_name) { showToast('กรุณาระบุสถานศึกษา', 'warning'); F.school_name.focus(); return; }
    if (!data.rate_key) { showToast('กรุณาเลือกประเภทสถานศึกษา/ระดับ', 'warning'); return; }
    if (!(data.amount_paid > 0)) { showToast('กรุณาระบุจำนวนเงินตามใบเสร็จ', 'warning'); F.amount_paid.focus(); return; }
    if (!(data.amount_claim > 0)) { showToast('กรุณาระบุจำนวนเงินที่เบิก', 'warning'); F.amount_claim.focus(); return; }
    if (data.amount_claim > max) { showToast(`จำนวนเงินที่เบิกเกินสิทธิ (ไม่เกิน ${rentMoney(max)} บาท)`, 'warning'); return; }
    const conflict = (data.semester === 'year' ? ['1', '2'] : ['year']).some(s => eduClaim(c.id, s) && eduClaim(c.id, s).id !== x?.id) || (eduClaim(c.id, data.semester) && eduClaim(c.id, data.semester).id !== x?.id);
    if (conflict) { showToast('ภาคเรียนนี้ซ้ำหรือขัดกับรายการเดิม (รายปี กับ ภาค 1/2 ใช้ร่วมกันไม่ได้)', 'warning'); return; }
    const w = [...warns];
    if (data.doc_date && data.doc_date > calAddDays(eduSemOpen(Ed.ay, data.semester), 365)) w.push('วันที่วางฎีกาเกิน 1 ปีนับแต่วันเปิดภาคเรียน – ตรวจสอบกำหนดเวลายื่นเบิก');
    if (w.length && !x && !(await confirmModal({ title: 'มีข้อควรตรวจสอบ', danger: false, icon: 'alert-triangle', confirmText: 'บันทึกต่อ',
      message: `<ul class="list-disc pl-5 text-sm">${w.map(s => `<li>${esc(s)}</li>`).join('')}</ul><p class="mt-2 text-sm">ต้องการบันทึกต่อหรือไม่?</p>` }))) return;
    if (x && !(await rentConfirmEdit(`ยืนยันแก้ไขการเบิก · ${c.full_name}`, x, data, EDU_CLAIM_FIELDS))) return;
    const r = await rpcSecure('sfh_edu_claim_save', { p_id: x?.id || null, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกการเบิกแล้ว' });
    if (r.ok) { md.close(); eduRefresh(el); }
  };
}

/** กรมธรรม์ล่าสุดของแต่ละทรัพย์สิน/ประเภท ที่หมดอายุแล้วหรือจะหมดใน 60 วัน (เฉพาะทรัพย์สินที่ใช้งาน) */
function insAlertRows() {
  const rows = [];
  Is.assets.filter(a => a.is_active).forEach(a => {
    const cov = insCover(a.id);
    Object.values(cov).forEach(({ p, s }) => { if (s === 'expired' || s === 'soon' || s === 'upcoming') rows.push({ a, p, s }); });
    if (!Object.keys(cov).length) rows.push({ a, p: null, s: 'none' });
  });
  return rows.sort((x, y) => (x.p?.end_date || '0').localeCompare(y.p?.end_date || '0'));
}

      <div><label class="label">เลขรหัสครุภัณฑ์</label><input class="input" name="asset_code" value="${esc(a.asset_code || '')}"></div>

      <div class="sm:col-span-2"><label class="label">ชื่อ-สกุล ผู้รับผิดชอบ</label><input class="input" name="custodian_name" value="${esc(a.custodian_name || '')}" placeholder="เช่น นายสมชาย ใจดี (พนักงานขับรถยนต์)"></div>
      <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input class="input" name="note" value="${esc(a.note || '')}"></div>

    footer: `<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` });

  m.el.addEventListener('change', sync); sync();
  $('[data-save]', m.el).onclick = async () => {
    const v = (k) => String(F[k].value ?? '').trim() || null, veh = F.asset_type.value === 'vehicle';

      asset_code: v('asset_code'), unit_name: v('unit_name'), custodian_name: v('custodian_name'), note: v('note'), is_active: F.is_active.checked };
    if (!data.name) { showToast('กรุณาระบุชื่อทรัพย์สิน', 'warning'); F.name.focus(); return; }
    if (asset && !(await rentConfirmEdit(`ยืนยันแก้ไขทรัพย์สิน · ${asset.name}`, asset, data, INS_ASSET_FIELDS))) return;
    const r = await rpcSecure('sfh_ins_asset_save', { p_id: asset?.id || null, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกทรัพย์สินแล้ว' });
    if (r.ok) { m.close(); Is.open.add(r.data.id); await insRefresh(el); if (!asset && !(await confirmModal({ title: 'เพิ่มกรมธรรม์', danger: false, icon: 'shield-plus', confirmText: 'เพิ่มกรมธรรม์', cancelText: 'ภายหลัง',
      message: `ต้องการเพิ่มกรมธรรม์ของ <b>${esc(data.name)}</b> เลยหรือไม่?` }))) return; if (!asset) insOpenPolicy(null, null, r.data.id, el); }
  };
}

/* ---------- กรมธรรม์ (เพิ่ม / แก้ไข / ต่ออายุ) ---------- */
function insOpenPolicy(policy, renewFrom, assetId, el) {
  const src = policy || renewFrom;
  const plusYear = (d) => { const x = calDate(d); x.setFullYear(x.getFullYear() + 1); return calKey(x); };
  const p = policy ? { ...policy } : renewFrom ? { asset_id: renewFrom.asset_id, policy_type: renewFrom.policy_type, coverage_class: renewFrom.coverage_class, insurer: renewFrom.insurer,
    start_date: renewFrom.end_date, end_date: plusYear(renewFrom.end_date), sum_insured: renewFrom.sum_insured, premium: renewFrom.premium, pay_status: 'pending' }
    : { asset_id: assetId || '', policy_type: insAsset(assetId)?.asset_type === 'vehicle' || !assetId ? 'compulsory' : 'property', start_date: calToday(), end_date: plusYear(calToday()), pay_status: 'pending' };
  const assets = [...Is.assets].sort((a, b) => insAssetLabel(a).localeCompare(insAssetLabel(b), 'th'));
  const claims = policy ? Is.claims.filter(c => c.policy_id === policy.id) : [];
  const m = openModal({ title: policy ? 'แก้ไขกรมธรรม์' : renewFrom ? 'ต่ออายุกรมธรรม์' : 'เพิ่มกรมธรรม์', icon: renewFrom ? 'refresh-cw' : 'shield-check', size: 'lg',
    body: `${renewFrom ? `<div class="rounded-2xl bg-cream-50 border border-cream-200 px-3 py-2 mb-3 text-xs text-cream-700">ต่ออายุจากฉบับเดิม ${esc(renewFrom.policy_no || '')} (สิ้นสุด ${formatThaiDate(calDate(renewFrom.end_date))}) · ตรวจสอบเบี้ยประกันและเลขที่กรมธรรม์ใหม่ก่อนบันทึก</div>` : ''}
      <form class="grid gap-3 sm:grid-cols-2" novalidate>
      <div class="sm:col-span-2"><label class="label">ทรัพย์สิน *</label><select class="input" name="asset_id" ${src ? 'disabled' : ''}><option value="">– เลือก –</option>${assets.map(a => `<option value="${a.id}" ${a.id === p.asset_id ? 'selected' : ''}>${esc(insAssetLabel(a))}</option>`).join('')}</select></div>
      <div><label class="label">ประเภทกรมธรรม์ *</label><select class="input" name="policy_type">${Object.entries(INS_POLICY).map(([k, l]) => `<option value="${k}" ${k === p.policy_type ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div data-class><label class="label">ชั้นประกัน</label><input class="input" name="coverage_class" value="${esc(p.coverage_class || '')}" list="isClass" placeholder="เช่น ชั้น 1"><datalist id="isClass"><option value="ชั้น 1"><option value="ชั้น 2+"><option value="ชั้น 2"><option value="ชั้น 3+"><option value="ชั้น 3"></datalist></div>
      <div class="sm:col-span-2"><label class="label">บริษัทผู้รับประกัน *</label><input class="input" name="insurer" value="${esc(p.insurer || '')}" list="isInsurers"><datalist id="isInsurers">${[...new Set(Is.policies.map(x => x.insurer))].map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div class="sm:col-span-2"><label class="label">เลขที่กรมธรรม์</label><input class="input" name="policy_no" value="${esc(p.policy_no || '')}"></div>
      <div><label class="label">เริ่มคุ้มครอง *</label><input type="date" class="input" name="start_date" value="${esc(p.start_date || '')}"></div>
      <div><label class="label">สิ้นสุดคุ้มครอง *</label><input type="date" class="input" name="end_date" value="${esc(p.end_date || '')}"></div>
      <div><label class="label">ทุนประกัน</label><input class="input" inputmode="decimal" name="sum_insured" value="${esc(+p.sum_insured ? p.sum_insured : '')}" placeholder="0.00"></div>
      <div><label class="label">เบี้ยประกัน (รวมภาษีอากร) *</label><input class="input" inputmode="decimal" name="premium" value="${esc(p.premium ?? '')}" placeholder="0.00"></div>
      <div class="sm:col-span-2"><label class="label">สถานะเบิกจ่ายเบี้ยประกัน</label><div class="grid grid-cols-2 gap-2">${Object.entries(RENT_STATUS).map(([k, s]) => `<label class="flex items-center justify-center gap-2 rounded-2xl border px-3 py-2 text-sm cursor-pointer has-[:checked]:border-cream-300 has-[:checked]:bg-cream-50 has-[:checked]:text-cream-700 border-slate-200 text-slate-600">
        <input type="radio" name="pay_status" value="${k}" class="sr-only" ${k === (p.pay_status || 'pending') ? 'checked' : ''}>${s.label}</label>`).join('')}</div></div>
      <div><label class="label">เลขที่ฎีกา</label><input class="input" name="doc_no" value="${esc(p.doc_no || '')}"></div>
      <div><label class="label">วันที่วางฎีกา</label><input type="date" class="input" name="doc_date" value="${esc(p.doc_date || '')}"></div>
      <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input class="input" name="note" value="${esc(p.note || '')}"></div></form>
      ${claims.length ? `<div class="mt-4"><div class="text-sm font-medium text-slate-700 mb-1">การเคลมของกรมธรรม์นี้</div>${claims.map(c => `<div class="text-xs text-slate-600 py-1 border-b border-slate-100">${formatThaiDate(calDate(c.incident_date))} · ${esc(c.description)} · <span class="badge ${INS_CLAIM[c.status].cls}">${INS_CLAIM[c.status].label}</span></div>`).join('')}</div>` : ''}`,
    footer: `${policy ? `<button type="button" class="btn btn-danger mr-auto" data-del>${ic('trash-2')} ลบ</button>` : ''}<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` });
  const F = $('form', m.el).elements;
  const sync = () => $('[data-class]', m.el).classList.toggle('hidden', F.policy_type.value !== 'voluntary');
  F.policy_type.addEventListener('change', sync); sync();
  F.start_date.addEventListener('change', () => { if (F.start_date.value && (!F.end_date.value || F.end_date.value <= F.start_date.value)) F.end_date.value = plusYear(F.start_date.value); });
  $('[data-del]', m.el)?.addEventListener('click', async () => {
    if (!(await confirmModal({ title: 'ลบกรมธรรม์', message: `ลบกรมธรรม์ ${INS_POLICY[policy.policy_type]} ${esc(policy.policy_no || '')} ของ <b>${esc(insAssetLabel(insAsset(policy.asset_id)))}</b> ใช่หรือไม่?${claims.length ? `<br><span class="text-xs text-blush-500">การเคลม ${claims.length} รายการจะถูกลบด้วย</span>` : ''}` }))) return;
    const r = await rpcSecure('sfh_ins_policy_delete', { p_id: policy.id }, { loaderText: 'กำลังลบ...', error: 'ลบไม่สำเร็จ', success: 'ลบกรมธรรม์แล้ว' });
    if (r.ok) { m.close(); insRefresh(el); }
  });
  $('[data-save]', m.el).onclick = async () => {
    const v = (k) => String(F[k].value ?? '').trim();
    const data = { asset_id: src ? p.asset_id : v('asset_id'), policy_type: v('policy_type'), coverage_class: v('policy_type') === 'voluntary' ? v('coverage_class') || null : null, insurer: v('insurer'),
      policy_no: v('policy_no') || null, start_date: v('start_date'), end_date: v('end_date'), sum_insured: trvNum(v('sum_insured')), premium: trvNum(v('premium')),
      pay_status: F.pay_status.value, doc_no: v('doc_no') || null, doc_date: v('doc_date') || null, note: v('note') || null };
    if (!data.asset_id) { showToast('กรุณาเลือกทรัพย์สิน', 'warning'); return; }
    if (!data.insurer) { showToast('กรุณาระบุบริษัทผู้รับประกัน', 'warning'); F.insurer.focus(); return; }
    if (!data.start_date || !data.end_date) { showToast('กรุณาระบุวันเริ่มและวันสิ้นสุดคุ้มครอง', 'warning'); return; }
    if (data.end_date < data.start_date) { showToast('วันสิ้นสุดต้องไม่ก่อนวันเริ่มคุ้มครอง', 'warning'); return; }
    const overlap = Is.policies.find(x => x.id !== policy?.id && x.asset_id === data.asset_id && x.policy_type === data.policy_type && x.start_date < data.end_date && data.start_date < x.end_date);
    if (overlap && !(await confirmModal({ title: 'ช่วงคุ้มครองซ้อนกัน', danger: false, icon: 'alert-triangle', confirmText: 'บันทึกต่อ',
      message: `มีกรมธรรม์${INS_POLICY[data.policy_type]}ของทรัพย์สินนี้ที่คุ้มครองช่วงเดียวกันอยู่แล้ว (${formatThaiDate(calDate(overlap.start_date))} – ${formatThaiDate(calDate(overlap.end_date))}) ต้องการบันทึกต่อหรือไม่?` }))) return;
    if (policy && !(await rentConfirmEdit(`ยืนยันแก้ไขกรมธรรม์ · ${insAssetLabel(insAsset(policy.asset_id))}`, policy, data, INS_POLICY_FIELDS))) return;
    const r = await rpcSecure('sfh_ins_policy_save', { p_id: policy?.id || null, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: renewFrom ? 'ต่ออายุกรมธรรม์แล้ว' : 'บันทึกกรมธรรม์แล้ว' });
    if (r.ok) { Is.open.add(data.asset_id); m.close(); insRefresh(el); }
  };
}

/* ---------- แท็บ: การเคลม ---------- */
function insRenderClaims(body, el) {
  body.innerHTML = `<div class="flex justify-end mb-3"><button class="btn btn-primary" data-is-act="add-claim" ${Is.policies.length ? '' : 'disabled'}>${ic('plus')} บันทึกการเคลม</button></div><div id="isClaims"></div>`;
  const table = createDataTable($('#isClaims', body), {
    pageSize: 15, searchKeys: ['description', 'claim_no', '_asset', '_insurer'], searchPlaceholder: 'ค้นหาเหตุ เลขที่เคลม ทรัพย์สิน บริษัท...',
    filters: [{ key: 'status', label: 'ทุกสถานะ', options: Object.entries(INS_CLAIM).map(([k, s]) => ({ value: k, label: s.label })) }],
    columns: [
      { key: 'incident_date', label: 'วันที่เกิดเหตุ', class: 'whitespace-nowrap', render: c => formatThaiDate(calDate(c.incident_date)) },
      { key: '_asset', label: 'ทรัพย์สิน / กรมธรรม์', render: c => `<div class="font-medium text-slate-700">${esc(c._asset)}</div><div class="text-xs text-slate-400">${esc(c._insurer)}</div>` },
      { key: 'description', label: 'เหตุ/ความเสียหาย', render: c => `<div class="text-sm max-w-xs">${esc(c.description)}</div>${c.claim_no ? `<div class="text-xs text-slate-400">เลขที่เคลม ${esc(c.claim_no)}</div>` : ''}` },
      { key: 'claim_amount', label: 'เรียกร้อง/จ่ายแล้ว', class: 'whitespace-nowrap text-right', render: c => `<div class="tabular-nums">${rentMoney(c.claim_amount)}</div><div class="text-xs text-mint-600 tabular-nums">${rentMoney(c.paid_amount)}</div>` },
      { key: 'status', label: 'สถานะ', render: c => `<span class="badge ${INS_CLAIM[c.status].cls}">${INS_CLAIM[c.status].label}</span>` },
    ],
    actions: (c) => `<button class="btn-icon" data-is-claim="${c.id}" title="แก้ไข">${ic('pencil')}</button>`, emptyText: 'ยังไม่มีการเคลม',
  });
  table.setRows(Is.claims.map(c => { const p = insPolicy(c.policy_id); return { ...c, _asset: insAssetLabel(insAsset(p?.asset_id)), _insurer: p ? `${INS_POLICY[p.policy_type]} · ${p.insurer}${p.policy_no ? ' · ' + p.policy_no : ''}` : '' }; }));
  body.onclick = (ev) => {
    if (ev.target.closest('[data-is-act="add-claim"]')) { insOpenClaim(null, null, el); return; }
    const c = ev.target.closest('[data-is-claim]'); if (c) insOpenClaim(Is.claims.find(x => x.id === c.dataset.isClaim), null, el);
  };
}
function insOpenClaim(claim, assetId, el) {
  const c = claim || { status: 'open', incident_date: calToday() };
  const pols = Is.policies.filter(p => !assetId || p.asset_id === assetId).sort((a, b) => b.end_date.localeCompare(a.end_date));
  const defPol = c.policy_id || pols.find(p => insState(p) !== 'upcoming' && p.start_date <= c.incident_date && c.incident_date <= p.end_date)?.id || pols[0]?.id;
  const m = openModal({ title: claim ? 'แก้ไขการเคลม' : 'บันทึกการเคลม', icon: 'file-warning', size: 'lg',
    body: `<form class="grid gap-3 sm:grid-cols-2" novalidate>
      <div class="sm:col-span-2"><label class="label">กรมธรรม์ *</label><select class="input" name="policy_id">${pols.map(p => `<option value="${p.id}" ${p.id === defPol ? 'selected' : ''}>${esc(insAssetLabel(insAsset(p.asset_id)))} · ${INS_POLICY_SHORT[p.policy_type]} · ${esc(p.insurer)} (${formatThaiDate(calDate(p.start_date))} – ${formatThaiDate(calDate(p.end_date))})</option>`).join('')}</select></div>
      <div><label class="label">วันที่เกิดเหตุ *</label><input type="date" class="input" name="incident_date" value="${esc(c.incident_date || '')}"></div>
      <div><label class="label">เลขที่เคลม</label><input class="input" name="claim_no" value="${esc(c.claim_no || '')}"></div>
      <div class="sm:col-span-2"><label class="label">เหตุ/ความเสียหาย *</label><textarea class="input" rows="2" name="description">${esc(c.description || '')}</textarea></div>
      <div><label class="label">ค่าเสียหายที่เรียกร้อง</label><input class="input" inputmode="decimal" name="claim_amount" value="${esc(+c.claim_amount ? c.claim_amount : '')}" placeholder="0.00"></div>
      <div><label class="label">บริษัทจ่ายแล้ว</label><input class="input" inputmode="decimal" name="paid_amount" value="${esc(+c.paid_amount ? c.paid_amount : '')}" placeholder="0.00"></div>
      <div class="sm:col-span-2"><label class="label">สถานะ</label><select class="input" name="status">${Object.entries(INS_CLAIM).map(([k, s]) => `<option value="${k}" ${k === c.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
      <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input class="input" name="note" value="${esc(c.note || '')}"></div></form>`,
    footer: `${claim ? `<button type="button" class="btn btn-danger mr-auto" data-del>${ic('trash-2')} ลบ</button>` : ''}<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` });
  const F = $('form', m.el).elements;
  $('[data-del]', m.el)?.addEventListener('click', async () => {
    if (!(await confirmModal({ title: 'ลบการเคลม', message: `ลบรายการเคลมวันที่ ${formatThaiDate(calDate(claim.incident_date))} ใช่หรือไม่?` }))) return;
    const r = await rpcSecure('sfh_ins_claim_delete', { p_id: claim.id }, { loaderText: 'กำลังลบ...', error: 'ลบไม่สำเร็จ', success: 'ลบรายการแล้ว' });
    if (r.ok) { m.close(); insRefresh(el); }
  });
  $('[data-save]', m.el).onclick = async () => {
    const v = (k) => String(F[k].value ?? '').trim();
    const data = { policy_id: v('policy_id'), incident_date: v('incident_date'), description: v('description'), claim_no: v('claim_no') || null,
      claim_amount: trvNum(v('claim_amount')), paid_amount: trvNum(v('paid_amount')), status: v('status'), note: v('note') || null };
    if (!data.policy_id) { showToast('กรุณาเลือกกรมธรรม์', 'warning'); return; }
    if (!data.incident_date) { showToast('กรุณาระบุวันที่เกิดเหตุ', 'warning'); return; }
    if (!data.description) { showToast('กรุณาระบุเหตุ/ความเสียหาย', 'warning'); F.description.focus(); return; }
    const pol = insPolicy(data.policy_id);

const INS_FUEL_TYPES = { diesel: 'ดีเซล', gasohol91: 'แก๊สโซฮอล์ 91', gasohol95: 'แก๊สโซฮอล์ 95', e20: 'แก๊สโซฮอล์ E20', e85: 'แก๊สโซฮอล์ E85', benzine: 'เบนซิน', lpg: 'LPG', ngv: 'NGV', other: 'อื่น ๆ' };
const INS_FUEL_FIELDS = [['fuel_date', 'วันที่เบิก', 'date'], ['fuel_type', 'ชนิดน้ำมัน', 'fueltype'], ['liters', 'จำนวน (ลิตร)', 'num'], ['unit_price', 'ราคาต่อลิตร', 'money'], ['amount', 'จำนวนเงิน', 'money'],
  ['odometer', 'เลขไมล์', 'num'], ['requester_name', 'ผู้เบิก/พนักงานขับรถ', 'text'], ['purpose', 'ใช้ในราชการ/เส้นทาง', 'text'], ['slip_no', 'เลขที่ใบเบิก', 'text'], ['station', 'สถานีบริการ', 'text'],
  ['receipt_no', 'เลขที่ใบเสร็จ', 'text'], ['pay_status', 'สถานะเบิกจ่าย', 'status'], ['doc_no', 'เลขที่ฎีกา', 'text'], ['doc_date', 'วันที่วางฎีกา', 'date'], ['note', 'หมายเหตุ', 'text']];
const insFuelAssets = () => Is.assets.filter(a => a.asset_type !== 'building');
const insFuelNum = (n, d = 2) => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const insYm = (d) => String(d).slice(0, 7);
const insYmText = (ym) => { const [y, m] = ym.split('-').map(Number); return `${TH_MONTHS[m - 1]} ${y + 543}`; };
/** รายการเบิกของครุภัณฑ์ เรียงตามวันที่ (เก่า → ใหม่) พร้อมระยะทางจากเลขไมล์ครั้งก่อน และ กม./ลิตร (สมมติเติมเต็มถังทุกครั้ง) */
function insFuelOf(assetId) {
  const list = Is.fuel.filter(f => f.asset_id === assetId).sort((a, b) => a.fuel_date.localeCompare(b.fuel_date) || String(a.created_at || '').localeCompare(String(b.created_at || '')));
  let prevOdo = null;
  return list.map(f => {
    const odo = f.odometer == null || f.odometer === '' ? null : +f.odometer;
    const dist = odo != null && prevOdo != null && odo >= prevOdo ? odo - prevOdo : null;
    if (odo != null) prevOdo = odo;
    return { ...f, _dist: dist, _kmpl: dist != null && +f.liters ? dist / +f.liters : null };
  });
}
/** สรุปรายการ: ครั้ง ลิตร เงิน ระยะทาง กม./ลิตร (ระยะทางรวม ÷ ลิตรของรายการที่มีระยะทาง) */
function insFuelSum(rows) {
  const withDist = rows.filter(r => r._dist != null), dist = withDist.reduce((s, r) => s + r._dist, 0), lDist = withDist.reduce((s, r) => s + (+r.liters), 0);
  return { n: rows.length, liters: rows.reduce((s, r) => s + (+r.liters), 0), amount: rows.reduce((s, r) => s + (+r.amount), 0), dist: withDist.length ? dist : null, kmpl: lDist ? dist / lDist : null };
