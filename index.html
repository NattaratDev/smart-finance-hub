      <div class="ml-auto flex gap-1">${eduExpandBtns('fu')}</div>
    </div>
    ${!assets.length ? `<div class="card">${emptyState('ยังไม่มีรถหรือครุภัณฑ์ · เพิ่มได้ที่แท็บ "ทรัพย์สิน" (ประเภท รถยนต์/ยานพาหนะ หรือ อื่น ๆ)', 'fuel')}</div>`
      : !groups.length ? `<div class="card">${emptyState(`ไม่มีรายการเบิกน้ำมันเดือน${insYmText(ym)}${q || Is.fuelAsset ? ' ตามเงื่อนไข' : ''}`, 'fuel')}</div>` : `
    <div class="card !p-0 overflow-x-auto"><table class="sfh-table w-full text-sm min-w-[920px]">
      <thead class="bg-gradient-to-r from-cream-50 via-white to-blush-50 text-slate-500"><tr><th>รถ / วันที่เบิก</th><th>ผู้เบิก / ใช้ในราชการ</th><th>ชนิด · ลิตร × ราคา</th><th class="text-right">จำนวนเงิน</th><th class="text-right">เลขไมล์ / ระยะทาง</th><th>ฎีกา</th><th></th></tr></thead>
      <tbody class="divide-y divide-slate-100">${groups.map(groupRow).join('')}</tbody></table></div>`}
    <p class="text-xs text-slate-400 mt-3">${ic('info', 'w-3.5 h-3.5 inline')} ระยะทาง = เลขไมล์ครั้งนี้ − เลขไมล์ครั้งก่อนของรถคันเดียวกัน · กม./ลิตร = ระยะทาง ÷ ลิตรที่เติมครั้งนี้ (กรณีเติมเต็มถังทุกครั้ง) · กดแถวรถเพื่อดูรายการ</p>`;
  body.oninput = debounce((e) => { if (e.target.matches('[data-fu-q]')) { Is.fuelQ = e.target.value; const pos = e.target.selectionStart; insRenderFuel(body, el); refreshIcons(); const q2 = $('[data-fu-q]', body); q2.focus(); q2.setSelectionRange(pos, pos); } }, 250);
  body.onchange = (e) => {
    if (e.target.matches('[data-fu-month]') && e.target.value) { Is.fuelMonth = e.target.value; insRenderFuel(body, el); refreshIcons(); }
    if (e.target.matches('[data-fu-asset]')) { Is.fuelAsset = e.target.value; insRenderFuel(body, el); refreshIcons(); }
  };
  body.onclick = (ev) => {
    const t = (s) => ev.target.closest(s);
    const ad = t('[data-fu-add]'); if (ad) { insOpenFuel(null, ad.dataset.fuAdd, el); return; }
    const ed = t('[data-fu-edit]'); if (ed) { insOpenFuel(Is.fuel.find(x => x.id === ed.dataset.fuEdit), null, el); return; }
    const ex = t('[data-fu-expand]'); if (ex) { Is.fuelOpen = new Set(ex.dataset.fuExpand === 'all' ? groups.map(g => g.a.id) : []); insRenderFuel(body, el); refreshIcons(); return; }
    const tg = t('[data-fu-toggle]'); if (tg) { const id = tg.dataset.fuToggle; Is.fuelOpen.has(id) ? Is.fuelOpen.delete(id) : Is.fuelOpen.add(id); insRenderFuel(body, el); refreshIcons(); return; }
    const a = t('[data-fu-act]'); if (!a) return;
    if (a.dataset.fuAct === 'add') insOpenFuel(null, Is.fuelAsset || null, el);
    else if (a.dataset.fuAct === 'excel') insExportExcel();
    else insFuelPrintMenu(a.dataset.fuAct);
  };
}

/** บันทึก/แก้ไขการเบิกน้ำมัน · log = รายการเดิม · assetId = รถ/ครุภัณฑ์ที่เลือกไว้ */
function insOpenFuel(log, assetId, el) {
  const assets = insFuelAssets().filter(a => a.is_active || a.id === log?.asset_id || a.id === assetId).sort((a, b) => insAssetLabel(a).localeCompare(insAssetLabel(b), 'th'));
  if (!assets.length) { showToast('ยังไม่มีรถหรือครุภัณฑ์ในทะเบียน', 'warning'); return; }
  const lastOf = (id) => insFuelOf(id).filter(f => f.id !== log?.id).at(-1);
  const lastPrice = (type) => [...Is.fuel].filter(f => f.fuel_type === type && +f.unit_price).sort((a, b) => b.fuel_date.localeCompare(a.fuel_date))[0]?.unit_price;
  const aId = log?.asset_id || assetId || (assets.length === 1 ? assets[0].id : ''), last0 = aId ? lastOf(aId) : null;
  const v = log ? { ...log } : { asset_id: aId, fuel_date: calToday(), fuel_type: last0?.fuel_type || 'diesel', pay_status: 'pending', requester_name: insAsset(aId)?.custodian_name || last0?.requester_name || '' };
  if (!log) v.unit_price = lastPrice(v.fuel_type) ?? '';
  const uniq = (k) => [...new Set(Is.fuel.map(f => f[k]).filter(Boolean))].slice(0, 50);
  const m = openModal({ title: log ? 'แก้ไขการเบิกน้ำมันเชื้อเพลิง' : 'บันทึกการเบิกน้ำมันเชื้อเพลิง', icon: 'fuel', size: 'lg',
    body: `<form class="grid gap-3 sm:grid-cols-2" novalidate>
      <div class="sm:col-span-2"><label class="label">รถ / ครุภัณฑ์ *</label><select class="input" name="asset_id" ${log ? 'disabled' : ''}><option value="">– เลือก –</option>${assets.map(a => `<option value="${a.id}" ${a.id === v.asset_id ? 'selected' : ''}>${esc(insAssetLabel(a))}</option>`).join('')}</select>
        <div class="text-xs text-slate-400 mt-1" data-fu-last></div></div>
      <div><label class="label">วันที่เบิก *</label><input type="date" class="input" name="fuel_date" value="${esc(v.fuel_date || '')}"></div>
      <div><label class="label">เลขที่ใบเบิกน้ำมัน</label><input class="input" name="slip_no" value="${esc(v.slip_no || '')}"></div>
      <div><label class="label">ชนิดน้ำมัน *</label><select class="input" name="fuel_type">${Object.entries(INS_FUEL_TYPES).map(([k, l]) => `<option value="${k}" ${k === v.fuel_type ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label class="label">จำนวน (ลิตร) *</label><input class="input" inputmode="decimal" name="liters" value="${esc(v.liters ?? '')}" placeholder="0.00"></div>
      <div><label class="label">ราคาต่อลิตร (บาท)</label><input class="input" inputmode="decimal" name="unit_price" value="${esc(v.unit_price ?? '')}" placeholder="0.00"></div>
      <div><label class="label">จำนวนเงิน (บาท)</label><input class="input" inputmode="decimal" name="amount" value="${esc(v.amount ?? '')}" placeholder="คำนวณอัตโนมัติ"><div class="text-[11px] text-slate-400 mt-1">= ลิตร × ราคา (แก้ไขได้ตามใบเสร็จ)</div></div>
      <div><label class="label">เลขไมล์ (กม.)</label><input class="input" inputmode="decimal" name="odometer" value="${esc(v.odometer ?? '')}" placeholder="เลขไมล์ขณะเติม"></div>
      <div class="rounded-2xl bg-mint-50/70 border border-mint-100 px-3 py-2 text-sm text-mint-700 self-end" data-fu-calc>-</div>
      <div><label class="label">ผู้เบิก / พนักงานขับรถ</label><input class="input" name="requester_name" value="${esc(v.requester_name || '')}" list="fuReq"><datalist id="fuReq">${uniq('requester_name').map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div><label class="label">ใช้ในราชการ / เส้นทาง</label><input class="input" name="purpose" value="${esc(v.purpose || '')}" list="fuPur" placeholder="เช่น ไปราชการ จ.สุโขทัย, เก็บขยะ"><datalist id="fuPur">${uniq('purpose').map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div><label class="label">สถานีบริการ</label><input class="input" name="station" value="${esc(v.station || '')}" list="fuSta"><datalist id="fuSta">${uniq('station').map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div><label class="label">เลขที่ใบเสร็จ/ใบกำกับภาษี</label><input class="input" name="receipt_no" value="${esc(v.receipt_no || '')}"></div>
      <div><label class="label">สถานะเบิกจ่าย</label><select class="input" name="pay_status">${Object.entries(RENT_STATUS).map(([k, s]) => `<option value="${k}" ${k === (v.pay_status || 'pending') ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
      <div><label class="label">เลขที่ฎีกา</label><input class="input" name="doc_no" value="${esc(v.doc_no || '')}"></div>
      <div><label class="label">วันที่วางฎีกา</label><input type="date" class="input" name="doc_date" value="${esc(v.doc_date || '')}"></div>
      <div class="sm:col-span-2"><label class="label">หมายเหตุ</label><textarea class="input" name="note" rows="2" placeholder="เช่น เติมน้ำมันเครื่องตัดหญ้า, เติมไม่เต็มถัง, ใบเสร็จชำรุด">${esc(v.note || '')}</textarea></div></form>`,
    footer: `${log ? `<button type="button" class="btn btn-danger mr-auto" data-del>${ic('trash-2')} ลบ</button>` : ''}<button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-save>${ic('save')} บันทึก</button>` });
  const F = $('form', m.el).elements, num = (k) => { const n = Number(String(F[k].value ?? '').replace(/,/g, '')); return String(F[k].value ?? '').trim() === '' || !isFinite(n) ? null : n; };
  let amountTouched = !!log && Math.abs(+log.amount - Math.round(+log.liters * +log.unit_price * 100) / 100) > 0.005;   // แก้ไข: คำนวณใหม่อัตโนมัติ เว้นแต่ยอดเดิมกรอกเองตามใบเสร็จ
  const prevOdo = () => { const id = F.asset_id.value; if (!id) return null; const before = insFuelOf(id).filter(f => f.id !== log?.id && f.odometer != null && f.fuel_date <= (F.fuel_date.value || '9999')); return before.length ? +before.at(-1).odometer : null; };
  const refresh = () => {
    const id = F.asset_id.value, last = id ? lastOf(id) : null;
    $('[data-fu-last]', m.el).textContent = last ? `ครั้งล่าสุด ${formatThaiDate(calDate(last.fuel_date))} · ${INS_FUEL_TYPES[last.fuel_type]} ${insFuelNum(last.liters)} ลิตร${last.odometer != null ? ` · เลขไมล์ ${formatNumber(+last.odometer)}` : ''}` : (id ? 'ยังไม่มีประวัติการเบิก' : '');
    const l = num('liters'), p = num('unit_price');
    if (!amountTouched) F.amount.value = l && p != null ? (Math.round(l * p * 100) / 100).toFixed(2) : '';
    const o = num('odometer'), po = prevOdo();
    $('[data-fu-calc]', m.el).innerHTML = o == null ? 'กรอกเลขไมล์เพื่อคำนวณระยะทาง' : po == null ? 'ครั้งแรกของรถคันนี้ (ยังคำนวณระยะทางไม่ได้)'
      : o < po ? `<span class="text-blush-500">เลขไมล์น้อยกว่าครั้งก่อน (${formatNumber(po)})</span>` : `ระยะทาง ${formatNumber(o - po)} กม.`;
  };
  m.el.addEventListener('input', (e) => { if (e.target.name === 'amount') amountTouched = String(e.target.value).trim() !== ''; refresh(); });
  m.el.addEventListener('change', (e) => {
    if (!log && e.target.name === 'asset_id') { const last = lastOf(e.target.value), a = insAsset(e.target.value);
      if (last) { F.fuel_type.value = last.fuel_type; if (!amountTouched && lastPrice(last.fuel_type) != null) F.unit_price.value = lastPrice(last.fuel_type); }
      if (!F.requester_name.value && (a?.custodian_name || last?.requester_name)) F.requester_name.value = a?.custodian_name || last.requester_name; }
    if (!log && e.target.name === 'fuel_type' && lastPrice(e.target.value) != null) F.unit_price.value = lastPrice(e.target.value);
    refresh();
  });
  refresh();
  $('[data-del]', m.el)?.addEventListener('click', async () => {
    if (!(await confirmModal({ title: 'ลบรายการเบิกน้ำมัน', message: `ลบรายการวันที่ ${formatThaiDate(calDate(log.fuel_date))} (${insFuelNum(log.liters)} ลิตร ${rentMoney(log.amount)} บาท) ใช่หรือไม่?` }))) return;
    const r = await rpcSecure('sfh_ins_fuel_delete', { p_id: log.id }, { loaderText: 'กำลังลบ...', error: 'ลบไม่สำเร็จ', success: 'ลบรายการแล้ว' });
    if (r.ok) { m.close(); insRefresh(el); }
  });
  $('[data-save]', m.el).onclick = async () => {
    const g = (k) => String(F[k].value ?? '').trim();
    const liters = num('liters'), price = num('unit_price') ?? 0;
    const data = { asset_id: F.asset_id.value, fuel_date: g('fuel_date'), fuel_type: g('fuel_type'), liters, unit_price: price, amount: num('amount') ?? Math.round((liters || 0) * price * 100) / 100,
      odometer: num('odometer'), requester_name: g('requester_name') || null, purpose: g('purpose') || null, slip_no: g('slip_no') || null, station: g('station') || null,
      receipt_no: g('receipt_no') || null, pay_status: g('pay_status'), doc_no: g('doc_no') || null, doc_date: g('doc_date') || null, note: g('note') || null };
    if (!data.asset_id) { showToast('กรุณาเลือกรถ/ครุภัณฑ์', 'warning'); F.asset_id.focus(); return; }
    if (!data.fuel_date) { showToast('กรุณาระบุวันที่เบิก', 'warning'); F.fuel_date.focus(); return; }
    if (!liters || liters <= 0) { showToast('กรุณาระบุจำนวนลิตร', 'warning'); F.liters.focus(); return; }
    const po = prevOdo();
    if (data.odometer != null && po != null && data.odometer < po && !(await confirmModal({ title: 'เลขไมล์น้อยกว่าครั้งก่อน', danger: false, icon: 'alert-triangle', confirmText: 'บันทึกต่อ',
      message: `เลขไมล์ ${formatNumber(data.odometer)} น้อยกว่าครั้งก่อน (${formatNumber(po)}) · ต้องการบันทึกต่อหรือไม่?` }))) return;
    if (log && !(await rentConfirmEdit(`ยืนยันแก้ไขการเบิกน้ำมัน · ${insAssetLabel(insAsset(log.asset_id))}`, log, data, INS_FUEL_FIELDS))) return;
    const r = await rpcSecure('sfh_ins_fuel_save', { p_id: log?.id || null, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกการเบิกน้ำมันแล้ว' });
    if (r.ok) { (Is.fuelOpen = Is.fuelOpen || new Set()).add(data.asset_id); Is.fuelMonth = insYm(data.fuel_date); m.close(); insRefresh(el); }
  };
}

/** พิมพ์/PDF การเบิกน้ำมัน · kind: month (สรุปรายคันประจำเดือน) / log (ทะเบียนคุมการเบิกรายการ) / fy (สรุปรายเดือนปีงบประมาณ) */
async function insPrintFuel(kind, mode, opts = {}) {
  const root = rgPrintRoot(), org = esc(State.settings.org_name || 'กองคลัง เทศบาลเมืองศรีสัชนาลัย'), printed = formatThaiDate(new Date(), { time: true });
  const n2 = (x) => insFuelNum(x), pagesOf = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  const page = (title, sub, head, pg, pi, total, foot) => `<div class="rg-page land"><h1>${title}</h1><div class="sub">${org} · ${sub}</div>
    <table><thead><tr>${head}</tr></thead><tbody>${pg}${pi === total - 1 ? foot : ''}</tbody></table>${pi === total - 1 ? RG_SIGN : ''}<div class="foot"><span>พิมพ์เมื่อ ${printed}</span><span>หน้า ${pi + 1}/${total}</span></div></div>`;
  let html = '', filename, count = 0;
  if (kind === 'fy') {
    const months = Array.from({ length: 12 }, (_, i) => { const m = ((9 + i) % 12) + 1, y = opts.fy - 543 - (m >= 10 ? 1 : 0); return `${y}-${String(m).padStart(2, '0')}`; });
    const all = insFuelAssets().flatMap(a => insFuelOf(a.id)), rows = months.map(ym => ({ ym, ...insFuelSum(all.filter(f => insYm(f.fuel_date) === ym)) })), tot = insFuelSum(all.filter(f => months.includes(insYm(f.fuel_date))));
    count = tot.n; if (!count) { showToast('ไม่มีข้อมูลการเบิกน้ำมันในปีงบประมาณนี้', 'warning'); return; }
    html = page(`สรุปการใช้น้ำมันเชื้อเพลิง ปีงบประมาณ ${opts.fy}`, 'แยกรายเดือน (ตามวันที่เบิก)', '<th style="width:10mm">ที่</th><th>เดือน</th><th style="width:28mm">จำนวนครั้ง</th><th style="width:34mm">จำนวน (ลิตร)</th><th style="width:38mm">จำนวนเงิน (บาท)</th><th style="width:34mm">ระยะทาง (กม.)</th><th style="width:30mm">กม./ลิตร</th>',
      rows.map((r, i) => `<tr><td class="n" style="text-align:center">${i + 1}</td><td>${insYmText(r.ym)}</td><td class="n">${r.n || '-'}</td><td class="n">${r.n ? n2(r.liters) : '-'}</td><td class="n">${r.n ? rentMoney(r.amount) : '-'}</td><td class="n">${r.dist != null ? formatNumber(r.dist) : '-'}</td><td class="n">${r.kmpl != null ? n2(r.kmpl) : '-'}</td></tr>`).join(''), 0, 1,
      `<tr class="tot"><td colspan="2" style="text-align:center">รวมทั้งปีงบประมาณ</td><td class="n">${tot.n}</td><td class="n">${n2(tot.liters)}</td><td class="n">${rentMoney(tot.amount)}</td><td class="n">${tot.dist != null ? formatNumber(tot.dist) : '-'}</td><td class="n">${tot.kmpl != null ? n2(tot.kmpl) : '-'}</td></tr>
       <tr><td colspan="7" style="text-align:right">(${esc(bahtText(tot.amount))})</td></tr>`);
    filename = `ทะเบียนน้ำมันเชื้อเพลิง_ปีงบ${opts.fy}.pdf`;
  } else if (kind === 'month') {
    const groups = insFuelAssets().map(a => ({ a, s: insFuelSum(insFuelInMonth(a.id, opts.ym)), types: [...new Set(insFuelInMonth(a.id, opts.ym).map(f => INS_FUEL_TYPES[f.fuel_type]))].join(', ') })).filter(g => g.s.n)
      .sort((x, y) => insAssetLabel(x.a).localeCompare(insAssetLabel(y.a), 'th'));
    count = groups.length; if (!count) { showToast(`ไม่มีรายการเบิกน้ำมันเดือน${insYmText(opts.ym)}`, 'warning'); return; }
    const tot = insFuelSum(insFuelAssets().flatMap(a => insFuelInMonth(a.id, opts.ym))), pages = pagesOf(groups, 16);
    html = pages.map((pg, pi) => page(`รายงานการใช้น้ำมันเชื้อเพลิง ประจำเดือน${insYmText(opts.ym)}`, 'สรุปรายคัน/รายครุภัณฑ์ (ตามวันที่เบิก)',
      '<th style="width:8mm">ที่</th><th>รถ / ครุภัณฑ์</th><th style="width:28mm">ทะเบียน</th><th style="width:30mm">ชนิดน้ำมัน</th><th style="width:16mm">ครั้ง</th><th style="width:24mm">ลิตร</th><th style="width:28mm">จำนวนเงิน</th><th style="width:24mm">ระยะทาง (กม.)</th><th style="width:20mm">กม./ลิตร</th>',
      pg.map(({ a, s, types }, i) => `<tr><td class="n" style="text-align:center">${pi * 16 + i + 1}</td><td>${esc(a.name)}<div style="color:#6b7280;font-size:9.5px">${esc(insAssetSub(a, a.vehicle_kind))}</div></td><td>${esc([a.plate_no, a.plate_province].filter(Boolean).join(' ') || '-')}</td>
        <td style="font-size:10px">${esc(types)}</td><td class="n">${s.n}</td><td class="n">${n2(s.liters)}</td><td class="n">${rentMoney(s.amount)}</td><td class="n">${s.dist != null ? formatNumber(s.dist) : '-'}</td><td class="n">${s.kmpl != null ? n2(s.kmpl) : '-'}</td></tr>`).join(''), pi, pages.length,
      `<tr class="tot"><td colspan="4" style="text-align:center">รวม ${groups.length} คัน/รายการ</td><td class="n">${tot.n}</td><td class="n">${n2(tot.liters)}</td><td class="n">${rentMoney(tot.amount)}</td><td class="n">${tot.dist != null ? formatNumber(tot.dist) : '-'}</td><td class="n">${tot.kmpl != null ? n2(tot.kmpl) : '-'}</td></tr>
       <tr><td colspan="9" style="text-align:right">(${esc(bahtText(tot.amount))})</td></tr>`)).join('');
    filename = `ทะเบียนน้ำมันเชื้อเพลิง_${opts.ym}.pdf`;
  } else {

// นำเข้า Excel (งด.2) → ระบบอ่านและตรวจสอบ → แปลงเป็นสลิป → ค้นหา/ดูตัวอย่าง → พิมพ์ A4 หรือบันทึก PDF
// ความปลอดภัย: ข้อมูลเงินเดือนอ่าน/เขียนผ่าน rpcSecure('sfh_payroll_*') เท่านั้น (ตรวจ session token + สิทธิ์ที่ฐานข้อมูล)
//              ตาราง payroll_* ปิดการเข้าถึงตรงจาก anon key (ดู module_payroll.sql)

/* ----- ตัวอ่านไฟล์ Excel เงินเดือน (รายงาน งด.2 "รายละเอียดผู้มีสิทธิรับเงินแนบท้ายประกอบ") -----
   ใช้ได้ทั้งในเบราว์เซอร์และ Node (ส่ง XLSX เข้ามา) – ไม่มีการส่งไฟล์ขึ้นเซิร์ฟเวอร์ */
const PayrollParser = (() => {
  const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const txt = (v) => (v == null ? '' : String(v).replace(/\s+/g, ' ').trim());
  // Excel ตัดชื่อชีตที่ 31 ตัวอักษร → เติมชื่องานมาตรฐาน (จำแนกตามแผนงานของ อปท.) ให้เต็ม
  const KNOWN_UNITS = [
    'งานบริหารทั่วไป', 'งานบริหารงานคลัง', 'งานวางแผนสถิติและวิชาการ', 'งานควบคุมภายในและการตรวจสอบภายใน',
    'งานบริหารทั่วไปเกี่ยวกับการรักษาความสงบภายใน', 'งานป้องกันภัยฝ่ายพลเรือนและระงับอัคคีภัย', 'งานเทศกิจ',
    'งานบริหารทั่วไปเกี่ยวกับการศึกษา', 'งานระดับก่อนวัยเรียนและประถมศึกษา', 'งานระดับมัธยมศึกษา', 'งานศึกษาไม่กำหนดระดับ',
    'งานบริหารทั่วไปเกี่ยวกับสาธารณสุข', 'งานโรงพยาบาล', 'งานบริการสาธารณสุขและงานสาธารณสุขอื่น', 'งานศูนย์บริการสาธารณสุข',
    'งานบริหารทั่วไปเกี่ยวกับสังคมสงเคราะห์', 'งานสวัสดิการสังคมและสังคมสงเคราะห์',
    'งานบริหารทั่วไปเกี่ยวกับเคหะและชุมชน', 'งานไฟฟ้าถนน', 'งานสวนสาธารณะ', 'งานกำจัดขยะมูลฝอยและสิ่งปฏิกูล', 'งานบำบัดน้ำเสีย',
    'งานบริหารทั่วไปเกี่ยวกับสร้างความเข้มแข็งของชุมชน', 'งานส่งเสริมและสนับสนุนความเข้มแข็งชุมชน',
    'งานบริหารทั่วไปเกี่ยวกับศาสนาวัฒนธรรมและนันทนาการ', 'งานกีฬาและนันทนาการ', 'งานศาสนาวัฒนธรรมท้องถิ่น',
    'งานบริหารทั่วไปเกี่ยวกับอุตสาหกรรมและการโยธา', 'งานก่อสร้างโครงสร้างพื้นฐาน', 'งานบริหารทั่วไปเกี่ยวกับการเกษตร',
    'งานส่งเสริมการเกษตร', 'งานอนุรักษ์แหล่งน้ำและป่าไม้', 'งานกิจการประปา', 'งานตลาดสด', 'งานโรงฆ่าสัตว์', 'งานสถานธนานุบาล', 'งานสถานีขนส่ง',
  ];
  const fullUnit = (sheetName) => {
    const s = txt(sheetName);
    if (s.length < 28) return s;
    return KNOWN_UNITS.find(u => u.startsWith(s) && u.length > s.length) || s;
  };
  const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const fmt = (n) => r2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  /** แปลงค่าในเซลล์เป็นตัวเลข: ว่าง / "-" = 0, "1,234.50" = 1234.5 */
  function num(v) {
    if (v == null || v === '') return { ok: true, v: 0 };
    if (typeof v === 'number') return { ok: isFinite(v), v: isFinite(v) ? v : 0 };
    let s = String(v).replace(/[,\s฿]/g, '').replace(/บาท$/, '');
    if (s === '' || /^[-–—.]+$/.test(s)) return { ok: true, v: 0 };
    if (/^\(.*\)$/.test(s)) s = '-' + s.slice(1, -1);
    const n = Number(s);
    return isFinite(n) ? { ok: true, v: n } : { ok: false, v: 0 };
  }
  function detectPeriod(rows) {
    for (const r of rows.slice(0, 15)) for (const c of r || []) {
      const m = /ประจำเดือน\s*([ก-๙]+)\s*(?:พ\s*\.?\s*ศ\s*\.?)?\s*(\d{4})/.exec(txt(c));
      if (m) { const mi = MONTHS.indexOf(m[1]); if (mi >= 0) return { month: mi + 1, year: +m[2] }; }
    }
    return null;
  }
  function detectOrg(rows) {
    let title = '', amphoe = '', province = '';
    for (const r of rows.slice(0, 10)) for (const c of r || []) {
      const t = txt(c);
      if (!title && /^(เทศบาล|องค์การบริหารส่วน|อบต\.?|อบจ\.?)/.test(t)) title = t;
      let m = /^อ(?:\.|ำเภอ)\s*(.+)$/.exec(t); if (m && !amphoe) amphoe = 'อำเภอ' + m[1].trim();
      m = /^จ(?:\.|ังหวัด)\s*(.+)$/.exec(t); if (m && !province) province = 'จังหวัด' + m[1].trim();
    }
    return { title, subtitle: [amphoe, province].filter(Boolean).join(' ') };
  }
  function parseSheet(ws, sheetName, XLSX) {
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
    const h = rows.findIndex(r => r && r.some(c => /ชื่อ\s*-?\s*สกุล/.test(txt(c))));
    if (h < 0) return { name: sheetName, skipped: true, reason: 'ไม่พบหัวตาราง "ชื่อ - สกุล"', people: [], issues: [] };
    const top = rows[h] || [], sub = rows[h + 1] || [];
    const width = Math.max(...rows.slice(h, h + 60).map(r => (r ? r.length : 0)));
    const findCol = (re) => { for (let c = 0; c < width; c++) if (re.test(txt(top[c]))) return c; return -1; };
    const cName = findCol(/ชื่อ\s*-?\s*สกุล/), cType = findCol(/ประเภท/), cUnit = findCol(/หน่วยงาน/);
    const cInc = findCol(/^รายการรับ/), cDed = findCol(/^รายการหัก/), cNet = findCol(/รับสุทธิ/);
    if (cInc < 0 || cNet < 0) return { name: sheetName, skipped: true, reason: 'ไม่พบคอลัมน์ "รายการรับ" หรือ "รับสุทธิ"', people: [], issues: [] };
    const cols = { income: [], deduction: [], totalIncome: -1, totalDeduction: -1, net: cNet };
    for (let c = cInc; c < (cDed >= 0 ? cDed : cNet); c++) {
      const t = txt(sub[c]); if (!t) continue;
      if (/รวมรายการรับ/.test(t)) cols.totalIncome = c; else cols.income.push({ c, name: t });
    }
    if (cDed >= 0) for (let c = cDed; c < cNet; c++) {
      const t = txt(sub[c]); if (!t) continue;
      if (/รวมรายการหัก/.test(t)) cols.totalDeduction = c; else cols.deduction.push({ c, name: t });
    }
    const allCols = [...cols.income, ...cols.deduction,
      ...(cols.totalIncome >= 0 ? [{ c: cols.totalIncome, name: 'รวมรายการรับ' }] : []),
      ...(cols.totalDeduction >= 0 ? [{ c: cols.totalDeduction, name: 'รวมรายการหัก' }] : []),
      { c: cols.net, name: 'รับสุทธิ' }];
    const colSums = Object.fromEntries(allCols.map(x => [x.c, 0]));
    const people = [], issues = [];
    const sheetUnit = fullUnit(sheetName);
    let totalsRow = null;
    for (let i = h + 2; i < rows.length; i++) {
      const r = rows[i] || [];
      if (/รวมทั้งสิ้น/.test(r.map(txt).join(' '))) { totalsRow = r; break; }
      const name = txt(r[cName]);
      const anyNum = allCols.some(x => num(r[x.c]).v !== 0);
      if (!name && !anyNum) continue;
      const bad = [];
      const read = (x) => { const p = num(r[x.c]); if (!p.ok) bad.push(x.name); colSums[x.c] += p.v; return r2(p.v); };
      const incomes = cols.income.map(x => ({ name: x.name, amount: read(x) }));
      const deductions = cols.deduction.map(x => ({ name: x.name, amount: read(x) }));
      const fileInc = cols.totalIncome >= 0 ? read({ c: cols.totalIncome, name: 'รวมรายการรับ' }) : null;
      const fileDed = cols.totalDeduction >= 0 ? read({ c: cols.totalDeduction, name: 'รวมรายการหัก' }) : null;
      const fileNet = read({ c: cols.net, name: 'รับสุทธิ' });
      const sumInc = r2(incomes.reduce((a, x) => a + x.amount, 0));
      const sumDed = r2(deductions.reduce((a, x) => a + x.amount, 0));
      const p = {
        sheet: sheetName, row: i + 1, full_name: name, employee_type: txt(r[cType]), unit_name: sheetUnit, sub_unit: cUnit >= 0 ? txt(r[cUnit]) : '',
        incomes: incomes.filter(x => x.amount !== 0), deductions: deductions.filter(x => x.amount !== 0),
        total_income: sumInc, total_deduction: sumDed, net_amount: r2(sumInc - sumDed), errors: [], warnings: [],
      };
      if (!name) p.errors.push('ไม่มีชื่อ-สกุล');
      if (bad.length) p.errors.push(`ตัวเลขไม่ถูกต้องในช่อง: ${bad.join(', ')}`);
      if ([...incomes, ...deductions].some(x => x.amount < 0)) p.errors.push('มีจำนวนเงินติดลบ');
      if (fileInc != null && Math.abs(fileInc - sumInc) > 0.009) p.errors.push(`รวมรายการรับในไฟล์ ${fmt(fileInc)} ≠ ผลรวมรายการรับ ${fmt(sumInc)}`);
      if (fileDed != null && Math.abs(fileDed - sumDed) > 0.009) p.errors.push(`รวมรายการหักในไฟล์ ${fmt(fileDed)} ≠ ผลรวมรายการหัก ${fmt(sumDed)}`);
      if (Math.abs(fileNet - p.net_amount) > 0.009) p.errors.push(`รับสุทธิในไฟล์ ${fmt(fileNet)} ≠ รวมรับ − รวมหัก ${fmt(p.net_amount)}`);
      if (p.net_amount <= 0) p.warnings.push('รับสุทธิเป็นศูนย์หรือติดลบ');
      people.push(p);
    }
    let totalsOk = !!totalsRow;
    if (!totalsRow) issues.push({ level: 'warning', msg: 'ไม่พบแถว "รวมทั้งสิ้น" จึงตรวจยอดรวมของชีตไม่ได้' });
    else for (const x of allCols) {
      const f = num(totalsRow[x.c]);
      if (!f.ok) { totalsOk = false; issues.push({ level: 'warning', msg: `อ่านยอดในแถวรวมทั้งสิ้นคอลัมน์ "${x.name}" ไม่ได้ จึงตรวจยอดรวมคอลัมน์นี้ไม่ได้` }); }
      else if (Math.abs(r2(f.v) - r2(colSums[x.c])) > 0.009) issues.push({ level: 'error', msg: `ยอดรวมคอลัมน์ "${x.name}" ของทุกคน (${fmt(colSums[x.c])}) ไม่ตรงกับแถวรวมทั้งสิ้น (${fmt(f.v)})` });
    }
    return {
      name: sheetName, skipped: false, people, issues, checkedTotals: totalsOk, unit: sheetUnit,
      incomeItems: cols.income.map(x => x.name), deductionItems: cols.deduction.map(x => x.name),
      totals: { income: r2(people.reduce((a, p) => a + p.total_income, 0)), deduction: r2(people.reduce((a, p) => a + p.total_deduction, 0)), net: r2(people.reduce((a, p) => a + p.net_amount, 0)) },
    };
  }
  /** อ่านทั้งไฟล์ → { group, period, org, sheets, people, counts } */
  function parseWorkbook(wb, fileName, XLSX) {
    const firstRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
    const sheets = wb.SheetNames.map(n => parseSheet(wb.Sheets[n], n, XLSX));
    const people = sheets.flatMap(s => s.people);
    const allText = firstRows.slice(0, 10).flat().map(txt).join(' ');
    const group = /การเมือง/.test(fileName + ' ' + allText) ? 'political' : /ประจำ/.test(fileName + ' ' + allText) ? 'regular' : '';
    // ชื่อซ้ำในไฟล์เดียวกัน
    const key = (p) => `${p.full_name}|${p.employee_type}`;
    const seen = {};
    people.forEach(p => { (seen[key(p)] ||= []).push(p); });
    Object.values(seen).filter(list => list.length > 1 && list[0].full_name).forEach(list =>
      list.forEach(p => p.warnings.push(`ชื่อซ้ำในไฟล์ ${list.length} แถว (${list.map(x => `${x.sheet} แถว ${x.row}`).join(', ')})`)));
    const fileIssues = [];
    if (!people.length) fileIssues.push({ level: 'error', msg: 'ไม่พบรายชื่อผู้รับเงินในไฟล์' });
    sheets.filter(s => s.skipped).forEach(s => fileIssues.push({ level: 'warning', msg: `ข้ามชีต "${s.name}": ${s.reason}` }));
    return {
      fileName, group, period: detectPeriod(firstRows), org: detectOrg(firstRows), sheets, people, fileIssues,
      counts: {
        people: people.length,
        errors: people.reduce((a, p) => a + p.errors.length, 0) + sheets.reduce((a, s) => a + s.issues.filter(i => i.level === 'error').length, 0) + fileIssues.filter(i => i.level === 'error').length,
        warnings: people.reduce((a, p) => a + p.warnings.length, 0) + sheets.reduce((a, s) => a + s.issues.filter(i => i.level === 'warning').length, 0) + fileIssues.filter(i => i.level === 'warning').length,
      },
      totals: {
        income: r2(people.reduce((a, p) => a + p.total_income, 0)),
        deduction: r2(people.reduce((a, p) => a + p.total_deduction, 0)),
        net: r2(people.reduce((a, p) => a + p.net_amount, 0)),
      },
    };
  }
  return { parseWorkbook, num, detectPeriod, MONTHS };
})();

/** โหลด SheetJS เฉพาะตอนนำเข้าไฟล์ (ไม่ทำให้หน้าเว็บช้า) */
function loadSheetJS() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = SHEETJS_URL; s.async = true;
    s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ')));
    s.onerror = () => reject(new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต'));
    document.head.appendChild(s);
  });
}

/** วัดจริงหลังแสดงผล: ถ้าเนื้อหาชนส่วนท้าย → ย่อ 1-2 ระดับ */
function payrollFitPages(root) {
  $$('.ps-page', root).forEach(pg => {
    const over = () => { const s = $('.ps-sign-area', pg), f = $('.ps-foot', pg); return s.offsetTop + s.offsetHeight > f.offsetTop - 6; };

function payrollMeta(src) {

/* ---------- ผู้ลงนาม (ค่าเริ่มต้นจากตั้งค่าหน่วยงาน · แก้ได้ก่อนพิมพ์) ---------- */
async function payrollSignerDefaults() {
  try { const local = JSON.parse(localStorage.getItem(PAYROLL_SIGNER_KEY) || 'null'); if (local?.name) return local; } catch { /* ignore */ }
  const org = currentUser()?.org_id;
  if (!org) return { name: '', position: '' };
  const r = await db(s => s.rpc('sfh_org_settings_get', tk({ p_keys: ['signer_name', 'signer_position'] })), { loader: false, silent: true });
  const m = r.data || {};
  return { name: m.signer_name || '', position: m.signer_position || '' };
}
async function payrollSaveSignerDefault(sig) {
  const org = currentUser()?.org_id;
  if (hasPermission('settings.org') && org) {
    const r = await upsertSettings(org, { signer_name: sig.name, signer_position: sig.position }, false,
      { scope: 'organization', keys: ['signer_name', 'signer_position'], from: 'payroll' }, { loader: false, success: '' });
    if (!r.ok) return;
    try { localStorage.removeItem(PAYROLL_SIGNER_KEY); } catch { /* ignore */ }
    showToast('บันทึกผู้ลงนามเป็นค่าเริ่มต้นของหน่วยงานแล้ว', 'success');
  } else {
    try { localStorage.setItem(PAYROLL_SIGNER_KEY, JSON.stringify(sig)); } catch { /* ignore */ }
    showToast('จำผู้ลงนามไว้สำหรับเครื่องนี้แล้ว', 'success');
  }
}

/* ---------- พิมพ์ / ดูตัวอย่าง ---------- */
async function payrollPrint(slips, meta, signer) {
  payrollEnsureStyle();
  let root = $('#psPrintRoot');
  if (!root) { root = document.createElement('div'); root.id = 'psPrintRoot'; document.body.appendChild(root); }
  root.innerHTML = slips.map((s, i) => payrollSlipHtml(s, meta, signer, i, slips.length)).join('');
  showLoader(true, `กำลังเตรียมสลิป ${slips.length} หน้า...`);
  try {
    await Promise.all($$('img', root).map(img => (img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; }))));
    if (document.fonts?.ready) await document.fonts.ready;
    payrollFitPages(root);
  } finally { showLoader(false); }
  document.body.classList.add('ps-printing');
  const done = () => { document.body.classList.remove('ps-printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 150);
}
function openPayrollSlipPreview(slip, meta, { canPrint = false, periodId = null } = {}) {

  });
  const wrap = $('[data-ps-wrap]', m.el), pg = $('.ps-page', wrap);
  // ย่อหน้า A4 ให้พอดีกล่อง – วัดใหม่ทุกครั้งที่กล่องเปลี่ยนขนาด (รวมตอนเพิ่งแสดงผล)
  const fit = () => {
    if (!wrap.clientWidth) return;   // ยังไม่แสดงผล → รอ ResizeObserver เรียกใหม่
    const sc = Math.min(1, wrap.clientWidth / pg.offsetWidth);
    pg.style.transform = `scale(${sc})`; wrap.style.height = `${pg.offsetHeight * sc}px`;
    pg.style.left = `${Math.max(0, (wrap.clientWidth - pg.offsetWidth * sc) / 2)}px`;
  };
  wrap.style.height = '60vh';      // ความสูงชั่วคราวก่อนวัดได้

function payrollExportCsv(slips, period) {

  const inc = names('incomes'), ded = names('deductions');
  const amt = (list, n) => { const x = (list || []).find(y => y.name === n); return x ? x.amount : 0; };

    ['ลำดับ', 'ชื่อ-สกุล', 'ประเภท', 'หน่วยงาน', ...inc, 'รวมรายการรับ', ...ded, 'รวมรายการหัก', 'รับสุทธิ', 'ที่มา', 'เหตุผลการแก้ไข'],
    slips.map((s, i) => [i + 1, s.full_name, s.employee_type, [s.unit_name, s.sub_unit].filter(Boolean).join(' / '),
      ...inc.map(n => amt(s.incomes, n)), s.total_income, ...ded.map(n => amt(s.deductions, n)), s.total_deduction, s.net_amount, PAYROLL_ENTRY[s.entry_type || 'import'].label, s.edit_reason || '']));

  if (['periods', 'manual'].includes(pageState('tab'))) Payroll.tab = pageState('tab');
  await payrollSwitchTab(el, Payroll.tab || 'periods');
}
/** สลับแท็บ: งวดเงินเดือน (นำเข้า Excel) / สลิปแบบ Manual */
async function payrollSwitchTab(el, tab) {
  Payroll.tab = tab;
  setPageState({ tab });
  $$('[data-pr-tab]', el).forEach(b => {
    const on = b.dataset.prTab === tab;
    b.setAttribute('aria-selected', on);
    b.classList.toggle('bg-gradient-to-r', on); b.classList.toggle('from-mint-400', on); b.classList.toggle('to-brand-400', on);
    b.classList.toggle('text-white', on); b.classList.toggle('shadow-sm', on); b.classList.toggle('text-slate-600', !on); b.classList.toggle('hover:bg-slate-50', !on);
  });
  const manage = hasPermission('payroll.manage');
  $('#prActions', el).innerHTML = tab === 'manual'
    ? (manage ? `<button class="btn btn-primary" data-pm="new">${ic('file-plus-2')} สร้างสลิป Manual</button>` : '')
    : (manage ? `<button class="btn btn-primary" data-pr="import">${ic('file-up')} นำเข้าไฟล์ Excel</button>` : '');
  refreshIcons();
  if (tab === 'manual') await payrollShowManual(el);
  else await payrollShowList(el);
}
async function payrollOnClick(el, e) {
  const b = e.target.closest('[data-pr]');
  if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.pr) {
    case 'import': payrollShowImport(el); break;
    case 'back': await payrollShowList(el); break;
    case 'open': await payrollShowPeriod(el, id); break;
    case 'status': await payrollSetStatus(el, id, b.dataset.to); break;
    case 'delete': await payrollDeletePeriod(el, id); break;
    case 'preview': { const s = Payroll.slips.find(x => x.id === id); if (s) openPayrollSlipPreview(s, payrollMeta(Payroll.period), { canPrint: hasPermission('payroll.print'), periodId: Payroll.period.id }); break; }
    case 'print-one': { const s = Payroll.slips.find(x => x.id === id); if (s) openPayrollPrintDialog([s], payrollMeta(Payroll.period), Payroll.period.id, `สลิปของ ${s.full_name}`); break; }
    case 'slip-add': openPayrollSlipEditor(el, null); break;
    case 'slip-edit': { const s = Payroll.slips.find(x => x.id === id); if (s) openPayrollSlipEditor(el, s); break; }
    case 'slip-delete': { const s = Payroll.slips.find(x => x.id === id); if (s) await payrollDeleteSlip(el, s); break; }
    case 'print-selected': {
      const list = Payroll.slips.filter(s => Payroll.selected.has(s.id));
      if (!list.length) return showToast('กรุณาเลือกรายชื่อที่ต้องการพิมพ์ก่อน', 'warning');
      openPayrollPrintDialog(list, payrollMeta(Payroll.period), Payroll.period.id, `ที่เลือก ${list.length} คน`); break;
    }
    case 'print-filtered': { const list = Payroll.table.getFiltered(); openPayrollPrintDialog(list, payrollMeta(Payroll.period), Payroll.period.id, list.length === Payroll.slips.length ? 'ทั้งงวด' : `ตามตัวกรอง ${list.length} คน`); break; }
    case 'export': payrollExportCsv(Payroll.table.getFiltered(), Payroll.period); break;
    case 'select-filtered': Payroll.table.getFiltered().forEach(s => Payroll.selected.add(s.id)); Payroll.table.render(); payrollUpdateSelection(el); break;
    case 'select-none': Payroll.selected.clear(); Payroll.table.render(); payrollUpdateSelection(el); break;
    case 'imp-choose': $('#prFileInput', el).click(); break;
    case 'imp-preview': { const imp = Payroll.imports.find(x => x.id === b.dataset.f); const p = imp?.people[+b.dataset.i]; if (p) openPayrollSlipPreview({ ...p, warnings: [...p.warnings, ...(p.compare || [])] }, payrollImportMeta(imp)); break; }
    case 'imp-remove': Payroll.imports = Payroll.imports.filter(x => x.id !== b.dataset.f); payrollDrawImports(el); break;
    case 'imp-all-issues': { const imp = Payroll.imports.find(x => x.id === b.dataset.f); if (imp) { imp.showAll = true; payrollDrawImports(el); } break; }
    case 'imp-go': { const imp = Payroll.imports.find(x => x.id === b.dataset.f); if (imp) await payrollDoImport(el, imp); break; }
  }
}
async function payrollOnChange(el, e) {
  const sel = e.target.closest('[data-sel]');
  if (sel) { sel.checked ? Payroll.selected.add(sel.dataset.sel) : Payroll.selected.delete(sel.dataset.sel); payrollUpdateSelection(el); return; }
  const f = e.target.closest('[data-imp-field]');
  if (f) {
    const imp = Payroll.imports.find(x => x.id === f.dataset.f);
    if (!imp) return;
    const k = f.dataset.impField;
    imp[k] = ['month', 'year'].includes(k) ? parseInt(f.value, 10) || null : f.value;
    if (['month', 'year', 'staff_group'].includes(k)) await payrollCompareWithPrevious(imp);
    payrollDrawImports(el);
  }
  if (e.target.id === 'prFileInput') { const files = [...e.target.files]; e.target.value = ''; await payrollReadFiles(el, files); }
}

async function payrollReadFiles(el, files) {
  files = files.filter(f => { const ok = /\.(xlsx|xls)$/i.test(f.name); if (!ok) showToast(`${f.name} ไม่ใช่ไฟล์ Excel`, 'warning'); return ok; });
  if (!files.length) return;
  showLoader(true, 'กำลังเตรียมตัวอ่านไฟล์ Excel...');
  try {
    const XLSX = await loadSheetJS();
    if (!Payroll.periods.length) { const r = await rpcSecure('sfh_payroll_periods', {}, { loader: false }); if (r.ok) Payroll.periods = r.data || []; }
    for (const f of files) {
      $('#loaderText').textContent = `กำลังอ่านและตรวจสอบ ${f.name}...`;
      try {
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        const res = PayrollParser.parseWorkbook(wb, f.name, XLSX);
        const now = new Date();
        Object.assign(res, {
          id: Math.random().toString(36).slice(2), staff_group: res.group, showAll: false,
          month: res.period?.month || now.getMonth() + 1, year: res.period?.year || now.getFullYear() + 543,
          org_title: res.org.title, org_subtitle: res.org.subtitle, compareIssues: [],
        });
        await payrollCompareWithPrevious(res);
        Payroll.imports.push(res);
      } catch (err) {
        console.error(err);
        showToast(`อ่านไฟล์ ${f.name} ไม่สำเร็จ: ${err.message}`, 'error', 6000);
      }
    }
  } catch (err) { showToast(err.message, 'error', 6000); }
  finally { showLoader(false); }
  payrollDrawImports(el);
}
/** เทียบกับงวดก่อนหน้า (กลุ่มเดียวกัน): คนใหม่ / คนที่หายไป / รับสุทธิเปลี่ยนเกิน 20% */
async function payrollCompareWithPrevious(imp) {
  imp.people.forEach(p => { p.compare = []; });
  imp.compareIssues = []; imp.prevLabel = '';
  if (!imp.staff_group || !imp.month || !imp.year) return;
  const pm = imp.month === 1 ? 12 : imp.month - 1, py = imp.month === 1 ? imp.year - 1 : imp.year;
  const prev = Payroll.periods.find(x => x.staff_group === imp.staff_group && x.period_month === pm && x.period_year === py && (isSuperAdmin() ? x.org_id === currentUser().org_id : true));
  if (!prev) { imp.prevLabel = 'ไม่มีงวดก่อนหน้าให้เทียบ'; return; }
  const r = await rpcSecure('sfh_payroll_slips', { p_period_id: prev.id }, { loader: false });
  if (!r.ok) return;
  imp.prevLabel = `เทียบกับ ${TH_MONTHS[pm - 1]} ${py}`;
  const prevMap = new Map((r.data.slips || []).map(s => [s.full_name, s]));
  const seen = new Set();
  imp.people.forEach(p => {
    const q = prevMap.get(p.full_name);
    if (!q) { p.compare.push('บุคลากรใหม่ (ไม่มีในงวดก่อน)'); return; }
    seen.add(p.full_name);
    const before = Number(q.net_amount), now = p.net_amount;
    if (before > 0 && Math.abs(now - before) / before > 0.2)
      p.compare.push(`รับสุทธิเปลี่ยน ${now > before ? '+' : ''}${Math.round((now - before) / before * 100)}% จากงวดก่อน (${formatMoney(before, { unit: false })} → ${formatMoney(now, { unit: false })})`);
  });
  const missing = [...prevMap.keys()].filter(n => !seen.has(n));
  if (missing.length) imp.compareIssues.push({ level: 'warning', msg: `มีในงวดก่อนแต่ไม่พบในไฟล์นี้ ${missing.length} คน: ${missing.slice(0, 8).join(', ')}${missing.length > 8 ? ' …' : ''}` });
}
function payrollImportCounts(imp) {
  const errors = imp.counts.errors;
  const warnings = imp.counts.warnings + imp.people.reduce((a, p) => a + (p.compare || []).length, 0) + imp.compareIssues.length;
  return { errors, warnings };
}

async function payrollDoImport(el, imp, replace = false) {

  const period = {
    period_year: imp.year, period_month: imp.month, staff_group: imp.staff_group, org_title: imp.org_title || '', org_subtitle: imp.org_subtitle || '',
    source_filename: imp.fileName, sheet_count: imp.sheets.filter(s => !s.skipped).length,
  };
  const slips = imp.people.map(p => ({
    full_name: p.full_name, employee_type: p.employee_type, unit_name: p.unit_name, sub_unit: p.sub_unit || '', sheet_name: p.sheet,
    incomes: p.incomes, deductions: p.deductions, total_income: p.total_income, total_deduction: p.total_deduction, net_amount: p.net_amount,
    warnings: [...p.warnings, ...(p.compare || [])],

  if (!r.ok) return;
  if (r.data?.code === 'EXISTS') {
    const ok = await confirmModal({
      title: 'มีงวดนี้อยู่แล้ว', danger: true, icon: 'copy', confirmText: 'แทนที่ข้อมูลเดิม', confirmIcon: 'replace',
      message: `${payrollPeriodText(period)} (${PAYROLL_GROUPS[period.staff_group]}) มีข้อมูลอยู่แล้ว ${formatNumber(r.data.employee_count)} รายการ (${PAYROLL_STATUS[r.data.status]?.label})<br>ต้องการ <b>แทนที่ด้วยไฟล์นี้</b> หรือไม่? งวดจะกลับเป็นสถานะ "ร่าง"
        ${r.data.manual_count ? `<div class="mt-2 rounded-xl bg-blush-50 border border-blush-200 px-3 py-2 text-sm text-blush-600">${ic('alert-triangle', 'w-4 h-4 inline')} มีสลิปที่แก้ไข/เพิ่มด้วยมือ <b>${formatNumber(r.data.manual_count)} รายการ</b> ซึ่งจะถูกแทนที่ด้วยข้อมูลจากไฟล์ทั้งหมด</div>` : ''}`,
    });
    if (ok) await payrollDoImport(el, imp, true);
    return;
  }
  showToast(`นำเข้าเรียบร้อย ${formatNumber(r.data.count)} รายการ (สถานะร่าง)`, 'success', 5000);
  Payroll.imports = Payroll.imports.filter(x => x !== imp);
  const pr = await rpcSecure('sfh_payroll_periods', {}, { loader: false });
  if (pr.ok) Payroll.periods = pr.data || [];
  if (Payroll.imports.length) payrollDrawImports(el);
  else await payrollShowPeriod(el, r.data.period_id);
}

function payrollKnownItems(key) {
  const out = [];
  Payroll.slips.forEach(s => (s[key] || []).forEach(x => { if (!out.includes(x.name)) out.push(x.name); }));
  PAYROLL_DEFAULT_ITEMS[key].forEach(n => { if (!out.includes(n)) out.push(n); });
  return out;
}
function openPayrollSlipEditor(el, slip) {
  if (!requirePermission('payroll.manage')) return;
  const p = Payroll.period;
  if (!p || p.status === 'closed') return showToast('งวดนี้ปิดแล้ว แก้ไขสลิปไม่ได้ (ให้ Super Admin เปิดงวดก่อน)', 'warning');
  const clone = (list) => (list || []).map(x => ({ name: x.name, amount: x.amount }));
  const st = {
    incomes: slip ? clone(slip.incomes) : [{ name: 'เงินเดือน', amount: '' }],
    deductions: slip ? clone(slip.deductions) : [],
  };
  if (!st.incomes.length) st.incomes.push({ name: '', amount: '' });
  const uniq = (key) => [...new Set(Payroll.slips.map(s => s[key]).filter(Boolean))];
  const kindLabel = { incomes: 'รายการรับ', deductions: 'รายการหัก' };
  const m = openModal({
    title: slip ? `แก้ไขสลิป · ${esc(slip.full_name)}` : 'เพิ่มสลิปแบบ Manual', icon: slip ? 'file-pen' : 'file-plus-2', size: 'xl',
    body: `<div class="rounded-2xl ${slip ? 'bg-lilac-50 border-lilac-200' : 'bg-cream-50 border-cream-200'} border px-4 py-3 mb-4 text-sm text-slate-600">
        ${ic('info', 'w-4 h-4 inline')} ${slip
          ? `แก้ไขสลิปที่ข้อมูลผิดพลาด ${slip.entry_type === 'import' || !slip.entry_type ? '· ระบบจะเก็บค่าจากไฟล์เดิมไว้ตรวจสอบย้อนหลัง' : ''}`
          : 'เพิ่มสลิปสำหรับผู้มีสิทธิ์ที่ไม่มีในไฟล์ Excel หรือถูกตัดหล่น'} · ${payrollPeriodText(p)} (${PAYROLL_GROUPS[p.staff_group]})
        <div class="text-xs text-slate-500 mt-1">ระบบคำนวณรวมรับ/รวมหัก/รับสุทธิให้อัตโนมัติ · ต้องระบุเหตุผลทุกครั้ง (บันทึกใน Audit Log)</div></div>
      <form id="psEditForm" class="space-y-4" autocomplete="off">
        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <div class="lg:col-span-2"><label class="label">ชื่อ-สกุล *</label><input name="full_name" class="input" value="${esc(slip?.full_name || '')}" required placeholder="เช่น นายสมชาย ใจดี"></div>
          <div><label class="label">ประเภท</label><input name="employee_type" class="input" list="psTypes" value="${esc(slip?.employee_type || '')}"></div>
          <div><label class="label">หน่วยงาน (งาน)</label><input name="unit_name" class="input" list="psUnits" value="${esc(slip?.unit_name || '')}"></div>
        </div>
        <datalist id="psTypes">${uniq('employee_type').map(v => `<option value="${esc(v)}">`).join('')}</datalist>
        <datalist id="psUnits">${uniq('unit_name').map(v => `<option value="${esc(v)}">`).join('')}</datalist>
        <datalist id="psIncNames">${payrollKnownItems('incomes').map(v => `<option value="${esc(v)}">`).join('')}</datalist>
        <datalist id="psDedNames">${payrollKnownItems('deductions').map(v => `<option value="${esc(v)}">`).join('')}</datalist>
        <div class="grid lg:grid-cols-2 gap-4">
          ${['incomes', 'deductions'].map(k => `<div class="rounded-2xl border border-slate-200 p-3">
            <div class="flex items-center justify-between mb-2"><div class="font-medium text-slate-700">${kindLabel[k]}</div>
              <button type="button" class="btn btn-soft btn-sm" data-ps-add="${k}">${ic('plus', 'w-3.5 h-3.5')} เพิ่มรายการ</button></div>
            <div data-ps-rows="${k}" class="space-y-2"></div>
            <div class="flex justify-between mt-3 pt-2 border-t border-slate-100 text-sm font-semibold"><span>รวม${kindLabel[k]}</span><span data-ps-sum="${k}">0.00</span></div>
          </div>`).join('')}
        </div>
        <div class="rounded-2xl bg-mint-50 border border-mint-200 px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
          <div class="font-semibold text-slate-700">รับสุทธิ</div>
          <div class="text-sm text-slate-500 flex-1" data-ps-text></div>
          <div class="text-xl font-bold text-mint-600 whitespace-nowrap" data-ps-net>0.00 บาท</div>
        </div>
        <div><label class="label">เหตุผลการ${slip ? 'แก้ไข' : 'เพิ่มสลิป'} *</label>
          <textarea name="reason" class="input" rows="2" required placeholder="${slip ? 'เช่น ยอดภาษีหัก ณ ที่จ่ายในไฟล์ไม่ถูกต้อง ตามบันทึกที่ ...' : 'เช่น พนักงานบรรจุใหม่ ไม่มีในไฟล์ประจำเดือน'}"></textarea></div>
      </form>`,
    footer: `<button class="btn btn-ghost" data-close>ยกเลิก</button>
      <button type="button" class="btn btn-soft" data-ps-preview>${ic('eye')} ดูตัวอย่างสลิป</button>
      <button class="btn btn-primary" type="submit" form="psEditForm">${ic('save')} บันทึก</button>`,
  });
  const form = $('#psEditForm', m.el);
  const parseAmt = (v) => PayrollParser.num(v);
  const collect = (k) => st[k].map(x => ({ name: String(x.name || '').trim(), raw: x.amount, p: parseAmt(x.amount) }));
  const totals = () => {
    const sum = (k) => Math.round(collect(k).filter(x => x.name && x.p.ok).reduce((a, x) => a + x.p.v, 0) * 100) / 100;
    const ti = sum('incomes'), td = sum('deductions');
    return { ti, td, net: Math.round((ti - td) * 100) / 100 };
  };
  const drawTotals = () => {
    const t = totals();
    $('[data-ps-sum="incomes"]', m.el).textContent = formatMoney(t.ti, { unit: false });
    $('[data-ps-sum="deductions"]', m.el).textContent = formatMoney(t.td, { unit: false });
    $('[data-ps-net]', m.el).textContent = formatMoney(t.net);
    $('[data-ps-net]', m.el).classList.toggle('text-blush-500', t.net <= 0);
    $('[data-ps-text]', m.el).textContent = `(${bahtText(t.net)})`;
  };
  const drawRows = (k) => {
    $(`[data-ps-rows="${k}"]`, m.el).innerHTML = st[k].length ? st[k].map((x, i) => `<div class="flex gap-2 items-center">
        <input class="input !py-2 flex-1 min-w-0" list="${k === 'incomes' ? 'psIncNames' : 'psDedNames'}" placeholder="ชื่อรายการ" value="${esc(x.name)}" data-ps-k="${k}" data-ps-i="${i}" data-ps-f="name">
        <input class="input !py-2 w-32 text-right" inputmode="decimal" placeholder="0.00" value="${x.amount === '' ? '' : esc(x.amount)}" data-ps-k="${k}" data-ps-i="${i}" data-ps-f="amount">
        <button type="button" class="btn-icon hover:!text-blush-500" data-ps-del="${k}" data-ps-i="${i}" title="นำออก">${ic('x', 'w-4 h-4')}</button></div>`).join('')
      : `<div class="text-sm text-slate-400 text-center py-2">– ไม่มีรายการ –</div>`;
    enhanceDatalists($(`[data-ps-rows="${k}"]`, m.el));
    refreshIcons();
  };
  drawRows('incomes'); drawRows('deductions'); drawTotals();
  m.el.addEventListener('input', (e) => {
    const t = e.target.closest('[data-ps-k]');
    if (!t) return;
    st[t.dataset.psK][+t.dataset.psI][t.dataset.psF] = t.value;
    if (t.dataset.psF === 'amount') t.classList.toggle('!border-blush-300', !!t.value && !parseAmt(t.value).ok);
    drawTotals();
  });
  m.el.addEventListener('click', (e) => {
    const add = e.target.closest('[data-ps-add]');
    if (add) { st[add.dataset.psAdd].push({ name: '', amount: '' }); drawRows(add.dataset.psAdd); $(`[data-ps-rows="${add.dataset.psAdd}"] > div:last-child input`, m.el)?.focus(); return; }
    const del = e.target.closest('[data-ps-del]');
    if (del) { st[del.dataset.psDel].splice(+del.dataset.psI, 1); drawRows(del.dataset.psDel); drawTotals(); return; }
    if (e.target.closest('[data-ps-preview]')) {
      const t = totals();
      const items = (k) => collect(k).filter(x => x.name && x.p.ok && x.p.v !== 0).map(x => ({ name: x.name, amount: Math.round(x.p.v * 100) / 100 }));
      openPayrollSlipPreview({ full_name: form.full_name.value.trim() || '(ยังไม่ระบุชื่อ)', employee_type: form.employee_type.value.trim(), unit_name: form.unit_name.value.trim(),
        incomes: items('incomes'), deductions: items('deductions'), total_income: t.ti, total_deduction: t.td, net_amount: t.net }, payrollMeta(p));
    }
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!requirePermission('payroll.manage')) return;
    const name = form.full_name.value.trim(), reason = form.reason.value.trim();
    if (!name) return showToast('กรุณาระบุชื่อ-สกุล', 'warning');
    const rows = [...collect('incomes').map(x => ({ ...x, k: 'รายการรับ' })), ...collect('deductions').map(x => ({ ...x, k: 'รายการหัก' }))];
    const bad = rows.find(x => (x.name || x.raw !== '') && (!x.name || !x.p.ok || x.p.v < 0));
    if (bad) return showToast(!bad.name ? `${bad.k}: กรุณาระบุชื่อรายการ` : `${bad.k} "${bad.name}": จำนวนเงินไม่ถูกต้อง`, 'warning', 5000);
    const t = totals();
    if (t.ti <= 0) return showToast('ต้องมีรายการรับอย่างน้อย 1 รายการ', 'warning');
    if (!reason) { form.reason.focus(); return showToast('กรุณาระบุเหตุผล', 'warning'); }
    if (t.net <= 0 && !(await confirmModal({ title: 'รับสุทธิเป็นศูนย์หรือติดลบ', danger: false, icon: 'alert-triangle', confirmText: 'บันทึกต่อ', message: `รับสุทธิ ${formatMoney(t.net)} ต้องการบันทึกหรือไม่?` }))) return;
    const items = (k) => collect(k).filter(x => x.name && x.p.v !== 0).map(x => ({ name: x.name, amount: Math.round(x.p.v * 100) / 100 }));
    const r = await rpcSecure('sfh_payroll_save_slip', {
      p_period_id: p.id, p_slip_id: slip?.id || null, p_reason: reason,
      p_slip: { full_name: name, employee_type: form.employee_type.value.trim(), unit_name: form.unit_name.value.trim(), sub_unit: slip?.sub_unit || '', incomes: items('incomes'), deductions: items('deductions') },
    }, { loaderText: 'กำลังบันทึกสลิป...', error: 'บันทึกสลิปไม่สำเร็จ' });
    if (!r.ok) return;
    showToast(`${slip ? 'แก้ไข' : 'เพิ่ม'}สลิปของ ${name} เรียบร้อย · รับสุทธิ ${formatMoney(r.data.net_amount)}`, 'success', 5000);
    m.close();
    await payrollShowPeriod(el, p.id);
  };
}
async function payrollDeleteSlip(el, s) {
  if (!requirePermission('payroll.manage')) return;
  const m = openModal({
    title: 'ลบสลิป', icon: 'trash-2', size: 'sm',
    body: `<p class="text-sm text-slate-600 mb-3">ลบสลิปของ <b>${esc(s.full_name)}</b> (รับสุทธิ ${formatMoney(s.net_amount)}) ออกจากงวดนี้?<br>
        <span class="text-xs text-slate-400">ใช้กรณีรายชื่อซ้ำ หรือไม่มีสิทธิ์รับเงินงวดนี้ · ยอดรวมของงวดจะคำนวณใหม่</span></p>
      <form id="psDelForm"><label class="label">เหตุผลการลบ *</label><textarea name="reason" class="input" rows="2" required placeholder="เช่น รายชื่อซ้ำกับแถว ... / ลาออกก่อนวันจ่าย"></textarea></form>`,
    footer: `<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-pink" type="submit" form="psDelForm">${ic('trash-2')} ลบสลิป</button>`,
  });
  $('#psDelForm', m.el).onsubmit = async (e) => {
    e.preventDefault();
    const reason = e.target.reason.value.trim();
    if (!reason) return showToast('กรุณาระบุเหตุผล', 'warning');
    const r = await rpcSecure('sfh_payroll_delete_slip', { p_slip_id: s.id, p_reason: reason }, { loaderText: 'กำลังลบ...', error: 'ลบสลิปไม่สำเร็จ', success: `ลบสลิปของ ${s.full_name} เรียบร้อย` });
    if (!r.ok) return;
    m.close();
    await payrollShowPeriod(el, Payroll.period.id);
  };
}

/* ---------- แท็บ "สลิปแบบ Manual": สลิปเพิ่มเติมแยกจากงวดที่นำเข้า (เช่น สลิปเงินตกเบิก) ----------
   ตาราง payroll_manual_slips · ข้อมูลผ่าน rpcSecure('sfh_payroll_manual_*') · สิทธิ์ payroll.view / payroll.manage / payroll.print */
Object.assign(TABLE_LABELS, { payroll_manual_slips: 'สลิปเงินเดือน (Manual)' });
const PM = { slips: [], table: null, selected: new Set() };
const PM_TITLES = ['สลิปเงินเดือน', 'สลิปเงินตกเบิก', 'สลิปค่าตอบแทน', 'สลิปเงินเดือน (ฉบับแก้ไข)'];
const pmMeta = (s) => ({ org_title: s.org_title, org_subtitle: s.org_subtitle, period_year: s.period_year, period_month: s.period_month, staff_group: s.staff_group, slip_title: s.slip_title });
const pmWithMeta = (s) => ({ ...s, _meta: pmMeta(s) });

/** แสดงแท็บ "สลิปแบบ Manual" ภายในหน้าสลิปเงินเดือน */
async function payrollShowManual(el) {

      ${ic('info', 'w-4 h-4 inline text-lilac-500')} สลิปเพิ่มเติมที่จัดทำด้วยมือ แยกจากงวดที่นำเข้าจาก Excel (ไม่กระทบสลิปในงวด) – เช่น สลิปเงินตกเบิก หรือผู้ที่ไม่มีในไฟล์ ·
      ระบบออกเลขที่สลิปให้อัตโนมัติ (MSปปปป-ลำดับ)</div>
    <div id="pmStats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${skeletonCards(4, 'h-24')}</div>

}
function pmUpdateSel(el) {
  const b = $('[data-pm="print-selected"]', el);
  if (b) { b.disabled = !PM.selected.size; $('[data-pm-count]', b).textContent = PM.selected.size; }
}
async function pmLoad(el) {
  const r = await rpcSecure('sfh_payroll_manual_list', {}, { loaderText: 'กำลังโหลดสลิป...', error: 'โหลดสลิปไม่สำเร็จ' });
  if (!r.ok) { $('#pmTable', el).innerHTML = errorState('โหลดข้อมูลไม่สำเร็จ', dbErrorMessage(r.error)); $('#pmStats', el).innerHTML = ''; refreshIcons(); return; }
  PM.slips = (r.data || []).map(pmWithMeta);
  PM.selected = new Set();
  const canManage = hasPermission('payroll.manage');
  const canPrint = hasPermission('payroll.print');

    const pr = await rpcSecure('sfh_payroll_periods', {}, { loader: false });
    if (pr.ok) Payroll.periods = pr.data || [];
  }
  const now = new Date(), cm = now.getMonth() + 1, cy = now.getFullYear() + 543;
  const thisMonth = PM.slips.filter(s => s.period_month === cm && s.period_year === cy);
  $('#pmStats', el).innerHTML = [
    statCard({ label: 'สลิปทั้งหมด', value: formatNumber(PM.slips.length), icon: 'files', tone: 'lilac' }),
    statCard({ label: `ประจำเดือน ${TH_MONTHS_SHORT[cm - 1]} ${cy}`, value: formatNumber(thisMonth.length), icon: 'calendar', tone: 'brand' }),
    statCard({ label: 'รับสุทธิรวม (ทั้งหมด)', value: formatMoney(PM.slips.reduce((a, s) => a + Number(s.net_amount), 0), { unit: false }), icon: 'wallet', tone: 'mint' }),
    statCard({ label: 'เลขที่ล่าสุด', value: `<span class="text-base">${esc(PM.slips.slice().sort((a, b) => (b.doc_year - a.doc_year) || (b.doc_seq - a.doc_seq))[0]?.doc_no || '-')}</span>`, icon: 'hash', tone: 'cream' }),

  if (!PM.slips.length) {
    $('#pmTable', el).innerHTML = `<div class="text-center py-8">
      <div class="w-16 h-16 mx-auto rounded-3xl bg-lilac-100 grid place-items-center mb-3">${ic('file-pen-line', 'w-8 h-8 text-lilac-500')}</div>

      <p class="text-sm text-slate-500 mt-1">${canManage ? 'กด "สร้างสลิปใหม่" เพื่อจัดทำสลิปเพิ่มเติม เช่น สลิปเงินตกเบิก' : 'รอเจ้าหน้าที่การเงินจัดทำสลิป'}</p>

    refreshIcons(); return;
  }
  const periods = [...new Set(PM.slips.map(s => `${s.period_year}-${String(s.period_month).padStart(2, '0')}`))].sort().reverse();
  const uniq = (k) => [...new Set(PM.slips.map(s => s[k]).filter(Boolean))];
  PM.table = createDataTable($('#pmTable', el), {
    pageSize: 15,
    searchKeys: ['doc_no', 'full_name', 'unit_name', 'employee_type', 'slip_title', 'note'], searchPlaceholder: 'ค้นหาเลขที่ ชื่อ-สกุล หน่วยงาน หรือหมายเหตุ...',
    filters: [
      { key: 'period', label: 'ทุกเดือน', options: periods.map(p => { const [y, m] = p.split('-'); return { value: p, label: `${TH_MONTHS[+m - 1]} ${y}` }; }),
        match: (s, v) => `${s.period_year}-${String(s.period_month).padStart(2, '0')}` === v },
      { key: 'slip_title', label: 'ทุกหัวเรื่อง', options: uniq('slip_title').map(v => ({ value: v, label: v })) },
      ...(uniq('staff_group').length ? [{ key: 'staff_group', label: 'ทุกสังกัด', options: uniq('staff_group').map(v => ({ value: v, label: v })) }] : []),
    ],
    toolbar: canPrint ? `<button class="btn btn-soft" data-pm="select-filtered">${ic('check-square', 'w-4 h-4')} เลือกทั้งหมด</button>
      <button class="btn btn-ghost" data-pm="select-none">${ic('square', 'w-4 h-4')} ล้าง</button>
      <button class="btn btn-primary" data-pm="print-selected" disabled>${ic('printer', 'w-4 h-4')} พิมพ์ที่เลือก (<span data-pm-count>0</span>)</button>` : '',
    columns: [
      ...(canPrint ? [{ key: '_sel', label: '', class: 'w-8', hideOnCard: true, render: s => `<input type="checkbox" class="w-4 h-4 accent-brand-500" data-pm-sel="${s.id}" ${PM.selected.has(s.id) ? 'checked' : ''} aria-label="เลือก">` }] : []),
      { key: 'full_name', label: 'ชื่อ-สกุล', render: s => `<div class="flex items-center gap-2">${canPrint ? `<input type="checkbox" class="md:hidden w-4 h-4 accent-brand-500" data-pm-sel="${s.id}" ${PM.selected.has(s.id) ? 'checked' : ''}>` : ''}
          <div class="min-w-0"><button class="font-medium text-slate-700 hover:text-brand-600 text-left" data-pm="preview" data-id="${s.id}">${esc(s.full_name)}</button>
          <div class="text-xs text-slate-400">${esc(s.doc_no)}${s.employee_type ? ` · ${esc(s.employee_type)}` : ''}</div></div></div>` },

async function pmOnClick(el, e) {
  const b = e.target.closest('[data-pm]');
  if (!b) return;
  const s = PM.slips.find(x => x.id === b.dataset.id);
  switch (b.dataset.pm) {
    case 'new': openPmEditor(el, null); break;
    case 'edit': if (s) openPmEditor(el, s); break;
    case 'copy': if (s) openPmEditor(el, s, { copy: true }); break;
    case 'delete': if (s) pmDelete(el, s); break;
    case 'preview': if (s) openPayrollSlipPreview(s, s._meta, { canPrint: false }); break;
    case 'print-one': if (s) pmPrint([s], `${s.doc_no} · ${s.full_name}`); break;
    case 'print-selected': {
      const list = PM.slips.filter(x => PM.selected.has(x.id));
      if (!list.length) return showToast('กรุณาเลือกสลิปที่ต้องการพิมพ์ก่อน', 'warning');
      pmPrint(list, `ที่เลือก ${list.length} ใบ`); break;
    }
    case 'select-filtered': PM.table.getFiltered().forEach(x => PM.selected.add(x.id)); PM.table.render(); pmUpdateSel(el); break;
    case 'select-none': PM.selected.clear(); PM.table.render(); pmUpdateSel(el); break;
  }
}

const pcClone = (x) => JSON.parse(JSON.stringify(x));
const pcTplLatest = () => Pc.tpls[0] || null;
const pcTplVersion = (v) => (v ? Pc.tpls.find(t => t.version === v) : null);
/** template ของฉบับ no ที่โครงการนี้ใช้ */
function pcTplFor(f, no) {
  if (f.tplo?.[no]) return f.tplo[no];
  const set = f.tplv ? (pcTplVersion(f.tplv) || pcTplLatest()) : null;
  return set?.data?.docs?.[no] || PC_TPL_DEFAULT[no];
}
/** แปลง template เป็นบล็อกสำหรับแสดงผล (แทนตัวแปรด้วยข้อมูลโครงการ) */
function pcResolve(tpl, f, V) {
  const s = f.staff, k = pcK(f), tt = pcTotals(f), out = [];
  const person = (who) => { const p = s[who] || {}; if (!p.name && who === 'officer') return s.maker; if (!p.name && who === 'maker') return s.officer; return p; };
  let skip = -1;
  (tpl || []).forEach((b, idx) => {
    if (idx <= skip) return;
    if (b.t === 'p') out.push({ t: 'p', r: [{ x: pcFill(b.text, V), b: !!b.b }], ind: !!b.ind, al: b.al || 'left', sz: b.sz ? +b.sz : undefined, sb: +b.sb || 0 });
    else if (b.t === 'memo') out.push({ t: 'memo', unit: pcFill(b.unit, V).replace(/\s+$/, ''), no: pcFill(b.no, V), date: pcFill(b.date, V), subject: pcFill(b.subject, V) });
    else if (b.t === 'garuda' || b.t === 'rule') out.push({ t: b.t });
    else if (b.t === 'items') out.push(pcItemsTable(f));
    else if (b.t === 'reqtable') { const its = f.items.filter(i => i.name || pcNum(i.price)), list = its.length ? its : [{ name: '', qty: '', unit: '' }];
      out.push({ t: 'table', cols: [{ w: 8, al: 'center' }, { w: 44 }, { w: 10, al: 'center' }, { w: 13, al: 'center' }, { w: 13, al: 'center' }, { w: 12 }],
        head: ['ลำดับ', 'รายการ', 'หน่วย', 'จำนวนที่ขอเบิก', 'จำนวนที่จ่าย', 'หมายเหตุ'],
        rows: list.map((i, n) => [String(n + 1), pcPh(i.name, 30), i.unit || '', i.qty === '' ? '' : String(pcNum(i.qty)), i.qty === '' ? '' : String(pcNum(i.qty)), '']),
        foot: [[{ v: `รวม ${its.length || 0} รายการ`, span: 6, al: 'right' }]] }); }
    else if (b.t === 'evaltable') out.push({ t: 'table', cols: [{ w: 8, al: 'center' }, { w: 34 }, { w: 26 }, { w: 16, al: 'right' }, { w: 16, al: 'right' }], head: ['ลำดับ', 'รายการพิจารณา', 'ผู้เสนอราคา', 'ราคาที่เสนอ', 'ราคาที่ตกลง'],
      rows: [['1', V['เรื่อง'], V['ร้าน'], pcMoney(tt.total), pcMoney(tt.total)]], foot: [[{ v: 'รวม', span: 4, al: 'right' }, { v: pcMoney(tt.total), al: 'right' }]] });
    else if (b.t === 'po_head') out.push({ t: 'kv2', left: [`${k.vendor}  ${V['ร้าน']}`, `ที่อยู่  ${V['ที่อยู่ร้าน']}`, `โทรศัพท์  ${V['โทรร้าน']}`, `เลขประจำตัวผู้เสียภาษี  ${V['เลขผู้เสียภาษีร้าน']}`],
      right: [`${k.order}เลขที่  ${V['เลขที่ใบสั่ง']}`, `วันที่  ${V['วันที่สั่ง']}`, `ส่วนราชการ  ${pcPh([f.org.unit, f.org.main].filter(Boolean).join(' '), 24)}`, `ที่อยู่  ${V['ที่อยู่หน่วยงาน']}`, `โทรศัพท์  ${pcPh(f.org.phone, 14)}`] });
    else if (b.t === 'po_sign') out.push({ t: 'grid', eq: true, sb: +b.sb || 14, cells: [{ label: '', lines: ['ลงชื่อ ' + '.'.repeat(36) + ` ผู้สั่ง${k.v}`, ...pcSignLines(s.approver, [s.approver.acting]), `วันที่ ${V['วันที่สั่ง']}`] },
      { label: '', lines: ['ลงชื่อ ' + '.'.repeat(36) + ` ผู้รับ${k.order}`, `(${'.'.repeat(36)})`, k.vendor, 'วันที่ ' + '.'.repeat(30)] }] });   // ผู้รับใบสั่ง: เว้นว่างให้ลงชื่อเอง
    else if (b.t === 'sign') {   // กล่องลายมือชื่อที่อยู่ติดกัน: ซ้ายตามด้วยขวา = แถวเดียวกัน · ซ่อนถ้าว่าง
      const run = []; let j = idx; while (tpl[j]?.t === 'sign') run.push(tpl[j++]); skip = j - 1;
      const cells = run.map(x => ({ x, c: pcSignCell(x, f, V, person) })).filter(r => r.c);
      for (let k = 0, first = true; k < cells.length; k++, first = false) { const r = cells[k], nx = cells[k + 1];
        const pair = r.x.col === 'L' && nx && nx.x.col !== 'L', sb = first ? (+r.x.sb || 12) : 14;
        out.push({ t: 'grid', cells: pair ? [r.c, nx.c] : r.x.col === 'L' ? [r.c, null] : [r.c], sb }); if (pair) k++; }
    }
    else if (b.t === 'signers') {   // รูปแบบเดิม (แสดงผลได้ · ตัวแก้ไขแปลงเป็นกล่องลายมือชื่อ)
      const rows = (b.rows || []).map(r => { const nm = pcFill(r.name, V), ps = pcFill(r.pos, V);
        return { col: r.col === 'L' ? 'L' : 'R', hide: r.opt && pcBlankTxt(nm) && pcBlankTxt(ps), cell: { label: pcFill(r.label, V), gap: 12, lines: pcSignerLines(nm, ps) } }; }).filter(r => !r.hide);
      for (let i = 0, first = true; i < rows.length; i++, first = false) { const r = rows[i], nx = rows[i + 1];
        const cells = r.col === 'L' && nx?.col === 'R' ? (i++, [r.cell, nx.cell]) : r.col === 'L' ? [r.cell, null] : [r.cell];
        out.push({ t: 'grid', cells, sb: first ? (+b.sb || 12) : 14 }); }
    }
    else if (b.t === 'approvals') {   // แยกทีละแถว (2 ช่อง) → แบ่งหน้าได้ทีละแถว ไม่ยกทั้งก้อนไปหน้าถัดไป
      const cells = b.only ? [{ label: `- ${b.last || 'อนุมัติ'}`, lines: pcSignLines(s.approver, [s.approver.acting]) }] : pcApprovals(f, b.last || 'อนุมัติ').cells;
      for (let i = 0; i < cells.length; i += 2) out.push({ t: 'grid', cells: cells.slice(i, i + 2), sb: i ? 14 : (+b.sb || 12) });
    }
  });
  return out;
}
/** ช่องลายมือชื่อ 1 คน: ความเห็น / (บรรทัดลงชื่อ) / (ชื่อ) / ตำแหน่ง · กล่องรูปแบบเดิมที่ยังมี who ใช้ข้อมูลข้อ 1.4 · ซ่อนถ้าว่าง → null */
function pcSignCell(b, f, V, person) {
  const s = f.staff, p0 = b.who && !b.name && !b.pos ? person(b.who) : null;
  // ตำแหน่งว่าง + ชื่อเป็นตัวแปรบุคคลในข้อ 1.4 → ใช้ตำแหน่ง (และบรรทัดเพิ่มเติมของผู้อนุมัติ) จากข้อ 1.4
  const autoPos = !p0 && !String(b.pos || '').trim() ? PC_SIGN_PRESETS.find(x => x[2] === String(b.name || '').trim())?.[3] : null;
  const nm = p0 ? p0.name : pcFill(b.name, V), ps = p0 ? [p0.pos, b.who === 'approver' ? s.approver.acting : ''].filter(Boolean).join('\n') : pcFill(autoPos ?? b.pos, V);
  if (b.opt && pcBlankTxt(nm) && pcBlankTxt(ps)) return null;
  return { label: b.label ? pcFill(b.label, V) : '', gap: b.top ? 4 : 12, lines: [...(b.top ? [pcFill(b.top, V)] : []), ...pcSignerLines(nm, ps)] };
}
const pcBlankTxt = (x) => /^[.\s]*$/.test(x || '');
/** บรรทัดลายมือชื่อ: (ชื่อ) + ตำแหน่ง (หลายบรรทัดได้) · ชื่อว่าง → เส้นจุดให้เขียนเอง */
const pcSignerLines = (name, pos) => [`(${pcBlankTxt(name) ? '.'.repeat(36) : String(name).trim()})`, ...String(pos || '').split('\n').map(x => x.trim()).filter(Boolean)];
/** เอกสาร 9 ฉบับของโครงการ · draft = template ที่กำลังแก้ (แสดงตัวอย่างระหว่างแก้) */
function pcDocs(f, draft) {
  const V = pcVars(f);
  return PC_DOCS.map(d => ({ no: d.no, blocks: pcResolve(draft?.[d.no] || pcTplFor(f, d.no), f, V) }));
}

function pcPaginate(doc) {
  let m = $('#pcMeasure'); if (!m) { m = document.createElement('div'); m.id = 'pcMeasure'; m.className = 'pc-page pc-measure'; document.body.appendChild(m); }

async function pcSave(el) {
  const f = Pc.f, tt = pcTotals(f);
  if (!f.subject.trim()) { showToast('กรุณาระบุเรื่องที่จะซื้อ/จ้าง', 'warning'); $('[data-f="subject"]', el)?.focus(); return; }
  if (tt.total > PC_LIMIT) { showToast(`วงเงินรวม ${pcMoney(tt.total)} บาท เกิน 5,000 บาท`, 'warning'); return; }
  const data = { ...f, fy: pcFy(f) };
  if (Pc.mode === 'db') {
    const r = await rpcSecure('sfh_proc_save', { p_id: Pc.id, p_data: data }, { loaderText: 'กำลังบันทึก...', error: 'บันทึกไม่สำเร็จ', success: 'บันทึกโครงการแล้ว' });

    let p = list.find(x => x.id === Pc.id);

    if (!pcLocalSave({ ...L, projects: list })) return;
    Object.assign(Pc, { id: p.id, seq: p.seq }); await pcLoad(); showToast('บันทึกโครงการในเบราว์เซอร์นี้แล้ว', 'success');
  }

}

    const LN = { style: D.BorderStyle.SINGLE, size: 4, color: '000000' }, LINES = { top: LN, bottom: LN, left: LN, right: LN, insideHorizontal: LN, insideVertical: LN };
    const cell = (children, o = {}) => new D.TableCell({ children, columnSpan: o.span || 1, width: o.w ? { size: o.w, type: D.WidthType.PERCENTAGE } : undefined, borders: o.borders, margins: { left: tw(1.5), right: tw(1.5) } });
    const garImg = (hmm) => gar ? new D.ImageRun({ data: gar.buf, transformation: { width: Math.round(hmm * PX_MM * gar.ratio), height: Math.round(hmm * PX_MM) } }) : run('[ตราครุฑ]', { sz: 12 });
    const signParas = (lines, sb) => lines.map((l, i) => para([run(l)], { al: 'center', ml: 65, sb: i ? 0 : sb }));
    const toDocx = (b) => {
      if (b.t === 'memo') return [
        new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: NONE, rows: [new D.TableRow({ children: [
          cell([para([garImg(15)])], { w: 20, borders: NONE }), cell([para([run('บันทึกข้อความ', { b: true, sz: 29 })], { al: 'center' })], { w: 60, borders: NONE }), cell([para([])], { w: 20, borders: NONE })] })] }),
        para([run('ส่วนราชการ', { b: true, sz: 20 }), run('  ' + (b.unit || '.'.repeat(60)))]),
        new D.Paragraph({ tabStops: [{ type: D.TabStopType.LEFT, position: tw(80) }], children: [run('ที่', { b: true, sz: 20 }), run('  ' + (b.no || '.'.repeat(24))), new D.TextRun({ text: '\t' }), run('วันที่', { b: true, sz: 20 }), run('  ' + b.date)] }),
        para([run('เรื่อง', { b: true, sz: 20 }), run('  ' + b.subject)])];
      if (b.t === 'garuda') return [para([garImg(30)], { al: 'center' })];
      if (b.t === 'p') return [para((b.r || []).map(x => run(x.x, { b: x.b, sz: b.sz })), b)];
      if (b.t === 'rule') return [para([run('-'.repeat(30))], { al: 'center' })];
      if (b.t === 'sign') return signParas(b.lines, b.sb || 0);
      if (b.t === 'table') {
        const head = new D.TableRow({ tableHeader: true, children: b.head.map((h, i) => cell([para([run(h, { b: true, sz: 15 })], { al: 'center' })], { w: b.cols[i].w })) });
        const rows = b.rows.map(r => new D.TableRow({ children: r.map((c, i) => cell([para([run(c, { sz: 15 })], { al: b.cols[i].al || 'left' })], { w: b.cols[i].w })) }));
        const foot = b.foot.map(r => new D.TableRow({ children: r.map(c => cell([para([run(c.v, { sz: 15, b: c.b })], { al: c.al || 'left' })], { span: c.span })) }));
        return [new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: LINES, rows: [head, ...rows, ...foot] })];
      }
      if (b.t === 'grid') {
        if (b.cells.length === 1 && b.cells[0]) { const c = b.cells[0]; return [...(c.label ? [para([run(c.label)], { ml: 65, sb: b.sb || 12 })] : []), ...signParas(['', ...((c.gap ?? 0) >= 12 ? [''] : []), ...c.lines], c.label ? 0 : (b.sb || 12))]; }
        const rows = []; for (let i = 0; i < b.cells.length; i += 2) rows.push(b.cells.slice(i, i + 2));
        return [para([], { sb: b.sb || 12 }), new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: NONE, rows: rows.map(pair => new D.TableRow({ children: [0, 1].map(j => { const c = pair[j];
          return cell(c ? [...(c.label ? [para([run(c.label)])] : []), para([]), ...(c.label || (c.gap ?? 0) >= 12 ? [para([])] : []), ...c.lines.map(l => para([run(l)], { al: 'center' }))] : [para([])], { w: b.eq ? 50 : j ? 59.375 : 40.625, borders: NONE }); }) })) })];
      }
      if (b.t === 'kv2') return [new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: NONE,   // ส่วนหัวใบสั่ง: ไม่มีกรอบ
        rows: [new D.TableRow({ children: [cell(b.left.map(l => para([run(l)])), { w: 50, borders: NONE }), cell(b.right.map(l => para([run(l)])), { w: 50, borders: NONE })] })] })];
      return [];
    };
    const doc = new D.Document({ styles: { default: { document: { run: { font: FONT, size: 32 } } } },
      sections: docs.map(d => ({ properties: { page: { size: { width: tw(210), height: tw(297) }, margin: { top: tw(15), right: tw(20), bottom: tw(20), left: tw(30), header: tw(7), footer: tw(10) } } },
        children: d.blocks.flatMap(toDocx) })) });
    const blob = await D.Packer.toBlob(doc);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast('ดาวน์โหลดไฟล์ Word แล้ว', 'success');
  } catch (e) { console.error('[SFH] docx', e); showToast(e.message || 'สร้างไฟล์ Word ไม่สำเร็จ', 'error'); }
  finally { showLoader(false); }
}

/* =====================================================================
   INIT – เริ่มระบบ
   ===================================================================== */
async function init() {
  renderChrome();
  if (!sb) {
    const prob = configProblem();
    console.warn(`[SFH] เชื่อมต่อ Supabase ไม่ได้ (${prob.code}): ${prob.title} · หน้าเว็บ: ${location.href}`);
    await loadMenus(); renderChrome();
    window.addEventListener('hashchange', route);
    route();
    showToast(`ยังไม่ได้เชื่อมต่อฐานข้อมูล: ${prob.title}`, 'warning', 8000);
    return;
  }
  showLoader(true, 'กำลังเริ่มระบบ...');
  try {
    await loadSettings();
    if (readSession()?.user?.id) await verifySession({ silent: true });   // ตรวจ is_active ซ้ำทุกครั้งที่เปิดหน้าใหม่
    await loadMenus();
  } catch (e) {
    console.error(e);
    showToast('เริ่มระบบไม่สำเร็จ: ' + dbErrorMessage(e), 'error', 7000);
  } finally {
    showLoader(false);
  }
  renderChrome();
  window.addEventListener('hashchange', route);
  route();
}
// ตรวจสถานะบัญชีซ้ำเมื่อกลับมาที่แท็บ (ทุก 5 นาที) – บัญชีที่ถูกปิดจะออกจากระบบอัตโนมัติ
// วาดหน้าใหม่เฉพาะเมื่อสิทธิ์/เมนูเปลี่ยน → งานที่ค้างบนจอ (ฟอร์ม หน้าต่าง) ไม่หายเมื่อสลับแท็บกลับมา
const navSignature = () => JSON.stringify([[...(State.perms || [])].sort(), (State.menus || []).map(m => `${m.menu_key}:${m.module?.status || ''}`)]);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !isLoggedIn() || Date.now() - State.lastSessionCheck < 5 * 60 * 1000) return;
  const before = navSignature();
  const ok = await verifySession({ silent: true });
  if (!ok) { await reloadNavigation(); navigate('home'); return; }
  await loadMenus();
  if (navSignature() !== before) { renderChrome(); route(); }
});
window.addEventListener('DOMContentLoaded', init);
