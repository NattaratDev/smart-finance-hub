async function renderRoles(el) {
  if (!requirePermission('roles.manage')) return;
  el.innerHTML = pageHeader({
    title: 'Role & Permission', icon: 'shield-check', tone: 'lilac',
    subtitle: 'Role = กลุ่มผู้ใช้งาน · Permission = สิ่งที่ทำได้ (รูปแบบ <code>module.action</code>)',
    actions: `<button class="btn btn-ghost" data-act="catalog">${ic('list')} ทะเบียน Permission</button><button class="btn btn-primary" data-act="add-role">${ic('plus')} เพิ่ม Role</button>`,
  }) + `<div class="grid lg:grid-cols-3 gap-4"><div id="roleList" class="space-y-3">${skeletonCards(4, 'h-20')}</div><div id="roleMatrix" class="lg:col-span-2">${skeletonCards(1, 'h-96')}</div></div>`;
  refreshIcons();
  let data, selectedId = null, working = new Set();
  const load = async () => {
    const r = await dbMany([
      s => s.from('roles').select('*').order('level', { ascending: false }),
      s => s.from('permissions').select('*').order('sort_order'),
      s => s.from('role_permissions').select('role_id, permission_id'),
      s => s.from('users').select('role_id'),
      s => s.from('modules').select('*').order('sort_order'),
    ], { error: 'โหลดข้อมูล Role ไม่สำเร็จ' });
    if (!r.ok) { $('#roleMatrix', el).innerHTML = errorState('โหลดข้อมูลไม่สำเร็จ', dbErrorMessage(r.error)); return false; }
    const [roles, perms, rps, users, mods] = r.data;
    data = { roles, perms, rps, users, mods };
    if (!selectedId || !roles.some(x => x.id === selectedId)) selectedId = roles[0]?.id;
    return true;
  };
  const rolePermSet = (id) => new Set(data.rps.filter(x => x.role_id === id).map(x => x.permission_id));
  const guestLockReason = (p) => {
    if (!p.is_public) return 'Guest ได้เฉพาะ view_public / use_public';
    const mod = data.mods.find(m => m.module_key === p.module_key);
    if (mod && !mod.allow_guest) return 'โมดูลนี้ไม่อนุญาตให้บุคคลทั่วไป';
    return '';
  };
  const drawList = () => {
    $('#roleList', el).innerHTML = data.roles.map(r => {
      const n = data.users.filter(u => u.role_id === r.id).length;
      const on = r.id === selectedId;
      return `<button type="button" data-act="select" data-id="${r.id}" class="card w-full text-left p-4 hover-lift ${on ? 'ring-2 ring-brand-300' : ''}">
        <div class="flex items-center gap-3">
          <span class="w-10 h-10 rounded-2xl grid place-items-center shrink-0" style="background:${hexToRgba(r.color, .15)};color:${r.color}">${ic(r.role_key === 'guest' ? 'globe' : 'shield', 'w-5 h-5')}</span>
          <span class="min-w-0 flex-1"><span class="block font-medium text-slate-700 truncate">${esc(r.name)}</span>
            <span class="block text-xs text-slate-400 font-mono">${esc(r.role_key)} · level ${r.level}</span></span>
          <span class="text-right shrink-0"><span class="block text-sm font-semibold text-slate-600">${r.role_key === 'guest' ? '—' : n}</span><span class="block text-[10px] text-slate-400">${r.role_key === 'guest' ? 'สาธารณะ' : 'ผู้ใช้'}</span></span>
        </div>
        <div class="flex items-center gap-2 mt-3">
          ${r.is_system ? `<span class="badge bg-slate-100 text-slate-500">${ic('lock', 'w-3 h-3')} Role ระบบ</span>` : '<span class="badge bg-mint-100 text-mint-600">กำหนดเอง</span>'}
          <span class="flex-1"></span>
          <span class="btn-icon !w-8 !h-8" data-act="edit-role" data-id="${r.id}" title="แก้ไข">${ic('pencil', 'w-4 h-4')}</span>
          ${r.is_system ? '' : `<span class="btn-icon !w-8 !h-8 hover:!text-blush-500" data-act="del-role" data-id="${r.id}" title="ลบ">${ic('trash-2', 'w-4 h-4')}</span>`}
        </div></button>`;
    }).join('');
    refreshIcons();
  };
  const drawMatrix = () => {
    const role = data.roles.find(r => r.id === selectedId);
    if (!role) return;
    const isGuest = role.role_key === 'guest', isSuper = role.role_key === 'super_admin';
    working = rolePermSet(role.id);
    $('#roleMatrix', el).innerHTML = `<div class="card p-4 md:p-5">
      <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
        <div class="flex-1 min-w-0"><h3 class="font-semibold text-slate-800">สิทธิ์ของ ${esc(role.name)}</h3>
          <p class="text-xs text-slate-400" id="permCount"></p></div>
        <button class="btn btn-primary" data-act="save-perms" ${isSuper ? 'disabled' : ''}>${ic('save')} บันทึกสิทธิ์</button>
      </div>
      ${isSuper ? `<div class="rounded-2xl bg-blush-50 border border-blush-200 p-3 text-sm text-slate-600 mb-4">${ic('crown', 'w-4 h-4 inline text-blush-400')} Super Admin ได้รับทุกสิทธิ์โดยอัตโนมัติ (ระบบคืนค่าทุก Permission ตอน Login)</div>` : ''}
      ${isGuest ? `<div class="rounded-2xl bg-cream-50 border border-cream-200 p-3 text-sm text-slate-600 mb-4">${ic('globe', 'w-4 h-4 inline text-cream-500')}
        Role <b>guest</b> ใช้กับบุคคลทั่วไป (ไม่ Login) · ติ๊กได้เฉพาะ <code>.view_public</code> / <code>.use_public</code> ของโมดูลที่อนุญาต
        · ทะเบียนคุมและสลิปเงินเดือนถูกล็อกไว้ · ฐานข้อมูลมี Trigger ตรวจซ้ำอีกชั้น</div>` : ''}
      <div class="grid md:grid-cols-2 gap-3">${groupPermissions(data.perms).map(([g, ps]) => {
        const mod = data.mods.find(m => m.module_key === g);
        return `<div class="rounded-2xl border border-slate-100 bg-white p-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="w-8 h-8 rounded-xl grid place-items-center" style="background:${hexToRgba(mod?.color || '#94A3B8', .15)};color:${mod?.color || '#64748B'}">${ic(mod?.icon || 'folder-key', 'w-4 h-4')}</span>
            <span class="font-medium text-sm text-slate-700 flex-1 min-w-0 truncate">${esc(permGroupLabel(g, data.mods))}</span>
            ${mod ? statusBadge(mod.status) : ''}
            ${!isSuper ? `<button type="button" class="text-xs text-brand-500 hover:underline" data-act="toggle-group" data-group="${esc(g)}">ทั้งหมด</button>` : ''}
          </div>
          <div class="space-y-1">${ps.map(p => {
            const reason = isGuest ? guestLockReason(p) : '';
            const dis = isSuper || !!reason;
            return `<label class="flex items-start gap-2.5 rounded-xl px-2 py-1.5 ${dis ? 'opacity-60' : 'hover:bg-brand-50 cursor-pointer'}" ${reason ? `title="${esc(reason)}"` : ''}>
              <input type="checkbox" class="mt-1 accent-brand-500 w-4 h-4" data-perm="${p.id}" data-group="${esc(g)}" ${isSuper || working.has(p.id) ? 'checked' : ''} ${dis ? 'disabled' : ''}>
              <span class="min-w-0 flex-1"><span class="text-sm text-slate-700">${esc(p.name)}</span><span class="block text-[11px] text-slate-400 font-mono">${esc(p.perm_key)}</span></span>
              ${reason ? ic('lock', 'w-3.5 h-3.5 text-slate-300 mt-1') : ''}</label>`;
          }).join('')}</div></div>`;
      }).join('')}</div></div>`;
    updateCount();
    refreshIcons();
  };
  const updateCount = () => { const c = $('#permCount', el); if (c) c.textContent = `เลือกแล้ว ${$$('[data-perm]:checked', el).length} จาก ${data.perms.length} สิทธิ์`; };
  const drawCatalog = () => {
    const m = openModal({
      title: 'ทะเบียน Permission', icon: 'list', size: 'xl',
      body: `<p class="text-sm text-slate-500 mb-3">กำหนดว่า <b>Org Admin</b> สามารถมอบสิทธิ์ใดให้ผู้ใช้ในหน่วยงานได้ และเพิ่ม Permission ใหม่สำหรับโมดูลในอนาคต</p>
        <form id="newPermForm" class="grid sm:grid-cols-4 gap-2 mb-4 rounded-2xl bg-brand-50/60 p-3">
          <select name="module_key" class="input">${[...new Set([...data.mods.map(x => x.module_key), ...Object.keys(PERM_GROUP_LABELS)])].map(k => `<option value="${esc(k)}">${esc(permGroupLabel(k, data.mods))} (${esc(k)})</option>`).join('')}</select>
          <input name="perm_action" class="input" placeholder="action เช่น approve" pattern="[a-z_]{2,30}" required>
          <input name="perm_name" class="input" placeholder="ชื่อสิทธิ์ (ไทย)" required>
          <button class="btn btn-primary" type="submit">${ic('plus')} เพิ่ม Permission</button>
        </form>
        <div class="overflow-x-auto rounded-2xl border border-slate-100"><table class="sfh-table w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr><th>Permission</th><th>ชื่อ</th><th class="text-center">Org Admin มอบได้</th><th></th></tr></thead>
        <tbody class="divide-y divide-slate-100">${data.perms.map(p => `<tr><td class="font-mono text-xs">${esc(p.perm_key)}</td><td>${esc(p.name)}</td>
          <td class="text-center"><label class="switch"><input type="checkbox" data-grant="${p.id}" ${p.org_admin_grantable ? 'checked' : ''}><span class="slider"></span></label></td>
          <td class="text-right"><button type="button" class="btn-icon hover:!text-blush-500" data-del-perm="${p.id}" title="ลบ">${ic('trash-2')}</button></td></tr>`).join('')}</tbody></table></div>`,
    });
    m.el.addEventListener('change', async (e) => {
      const t = e.target.closest('[data-grant]');
      if (!t || !requirePermission('roles.manage')) return;
      const p = data.perms.find(x => x.id === t.dataset.grant);
      const r = await db(s => s.from('permissions').update({ org_admin_grantable: t.checked }).eq('id', p.id), { loader: false, success: 'บันทึกแล้ว', error: 'บันทึกไม่สำเร็จ' });
      if (!r.ok) { t.checked = !t.checked; return; }
      p.org_admin_grantable = t.checked;
      logAudit('update', 'permissions', p.id, { perm_key: p.perm_key, org_admin_grantable: t.checked });
    });
    m.el.addEventListener('click', async (e) => {
      const d = e.target.closest('[data-del-perm]');
      if (!d || !requirePermission('roles.manage')) return;
      const p = data.perms.find(x => x.id === d.dataset.delPerm);
      const ok = await confirmModal({ title: 'ลบ Permission', message: `ลบ <code>${esc(p.perm_key)}</code> ออกจากระบบ? สิทธิ์นี้จะถูกถอนจากทุก Role และผู้ใช้` });
      if (!ok) return;
      const r = await db(s => s.from('permissions').delete().eq('id', p.id), { success: 'ลบ Permission เรียบร้อย', error: 'ลบไม่สำเร็จ' });
      if (!r.ok) return;
      await logAudit('delete', 'permissions', p.id, { perm_key: p.perm_key });
      m.close(); await load(); drawList(); drawMatrix();
    });
    $('#newPermForm', m.el).onsubmit = async (e) => {
      e.preventDefault();
      if (!requirePermission('roles.manage')) return;
      const f = e.target;
      const action = f.perm_action.value.trim().toLowerCase();
      if (!/^[a-z_]{2,30}$/.test(action)) return showToast('action ใช้ได้เฉพาะ a-z และ _', 'warning');
      const row = { module_key: f.module_key.value, action, perm_key: `${f.module_key.value}.${action}`, name: f.perm_name.value.trim(), sort_order: 500 };
      const r = await db(s => s.from('permissions').insert(row).select().single(), { success: `เพิ่ม ${row.perm_key} เรียบร้อย`, error: 'เพิ่ม Permission ไม่สำเร็จ' });
      if (!r.ok) return;
      await logAudit('create', 'permissions', r.data.id, { perm_key: row.perm_key });
      f.reset(); m.close(); await load(); drawList(); drawMatrix();
    };
  };
  const openRoleForm = (role) => {
    const editing = !!role;
    const sys = role?.is_system;
    const colors = ['#5AA9E6', '#EC7FA5', '#F0C552', '#5CC49A', '#A694E8', '#F0A04B', '#94A3B8'];
    const m = openModal({
      title: editing ? 'แก้ไข Role' : 'เพิ่ม Role', icon: 'shield', size: 'md',
      body: `<form id="roleForm" class="space-y-4">
        ${sys ? `<div class="rounded-2xl bg-slate-50 p-3 text-sm text-slate-500">${ic('lock', 'w-4 h-4 inline')} Role ระบบ: ห้ามเปลี่ยนชื่อและรหัส แก้ได้เฉพาะคำอธิบายและสี</div>` : ''}
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="label">รหัส Role (role_key)</label><input name="role_key" class="input font-mono" value="${esc(role?.role_key || '')}" ${editing ? 'disabled' : 'required'} placeholder="เช่น finance_head" pattern="[a-z_]{3,30}"></div>
          <div><label class="label">ชื่อ Role</label><input name="role_name" class="input" value="${esc(role?.name || '')}" ${sys ? 'disabled' : 'required'}></div>
        </div>
        <div><label class="label">คำอธิบาย</label><textarea name="description" class="input" rows="2">${esc(role?.description || '')}</textarea></div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="label">ระดับ (level 1–99)</label><input name="level" type="number" min="1" max="99" class="input" value="${role?.level ?? 10}" ${sys ? 'disabled' : ''}>
            <p class="text-xs text-slate-400 mt-1">ใช้เทียบลำดับชั้น Org Admin = 50</p></div>
          <div><label class="label">สี</label><div class="flex flex-wrap gap-2">${colors.map(c => `<label class="cursor-pointer"><input type="radio" name="color" value="${c}" class="peer hidden" ${(role?.color || colors[0]) === c ? 'checked' : ''}>
            <span class="block w-8 h-8 rounded-xl peer-checked:ring-4 ring-offset-2 ring-slate-200" style="background:${c}"></span></label>`).join('')}</div></div>
        </div></form>`,
      footer: `<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-primary" type="submit" form="roleForm">${ic('save')} บันทึก</button>`,
    });
    $('#roleForm', m.el).onsubmit = async (e) => {
      e.preventDefault();
      if (!requirePermission('roles.manage')) return;
      const f = e.target;
      const payload = { description: f.description.value.trim() || null, color: f.color.value };
      if (!sys) {
        payload.name = f.role_name.value.trim();
        payload.level = Math.min(99, Math.max(1, parseInt(f.level.value, 10) || 10));
        if (!payload.name) return showToast('กรุณากรอกชื่อ Role', 'warning');
      }
      let r;
      if (!editing) {
        const key = f.role_key.value.trim().toLowerCase();
        if (!/^[a-z_]{3,30}$/.test(key)) return showToast('role_key ใช้ได้เฉพาะ a-z และ _ (3–30 ตัว)', 'warning');
        r = await db(s => s.from('roles').insert({ ...payload, role_key: key }).select().single(), { success: 'เพิ่ม Role เรียบร้อย', error: 'เพิ่ม Role ไม่สำเร็จ' });
        if (r.ok) { selectedId = r.data.id; await logAudit('create', 'roles', r.data.id, { role_key: key }); }
      } else {
        r = await db(s => s.from('roles').update(payload).eq('id', role.id), { success: 'บันทึก Role เรียบร้อย', error: 'บันทึก Role ไม่สำเร็จ' });
        if (r.ok) await logAudit('update', 'roles', role.id, { role_key: role.role_key });
      }
      if (!r.ok) return;
      m.close(); await load(); drawList(); drawMatrix();
    };
  };

  if (!(await load())) return;
  drawList(); drawMatrix();

  el.onchange = (e) => { if (e.target.matches('[data-perm]')) updateCount(); };
  el.onclick = async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'select' && !e.target.closest('[data-act="edit-role"],[data-act="del-role"]')) { selectedId = b.dataset.id; drawList(); drawMatrix(); return; }
    if (act === 'edit-role') { e.stopPropagation(); openRoleForm(data.roles.find(r => r.id === b.dataset.id)); return; }
    if (act === 'add-role') { openRoleForm(null); return; }
    if (act === 'catalog') { drawCatalog(); return; }
    if (act === 'toggle-group') {
      const boxes = $$(`[data-perm][data-group="${CSS.escape(b.dataset.group)}"]:not(:disabled)`, el);
      const allOn = boxes.every(x => x.checked);
      boxes.forEach(x => { x.checked = !allOn; });
      updateCount(); return;
    }
    if (act === 'del-role') {
      e.stopPropagation();
      if (!requirePermission('roles.manage')) return;
      const role = data.roles.find(r => r.id === b.dataset.id);
      if (data.users.some(u => u.role_id === role.id)) return showToast('ไม่สามารถลบได้ เนื่องจากยังมีผู้ใช้งานใน Role นี้', 'warning');
      const ok = await confirmModal({ title: 'ลบ Role', message: `ต้องการลบ Role <b>${esc(role.name)}</b> ใช่หรือไม่?` });
      if (!ok) return;
      const r = await db(s => s.from('roles').delete().eq('id', role.id), { success: 'ลบ Role เรียบร้อย', error: 'ลบ Role ไม่สำเร็จ' });
      if (!r.ok) return;
      await logAudit('delete', 'roles', role.id, { role_key: role.role_key });
      selectedId = null; await load(); drawList(); drawMatrix();
      return;
    }
    if (act === 'save-perms') {
      if (!requirePermission('roles.manage')) return;
      const role = data.roles.find(r => r.id === selectedId);
      const checked = new Set($$('[data-perm]:checked:not(:disabled)', el).map(x => x.dataset.perm));
      const editable = $$('[data-perm]:not(:disabled)', el).map(x => x.dataset.perm);
      const added = editable.filter(id => checked.has(id) && !working.has(id));
      const removed = [...working].filter(id => editable.includes(id) && !checked.has(id));
      if (!added.length && !removed.length) return showToast('ไม่มีการเปลี่ยนแปลง', 'info');
      const me = currentUser();
      const r = await db(async (s) => {
        if (added.length) { const x = await s.from('role_permissions').insert(added.map(id => ({ role_id: role.id, permission_id: id, created_by: me.id }))); if (x.error) return x; }
        if (removed.length) { const y = await s.from('role_permissions').delete().eq('role_id', role.id).in('permission_id', removed); if (y.error) return y; }
        return { data: true };
      }, { loaderText: 'กำลังบันทึกสิทธิ์...', success: `บันทึกสิทธิ์ของ ${role.name} เรียบร้อย`, error: 'บันทึกสิทธิ์ไม่สำเร็จ' });
      if (!r.ok) return;
      const keyOf = (id) => data.perms.find(p => p.id === id)?.perm_key;
      await logAudit('update_permissions', 'role_permissions', role.id, { role_key: role.role_key, added: added.map(keyOf), removed: removed.map(keyOf) });
      await load(); drawList(); drawMatrix();
      if (role.role_key === 'guest' || role.id === currentRole()?.id) { await verifySession({ silent: true }); await reloadNavigation(); }
    }
  };
}

/* =====================================================================
   PAGE: จัดการหน่วยงาน (Super Admin)
   ===================================================================== */
async function renderOrganizations(el) {
  if (!requirePermission('organizations.manage')) return;
  el.innerHTML = pageHeader({ title: 'จัดการหน่วยงาน', subtitle: 'หน่วยงานที่ใช้ระบบ SFH', icon: 'building-2', tone: 'mint',
    actions: `<button class="btn btn-primary" data-act="add">${ic('plus')} เพิ่มหน่วยงาน</button>` }) + `<div id="orgTable">${skeletonCards(3, 'h-20')}</div>`;
  refreshIcons();
  let rows = [];
  const table = createDataTable($('#orgTable', el), {
    searchKeys: ['code', 'name', 'short_name', 'phone', 'email'], searchPlaceholder: 'ค้นหารหัส ชื่อหน่วยงาน โทรศัพท์...',
    filters: [{ key: 'is_active', label: 'ทุกสถานะ', options: [{ value: 'true', label: 'เปิดใช้งาน' }, { value: 'false', label: 'ปิดใช้งาน' }] }],
    columns: [
      { key: 'name', label: 'หน่วยงาน', render: o => `<div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-mint-100 text-mint-600 grid place-items-center shrink-0">${ic('building-2', 'w-5 h-5')}</span>
        <div class="min-w-0"><div class="font-medium text-slate-700">${esc(o.name)}</div><div class="text-xs text-slate-400 font-mono">${esc(o.code)}${o.short_name ? ' · ' + esc(o.short_name) : ''}</div></div></div>` },
      { key: 'phone', label: 'ติดต่อ', render: o => `<div class="text-xs text-slate-500">${esc(o.phone || '-')}<br>${esc(o.email || '')}</div>` },
      { key: 'user_count', label: 'ผู้ใช้', render: o => `<span class="badge bg-brand-50 text-brand-600">${o.user_count} คน</span>` },
      { key: 'is_active', label: 'สถานะ', render: o => activeBadge(o.is_active) },
    ],
    actions: o => `<button class="btn-icon" data-act="edit" data-id="${o.id}" title="แก้ไข">${ic('pencil')}</button>
      <button class="btn-icon hover:!text-blush-500 hover:!bg-blush-50" data-act="delete" data-id="${o.id}" title="ลบ">${ic('trash-2')}</button>`,
  });
  const refresh = async () => {
    const r = await dbMany([s => s.from('organizations').select('*').order('code'), s => s.from('users').select('org_id')], { error: 'โหลดหน่วยงานไม่สำเร็จ' });
    if (!r.ok) return;
    const [orgs, users] = r.data;
    rows = orgs.map(o => ({ ...o, user_count: users.filter(u => u.org_id === o.id).length }));
    table.setRows(rows);
  };
  await refresh();
  const openForm = (o) => {
    const m = openModal({
      title: o ? 'แก้ไขหน่วยงาน' : 'เพิ่มหน่วยงาน', icon: 'building-2', size: 'lg',
      body: `<form id="orgForm" class="grid sm:grid-cols-2 gap-4">
        <div><label class="label">รหัสหน่วยงาน *</label><input name="code" class="input font-mono" value="${esc(o?.code || '')}" required placeholder="เช่น SSN-FIN"></div>
        <div><label class="label">ชื่อย่อ</label><input name="short_name" class="input" value="${esc(o?.short_name || '')}"></div>
        <div class="sm:col-span-2"><label class="label">ชื่อหน่วยงาน *</label><input name="org_name" class="input" value="${esc(o?.name || '')}" required></div>
        <div><label class="label">โทรศัพท์</label><input name="phone" class="input" value="${esc(o?.phone || '')}"></div>
        <div><label class="label">อีเมล</label><input name="email" type="email" class="input" value="${esc(o?.email || '')}"></div>
        <div class="sm:col-span-2"><label class="label">ที่อยู่</label><input name="address" class="input" value="${esc(o?.address || '')}"></div>
        <div class="sm:col-span-2"><label class="label">รายละเอียด</label><textarea name="description" class="input" rows="2">${esc(o?.description || '')}</textarea></div>
        <div class="flex items-center gap-3"><label class="switch"><input type="checkbox" name="is_active" ${o?.is_active !== false ? 'checked' : ''}><span class="slider"></span></label><span class="text-sm text-slate-600">เปิดใช้งาน</span></div>
      </form>`,
      footer: `<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-primary" type="submit" form="orgForm">${ic('save')} บันทึก</button>`,
    });
    const form = $('#orgForm', m.el);
    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!requirePermission('organizations.manage')) return;
      const payload = {
        code: form.code.value.trim().toUpperCase(), name: form.org_name.value.trim(), short_name: form.short_name.value.trim() || null,
        phone: form.phone.value.trim() || null, email: form.email.value.trim() || null, address: form.address.value.trim() || null,
        description: form.description.value.trim() || null, is_active: form.is_active.checked,
      };
      if (!payload.code || !payload.name) return showToast('กรุณากรอกรหัสและชื่อหน่วยงาน', 'warning');
      const r = o
        ? await db(s => s.from('organizations').update(payload).eq('id', o.id), { loaderText: 'กำลังบันทึก...', success: 'บันทึกหน่วยงานเรียบร้อย', error: 'บันทึกไม่สำเร็จ' })
        : await db(s => s.from('organizations').insert({ ...payload, created_by: currentUser().id }).select().single(), { loaderText: 'กำลังบันทึก...', success: 'เพิ่มหน่วยงานเรียบร้อย', error: 'เพิ่มไม่สำเร็จ' });
      if (!r.ok) return;
      await logAudit(o ? 'update' : 'create', 'organizations', o?.id || r.data?.id, { code: payload.code, name: payload.name });
      form.reset(); m.close(); refresh();
    };
  };
  el.onclick = async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const o = rows.find(x => x.id === b.dataset.id);
    if (b.dataset.act === 'add') openForm(null);
    if (b.dataset.act === 'edit') openForm(o);
    if (b.dataset.act === 'delete') {
      if (!requirePermission('organizations.manage')) return;
      if (o.user_count > 0) return showToast(`ไม่สามารถลบได้ เนื่องจากมีผู้ใช้งาน ${o.user_count} คนในหน่วยงานนี้ (แนะนำให้ปิดใช้งานแทน)`, 'warning', 5000);
      const ok = await confirmModal({ title: 'ลบหน่วยงาน', message: `ต้องการลบ <b>${esc(o.name)}</b> ใช่หรือไม่?` });
      if (!ok) return;
      const r = await db(s => s.from('organizations').delete().eq('id', o.id), { loaderText: 'กำลังลบ...', success: 'ลบหน่วยงานเรียบร้อย', error: 'ลบไม่สำเร็จ' });
      if (r.ok) { await logAudit('delete', 'organizations', o.id, { code: o.code, name: o.name }); refresh(); }
    }
  };
}

            <input name="color" type="color" class="h-11 w-full rounded-2xl border border-slate-200 bg-white p-1" value="${esc(m.color)}"></div>
        </div></form>`,
      footer: `<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-primary" type="submit" form="modForm">${ic('save')} บันทึก</button>`,
    });
    const form = $('#modForm', modal.el);
    const updatePreview = () => { const p = $('#iconPreview', modal.el); p.style.background = hexToRgba(form.color.value, .16); p.style.color = form.color.value; p.innerHTML = ic(form.icon.value.trim() || 'box', 'w-5 h-5'); refreshIcons(); };
    form.icon.addEventListener('input', debounce(updatePreview, 250));
    form.color.addEventListener('input', updatePreview);
    modal.el.addEventListener('click', (e) => {
      const pi = e.target.closest('[data-pick-icon]'); if (pi) { form.icon.value = pi.dataset.pickIcon; updatePreview(); }
      const pc = e.target.closest('[data-pick-color]'); if (pc) { form.color.value = pc.dataset.pickColor; updatePreview(); }
    });
    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!requirePermission('modules.manage')) return;
      const payload = {
        name: form.mod_name.value.trim(), description: form.description.value.trim() || null, icon: form.icon.value.trim() || 'box',
        color: form.color.value, version: form.version.value.trim() || '0.1.0', sort_order: parseInt(form.sort_order.value, 10) || 100,
        planned_features: form.features.value.split('\n').map(x => x.trim()).filter(Boolean),
      };
      if (!payload.name) return showToast('กรุณากรอกชื่อโมดูล', 'warning');
      const r = await db(s => s.from('modules').update(payload).eq('id', m.id), { loaderText: 'กำลังบันทึก...', success: 'บันทึกโมดูลเรียบร้อย', error: 'บันทึกไม่สำเร็จ' });
      if (!r.ok) return;
      await logAudit('update', 'modules', m.module_key, { name: payload.name });
      modal.close(); afterChange();
    };
  };
  el.onclick = async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const m = mods.find(x => x.module_key === b.dataset.key);
    if (b.dataset.act === 'edit') openForm(m);
    if (b.dataset.act === 'status') {
      const status = b.dataset.status;
      if (!requirePermission('modules.manage') || m.status === status) return;
      if (status === 'disabled') {
        const ok = await confirmModal({ title: 'ปิดใช้งานโมดูล', message: `โมดูล <b>${esc(m.name)}</b> จะถูกซ่อนจากเมนูของทุกคน (รวมถึงบุคคลทั่วไป) ต้องการดำเนินการต่อหรือไม่?`, confirmText: 'ปิดใช้งาน', confirmIcon: 'ban' });
        if (!ok) return;
      }
      const r = await db(s => s.from('modules').update({ status }).eq('id', m.id), { loaderText: 'กำลังเปลี่ยนสถานะ...', success: `เปลี่ยนสถานะเป็น ${status} เรียบร้อย`, error: 'เปลี่ยนสถานะไม่สำเร็จ' });
      if (!r.ok) return;
      await logAudit('update_status', 'modules', m.module_key, { from: m.status, to: status });
      afterChange();
    }
  };
  el.onchange = async (e) => {
    const t = e.target.closest('[data-act-guest]');
    if (!t) return;
    const m = mods.find(x => x.module_key === t.dataset.actGuest);
    if (!requirePermission('modules.manage') || m.guest_locked) { t.checked = m.allow_guest; return; }
    const r = await db(s => s.from('modules').update({ allow_guest: t.checked }).eq('id', m.id), { loaderText: 'กำลังบันทึก...', success: t.checked ? 'อนุญาตให้บุคคลทั่วไปแล้ว (เปิดเมนูได้ที่หน้า "เมนูสาธารณะ")' : 'ปิดการเข้าถึงของบุคคลทั่วไปแล้ว', error: 'บันทึกไม่สำเร็จ' });
    if (!r.ok) { t.checked = m.allow_guest; return; }
    await logAudit('update', 'modules', m.module_key, { allow_guest: t.checked });
    afterChange();
  };
}

/* =====================================================================
   PAGE: ตั้งค่าเมนูสาธารณะ (Super Admin)
   ===================================================================== */
async function renderPublicMenu(el) {
  if (!requirePermission('public_menu.manage')) return;
  el.innerHTML = pageHeader({ title: 'ตั้งค่าเมนูสาธารณะ', subtitle: 'เปิด/ปิดเมนูที่บุคคลทั่วไป (Guest) มองเห็น เรียงลำดับ และแก้ชื่อ/ไอคอน', icon: 'globe', tone: 'blush',
    actions: `<button class="btn btn-ghost" data-pm="reset">${ic('rotate-ccw')} คืนค่า</button><button class="btn btn-pink" data-pm="save">${ic('save')} บันทึกการตั้งค่า</button>` }) +
    `<div class="grid lg:grid-cols-5 gap-5"><div class="lg:col-span-3 space-y-3" id="pmList">${skeletonCards(4, 'h-24')}</div>
     <div class="lg:col-span-2"><div class="lg:sticky lg:top-24 space-y-4" id="pmPreview"></div></div></div>`;
  refreshIcons();
  let menus = [], mods = [], guestRole = null, perms = [], guestPermIds = new Set(), items = [];
  const load = async () => {
    const r = await dbMany([
      s => s.from('menus').select('*').order('sort_order'),
      s => s.from('modules').select('*'),
      s => s.from('roles').select('*').eq('role_key', 'guest').maybeSingle(),
      s => s.from('permissions').select('id, perm_key, module_key, action'),
    ], { error: 'โหลดเมนูไม่สำเร็จ' });
    if (!r.ok) return false;
    [menus, mods, guestRole, perms] = r.data;
    if (!guestRole) { showToast('ไม่พบ Role guest กรุณารัน database.sql', 'error'); return false; }
    const g = await db(s => s.from('role_permissions').select('permission_id').eq('role_id', guestRole.id), { loader: false, error: 'โหลดสิทธิ์ Guest ไม่สำเร็จ' });
    if (!g.ok) return false;
    guestPermIds = new Set(g.data.map(x => x.permission_id));
    const permIdByKey = Object.fromEntries(perms.map(p => [p.perm_key, p.id]));
    items = menus.filter(m => m.menu_group !== 'admin' && (m.menu_key === 'home' || m.public_permission || m.module_key)).map(m => {
      const mod = mods.find(x => x.module_key === m.module_key) || null;
      let lock = '';
      if (m.menu_key === 'home') lock = 'on';
      else if (mod && (mod.guest_locked || !mod.allow_guest)) lock = 'off';
      else if (!m.public_permission || !permIdByKey[m.public_permission]) lock = 'off';
      const permId = permIdByKey[m.public_permission] || null;
      return {
        id: m.id, menu_key: m.menu_key, label: m.label, icon: m.icon, sort_order: m.sort_order, is_active: m.is_active,
        module: mod, permId, lock,
        lockReason: m.menu_key === 'home' ? 'หน้าแรกเปิดตลอด ปิดไม่ได้' : mod?.guest_locked ? 'โมดูลนี้ห้ามเปิดให้บุคคลทั่วไป' : (mod && !mod.allow_guest) ? 'โมดูลยังไม่อนุญาต Guest (ตั้งค่าที่หน้าจัดการโมดูล)' : 'เมนูนี้ไม่มีสิทธิ์สาธารณะ',
        guestOn: m.menu_key === 'home' ? true : (lock === 'off' ? false : guestPermIds.has(permId)),
      };
    }).sort((a, b) => a.sort_order - b.sort_order);
    items.forEach(i => { i._orig = { label: i.label, icon: i.icon, guestOn: i.guestOn, idx: 0 }; });
    items.forEach((i, idx) => { i._orig.idx = idx; });
    return true;
  };
  const visibleForGuest = () => items.filter(i => i.guestOn && i.is_active && (!i.module || i.module.status !== 'disabled'));
  const drawPreview = () => {
    const vis = visibleForGuest();
    const bn = vis.length <= 4 ? vis : [...vis.slice(0, 3), { label: 'เพิ่มเติม', icon: 'more-horizontal' }];
    $('#pmPreview', el).innerHTML = `
      <div class="card p-4">
        <div class="text-sm font-medium text-slate-600 mb-3 flex items-center gap-2">${ic('monitor', 'w-4 h-4 text-brand-400')} ตัวอย่าง Sidebar ของ Guest (Desktop)</div>
        ${vis.length <= 1 ? `<div class="rounded-2xl bg-slate-50 p-4 text-sm text-slate-500 text-center">${ic('eye-off', 'w-5 h-5 mx-auto mb-1 text-slate-400')}ปิดเมนูทั้งหมด → แสดงเฉพาะหน้าแรกโดยไม่มี Sidebar</div>` : `
        <div class="rounded-3xl border border-blush-200 p-3 max-w-[15rem] mx-auto" style="background:linear-gradient(180deg,#FFF6F9,#FFFCF3)">
          <div class="flex items-center gap-2 px-1 mb-2">${brandLogo('w-8 h-8')}<div class="min-w-0"><div class="text-xs font-semibold text-slate-700 truncate">${esc(State.settings.site_name || 'Smart Finance Hub')}</div><div class="text-[10px] text-slate-400 truncate">${esc(State.settings.org_name || '')}</div></div></div>
          <span class="badge bg-blush-100 text-blush-500 border border-blush-200 !text-[10px] mb-2">${ic('globe', 'w-3 h-3')} สาธารณะ</span>
          <div class="space-y-1">${vis.map((i, n) => `<div class="flex items-center gap-2 rounded-xl px-2 py-1.5 text-xs ${n === 0 ? 'bg-gradient-to-r from-blush-100 to-cream-100 text-blush-600' : 'text-slate-600'}">
            <span class="w-6 h-6 rounded-lg bg-white grid place-items-center shadow-sm">${ic(i.icon || 'circle', 'w-3.5 h-3.5')}</span><span class="flex-1 truncate">${esc(i.label)}</span>
            ${i.module?.status === 'coming_soon' ? '<span class="soon-badge !text-[9px]">เร็ว ๆ นี้</span>' : ''}</div>`).join('')}</div>
          <div class="mt-3 rounded-xl bg-gradient-to-r from-blush-300 to-blush-400 text-white text-[11px] text-center py-1.5">เข้าสู่ระบบเจ้าหน้าที่</div>
        </div>`}
      </div>
      <div class="card p-4">
        <div class="text-sm font-medium text-slate-600 mb-3 flex items-center gap-2">${ic('smartphone', 'w-4 h-4 text-brand-400')} ตัวอย่าง Bottom Nav (มือถือ)</div>
        ${vis.length <= 1 ? '<p class="text-xs text-slate-400 text-center">ไม่แสดง Bottom Nav</p>' : `<div class="rounded-2xl bg-white border border-slate-100 shadow-sm flex justify-around px-1 py-2 max-w-xs mx-auto">
          ${[...bn, { label: 'เข้าสู่ระบบ', icon: 'log-in', login: true }].map((i, n) => `<div class="flex flex-col items-center gap-0.5 text-[9px] w-12 ${i.login ? 'text-blush-500' : n === 0 ? 'text-blush-500' : 'text-slate-400'}">
            <span class="w-7 h-6 rounded-lg grid place-items-center ${i.login ? 'bg-blush-100' : ''}">${ic(i.icon || 'circle', 'w-4 h-4')}</span><span class="truncate max-w-full">${esc(i.label)}</span></div>`).join('')}
        </div>${vis.length > 4 ? '<p class="text-[11px] text-slate-400 text-center mt-2">เมนูเกิน 4 → ปุ่มสุดท้ายเป็น "เพิ่มเติม"</p>' : ''}`}
      </div>`;
    refreshIcons();
  };
  const drawList = () => {
    $('#pmList', el).innerHTML = items.map((i, idx) => `<div class="card p-4 ${i.lock === 'off' ? 'bg-slate-50/80' : ''}" data-idx="${idx}">
      <div class="flex items-start gap-3">
        <div class="flex flex-col gap-1">
          <button type="button" class="btn-icon !w-8 !h-8 border border-slate-100" data-pm="up" data-idx="${idx}" ${idx === 0 ? 'disabled style="opacity:.3"' : ''} title="เลื่อนขึ้น">${ic('chevron-up')}</button>
          <button type="button" class="btn-icon !w-8 !h-8 border border-slate-100" data-pm="down" data-idx="${idx}" ${idx === items.length - 1 ? 'disabled style="opacity:.3"' : ''} title="เลื่อนลง">${ic('chevron-down')}</button>
        </div>
        <span class="w-11 h-11 rounded-2xl grid place-items-center shrink-0 bg-blush-50 text-blush-500" data-icon-preview="${idx}">${ic(i.icon || 'circle', 'w-5 h-5')}</span>
        <div class="flex-1 min-w-0 grid sm:grid-cols-2 gap-2">
          <div><label class="text-[11px] text-slate-400">ชื่อที่แสดง</label><input class="input !py-2" data-field="label" data-idx="${idx}" value="${esc(i.label)}"></div>
          <div><label class="text-[11px] text-slate-400">ไอคอน (Lucide)</label><input class="input !py-2 font-mono" data-field="icon" data-idx="${idx}" value="${esc(i.icon)}" list="pmIcons"></div>
          <div class="sm:col-span-2 flex flex-wrap items-center gap-2 text-xs text-slate-400">
            <code>${esc(i.menu_key)}</code>${i.module ? statusBadge(i.module.status) : ''}${!i.is_active ? '<span class="badge bg-slate-100 text-slate-500">เมนูถูกปิด</span>' : ''}
            ${i.lock ? `<span class="inline-flex items-center gap-1">${ic('lock', 'w-3 h-3')} ${esc(i.lockReason)}</span>` : ''}</div>
        </div>
        <div class="flex flex-col items-center gap-1 pt-1">
          <label class="switch"><input type="checkbox" data-pm-toggle="${idx}" ${i.guestOn ? 'checked' : ''} ${i.lock ? 'disabled' : ''}><span class="slider"></span></label>
          <span class="text-[10px] ${i.guestOn ? 'text-blush-500' : 'text-slate-400'}">${i.guestOn ? 'Guest เห็น' : 'ซ่อน'}</span>
        </div>
      </div></div>`).join('') + `<datalist id="pmIcons">${ICON_CHOICES.concat(['home', 'newspaper', 'info', 'phone']).map(x => `<option value="${x}">`).join('')}</datalist>`;
    refreshIcons();
  };
  const redraw = () => { drawList(); drawPreview(); };
  if (!(await load())) return;
  redraw();

  el.oninput = debounce((e) => {
    const t = e.target.closest('[data-field]');
    if (!t) return;
    const i = items[+t.dataset.idx];
    i[t.dataset.field] = t.value.trim();
    if (t.dataset.field === 'icon') { const p = $(`[data-icon-preview="${t.dataset.idx}"]`, el); p.innerHTML = ic(i.icon || 'circle', 'w-5 h-5'); refreshIcons(); }
    drawPreview();
  }, 200);
  el.onchange = (e) => {
    const t = e.target.closest('[data-pm-toggle]');
    if (!t) return;
    items[+t.dataset.pmToggle].guestOn = t.checked;
    t.closest('.flex-col').querySelector('span.text-\\[10px\\]').textContent = t.checked ? 'Guest เห็น' : 'ซ่อน';
    drawPreview();
  };
  el.onclick = async (e) => {
    const b = e.target.closest('[data-pm]');
    if (!b || b.disabled) return;
    const act = b.dataset.pm;
    if (act === 'up' || act === 'down') {
      const idx = +b.dataset.idx, to = act === 'up' ? idx - 1 : idx + 1;
      if (to < 0 || to >= items.length) return;
      [items[idx], items[to]] = [items[to], items[idx]];
      redraw(); return;
    }
    if (act === 'reset') { if (await load()) { redraw(); showToast('คืนค่าตามข้อมูลล่าสุดแล้ว', 'info'); } return; }
    if (act === 'save') {
      if (!requirePermission('public_menu.manage')) return;
      if (items.some(i => !i.label)) return showToast('กรุณากรอกชื่อเมนูให้ครบ', 'warning');
      const slots = items.map(i => i.sort_order).sort((a, b) => a - b);
      const menuUpdates = items.map((i, n) => ({ i, sort_order: slots[n] }))
        .filter(({ i, sort_order }) => i.label !== i._orig.label || i.icon !== i._orig.icon || sort_order !== i.sort_order);
      const toAdd = items.filter(i => !i.lock && i.permId && i.guestOn && !guestPermIds.has(i.permId)).map(i => i.permId);
      const toRemove = items.filter(i => !i.lock && i.permId && !i.guestOn && guestPermIds.has(i.permId)).map(i => i.permId);
      if (!menuUpdates.length && !toAdd.length && !toRemove.length) return showToast('ไม่มีการเปลี่ยนแปลง', 'info');
      const r = await db(async (s) => {
        for (const { i, sort_order } of menuUpdates) {
          const x = await s.from('menus').update({ label: i.label, icon: i.icon || 'circle', sort_order }).eq('id', i.id);
          if (x.error) return x;
        }
        if (toAdd.length) { const x = await s.from('role_permissions').insert(toAdd.map(id => ({ role_id: guestRole.id, permission_id: id, created_by: currentUser().id }))); if (x.error) return x; }
        if (toRemove.length) { const x = await s.from('role_permissions').delete().eq('role_id', guestRole.id).in('permission_id', toRemove); if (x.error) return x; }
        return { data: true };
      }, { loaderText: 'กำลังบันทึกเมนูสาธารณะ...', success: 'บันทึกการตั้งค่าเมนูสาธารณะเรียบร้อย', error: 'บันทึกไม่สำเร็จ' });
      if (!r.ok) return;
      const keyOf = (id) => perms.find(p => p.id === id)?.perm_key;
      await logAudit('update_public_menu', 'menus', null, {
        updated_menus: menuUpdates.map(({ i }) => i.menu_key), guest_enabled: toAdd.map(keyOf), guest_disabled: toRemove.map(keyOf),
        order: items.map(i => i.menu_key),
      });
      await load(); redraw(); await reloadNavigation();
    }
  };
}

const PLATFORM_SETTINGS = [
  ['site_name', 'ชื่อระบบ'], ['site_short', 'ชื่อย่อระบบ'], ['site_subtitle', 'คำอธิบายระบบ (ใต้ชื่อ)'], ['org_name', 'ชื่อหน่วยงาน'],
  ['hero_title', 'หัวข้อหน้าแรก'], ['hero_text', 'ข้อความหน้าแรก', 'textarea'], ['contact_phone', 'เบอร์โทรติดต่อ'], ['contact_email', 'อีเมลติดต่อ'], ['footer_text', 'ข้อความท้ายเว็บ'],
];
const ORG_SETTINGS = [['signer_name', 'ชื่อผู้ลงนามในเอกสาร'], ['signer_position', 'ตำแหน่งผู้ลงนาม'], ['doc_footer', 'ข้อความท้ายเอกสาร/รายงาน', 'textarea']];

async function upsertSettings(orgId, values, rows, isPublic) {
  const me = currentUser();
  return db(async (s) => {
    for (const [key, value] of Object.entries(values)) {
      const ex = rows.find(r => r.setting_key === key && (r.org_id || null) === (orgId || null));
      const x = ex
        ? await s.from('system_settings').update({ setting_value: value }).eq('id', ex.id)
        : await s.from('system_settings').insert({ org_id: orgId || null, setting_key: key, setting_value: value, is_public: isPublic, created_by: me.id });
      if (x.error) return x;
    }
    return { data: true };
  }, { loaderText: 'กำลังบันทึกการตั้งค่า...', success: 'บันทึกการตั้งค่าเรียบร้อย', error: 'บันทึกการตั้งค่าไม่สำเร็จ' });
}
async function renderSettings(el) {
  if (!hasAnyPermission('settings.manage', 'settings.org')) return requirePermission('settings.org');
  const me = currentUser();
  const platform = hasPermission('settings.manage');
  el.innerHTML = pageHeader({ title: 'ตั้งค่าระบบ', subtitle: platform ? 'ตั้งค่าระดับ Platform และระดับหน่วยงาน' : 'ตั้งค่าบางส่วนของหน่วยงานของคุณ', icon: 'settings', tone: 'cream' }) +
    `<div class="grid lg:grid-cols-2 gap-5 items-start"><div id="setPlatform"></div><div id="setOrg"></div></div>`;
  refreshIcons();
  const r = await dbMany([
    s => s.from('system_settings').select('*'),
    s => isSuperAdmin() ? s.from('organizations').select('*').order('code') : s.from('organizations').select('*').eq('id', me.org_id),
  ], { error: 'โหลดการตั้งค่าไม่สำเร็จ' });
  if (!r.ok) return;
  let [rows, orgs] = r.data;
  const val = (key, orgId = null) => rows.find(x => x.setting_key === key && (x.org_id || null) === orgId)?.setting_value ?? '';

  if (platform) {
    $('#setPlatform', el).innerHTML = `<form id="platformForm" class="card p-5 md:p-6 space-y-4">
      <h3 class="section-title">${ic('globe-2', 'w-5 h-5 text-brand-400')} ตั้งค่าระดับ Platform</h3>
      <p class="text-xs text-slate-400 -mt-2">แสดงผลที่หน้าแรกและทุกหน้าของระบบ (อ่านผ่าน View v_public_settings)</p>
      ${imagePickerHtml('logo', val('logo_url'), { label: 'โลโก้หน่วยงาน', hint: 'บีบอัดเป็น WebP ไม่เกิน 512px' })}
      ${PLATFORM_SETTINGS.map(([k, label, type]) => `<div><label class="label">${label}</label>${type === 'textarea'
        ? `<textarea name="${k}" class="input" rows="3">${esc(val(k))}</textarea>` : `<input name="${k}" class="input" value="${esc(val(k))}">`}</div>`).join('')}
      <div class="flex justify-end"><button class="btn btn-primary" type="submit">${ic('save')} บันทึกตั้งค่า Platform</button></div>
    </form>`;
    const logoPicker = bindImagePicker(el, 'logo', { maxSide: 512, quality: 0.8 });
    $('#platformForm', el).onsubmit = async (e) => {
      e.preventDefault();
      if (!requirePermission('settings.manage')) return;
      const f = e.target;
      const values = Object.fromEntries(PLATFORM_SETTINGS.map(([k]) => [k, f[k].value.trim()]));
      const img = await resolveImageChange(logoPicker, val('logo_path') || storagePathFromUrl(val('logo_url')), 'logos');
      if (!img.ok) return;
      if (img.changed) { values.logo_url = img.url || ''; values.logo_path = img.path || ''; }
      const pub = { ...values }; delete pub.logo_path;
      const s1 = await upsertSettings(null, pub, rows, true);
      if (!s1.ok) { if (img.path) deleteFile(img.path); return; }
      if ('logo_path' in values) await upsertSettings(null, { logo_path: values.logo_path }, rows, false);
      if (img.oldToDelete) deleteFile(img.oldToDelete);
      await logAudit('update_settings', 'system_settings', null, { scope: 'platform', keys: Object.keys(values) });
      await loadSettings(); renderChrome(); renderSettings(el);
    };
  } else {
    $('#setPlatform', el).innerHTML = `<div class="card p-5 md:p-6"><h3 class="section-title mb-2">${ic('lock', 'w-5 h-5 text-slate-400')} ตั้งค่าระดับ Platform</h3>
      <p class="text-sm text-slate-500">ส่วนนี้สงวนไว้สำหรับ Super Admin (Org Admin ไม่สามารถแก้การตั้งค่าระดับ Platform และเมนูสาธารณะได้)</p></div>`;
  }

  const drawOrg = (orgId) => {
    const o = orgs.find(x => x.id === orgId);
    if (!o) { $('#setOrg', el).innerHTML = `<div class="card p-6">${emptyState('ไม่พบข้อมูลหน่วยงาน', 'building-2')}</div>`; return; }
    $('#setOrg', el).innerHTML = `<form id="orgSetForm" class="card p-5 md:p-6 space-y-4">
      <h3 class="section-title">${ic('building-2', 'w-5 h-5 text-mint-500')} ตั้งค่าหน่วยงาน</h3>
      ${isSuperAdmin() && orgs.length > 1 ? `<div><label class="label">เลือกหน่วยงาน</label><select id="orgPicker" class="input">${orgs.map(x => `<option value="${x.id}" ${x.id === orgId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>`
        : `<div class="rounded-2xl bg-mint-50 p-3 text-sm text-slate-600">${esc(o.name)} <span class="text-xs text-slate-400 font-mono">(${esc(o.code)})</span></div>`}
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="label">โทรศัพท์</label><input name="phone" class="input" value="${esc(o.phone || '')}"></div>
        <div><label class="label">อีเมล</label><input name="email" type="email" class="input" value="${esc(o.email || '')}"></div>
        <div class="sm:col-span-2"><label class="label">ที่อยู่</label><input name="address" class="input" value="${esc(o.address || '')}"></div>
        <div class="sm:col-span-2"><label class="label">รายละเอียดหน่วยงาน</label><textarea name="description" class="input" rows="2">${esc(o.description || '')}</textarea></div>
      </div>
      <div class="border-t border-slate-100 pt-4 space-y-4"><div class="text-sm font-medium text-slate-600">ค่าที่ใช้ในเอกสาร/รายงาน (สำหรับโมดูลในอนาคต)</div>
        ${ORG_SETTINGS.map(([k, label, type]) => `<div><label class="label">${label}</label>${type === 'textarea'
          ? `<textarea name="${k}" class="input" rows="2">${esc(val(k, orgId))}</textarea>` : `<input name="${k}" class="input" value="${esc(val(k, orgId))}">`}</div>`).join('')}</div>
      <div class="flex justify-end"><button class="btn btn-mint" type="submit">${ic('save')} บันทึกตั้งค่าหน่วยงาน</button></div>
    </form>`;
    refreshIcons();
    const picker = $('#orgPicker', el);
    if (picker) picker.onchange = () => drawOrg(picker.value);
    $('#orgSetForm', el).onsubmit = async (e) => {
      e.preventDefault();
      if (!requirePermission('settings.org')) return;
      if (!isSuperAdmin() && orgId !== me.org_id) return showToast('แก้ไขได้เฉพาะหน่วยงานของตนเอง', 'error');
      const f = e.target;
      const orgPayload = { phone: f.phone.value.trim() || null, email: f.email.value.trim() || null, address: f.address.value.trim() || null, description: f.description.value.trim() || null };
      const r1 = await db(s => s.from('organizations').update(orgPayload).eq('id', orgId), { loaderText: 'กำลังบันทึก...', error: 'บันทึกข้อมูลหน่วยงานไม่สำเร็จ' });
      if (!r1.ok) return;
      const values = Object.fromEntries(ORG_SETTINGS.map(([k]) => [k, f[k].value.trim()]));
      const r2 = await upsertSettings(orgId, values, rows, false);
      if (!r2.ok) return;
      await logAudit('update_settings', 'system_settings', orgId, { scope: 'organization', keys: [...Object.keys(orgPayload), ...Object.keys(values)] });
      const again = await db(s => s.from('system_settings').select('*'), { loader: false, silent: true });
      if (again.ok) rows = again.data;
      Object.assign(o, orgPayload);
    };
  };
  drawOrg(me.org_id || orgs[0]?.id);

async function renderAudit(el) {
  if (!requirePermission('audit.view')) return;
  const me = currentUser();
  el.innerHTML = pageHeader({ title: 'Audit Log', subtitle: isSuperAdmin() ? 'บันทึกการใช้งานทั้งระบบ (1,000 รายการล่าสุด)' : 'บันทึกการใช้งานของหน่วยงาน (1,000 รายการล่าสุด)', icon: 'history', tone: 'lilac',
    actions: `<button class="btn btn-ghost" data-act="reload">${ic('refresh-cw')} รีเฟรช</button>${hasPermission('audit.export') ? `<button class="btn btn-primary" data-act="export">${ic('download')} ส่งออก CSV</button>` : ''}` }) +
    `<div id="auditTable">${skeletonCards(3, 'h-16')}</div>`;
  refreshIcons();
  let rows = [];
  const fetchRows = async () => {
    let q = sb.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(1000);
    if (!isSuperAdmin()) q = q.eq('org_id', me.org_id);
    const r = await db(() => q, { error: 'โหลด Audit Log ไม่สำเร็จ' });
    return r.ok ? r.data : null;
  };
  rows = await fetchRows();
  if (!rows) { $('#auditTable', el).innerHTML = errorState('โหลดข้อมูลไม่สำเร็จ'); return; }
  const uniq = (k) => [...new Set(rows.map(r => r[k]).filter(Boolean))].sort();
  const period = (r, v) => { const days = +v; const t = new Date(); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - (days - 1)); return new Date(r.created_at) >= t; };
  const detailText = (d) => { const x = { ...(d || {}) }; delete x.seed; const s = Object.entries(x).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · '); return s || '-'; };
  const table = createDataTable($('#auditTable', el), {
    pageSize: 15,
    searchKeys: ['username', 'action', 'table_name', 'record_id'], searchPlaceholder: 'ค้นหาผู้ใช้, การกระทำ, ตาราง, record id...',
    filters: [
      { key: 'action', label: 'ทุกการกระทำ', options: uniq('action').map(a => ({ value: a, label: actionMeta(a).label })) },
      { key: 'table_name', label: 'ทุกตาราง', options: uniq('table_name').map(t => ({ value: t, label: TABLE_LABELS[t] || t })) },
      { key: 'period', label: 'ทุกช่วงเวลา', options: [{ value: '1', label: 'วันนี้' }, { value: '7', label: '7 วันล่าสุด' }, { value: '30', label: '30 วันล่าสุด' }], match: period },
    ],
    columns: [
      { key: 'created_at', label: 'เวลา', render: r => `<div class="text-slate-700 whitespace-nowrap">${formatThaiDate(r.created_at, { time: true })}</div><div class="text-xs text-slate-400">${timeAgo(r.created_at)}</div>` },
      { key: 'username', label: 'ผู้ใช้', render: r => `<span class="font-medium text-slate-700">${esc(r.username || '-')}</span>` },
      { key: 'action', label: 'การกระทำ', render: r => actionBadge(r.action) },
      { key: 'table_name', label: 'ตาราง', render: r => `<span class="text-slate-600">${esc(TABLE_LABELS[r.table_name] || r.table_name || '-')}</span>` },
      { key: 'record_id', label: 'Record ID', render: r => `<code class="text-[11px] text-slate-400" title="${esc(r.record_id || '')}">${esc(r.record_id ? String(r.record_id).slice(0, 13) + (String(r.record_id).length > 13 ? '…' : '') : '-')}</code>` },
      { key: 'details', label: 'รายละเอียด', render: r => `<span class="text-xs text-slate-500 line-clamp-2 max-w-xs inline-block">${esc(detailText(r.details))}</span>` },
    ],
    emptyText: 'ไม่พบบันทึกตามเงื่อนไข',
  });
  table.setRows(rows);
  el.onclick = async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'reload') { const x = await fetchRows(); if (x) { rows = x; table.setRows(rows); showToast('รีเฟรชข้อมูลแล้ว', 'info'); } }
    if (b.dataset.act === 'export') {
      if (!requirePermission('audit.export')) return;
      const list = table.getFiltered();
      downloadCSV(`audit_log_${toInputDate()}`, ['วันที่เวลา', 'ผู้ใช้', 'การกระทำ', 'ตาราง', 'Record ID', 'รายละเอียด'],
        list.map(r => [formatThaiDate(r.created_at, { time: true }), r.username, actionMeta(r.action).label, TABLE_LABELS[r.table_name] || r.table_name, r.record_id, detailText(r.details)]));
      logAudit('export', 'audit_logs', null, { count: list.length });
    }
  };
}

async function fetchAnnouncements() {
  // Guest (หรือผู้ไม่มีสิทธิ์ announcements.view) → อ่านจาก View สาธารณะเท่านั้น
  if (!isLoggedIn() || !hasPermission('announcements.view')) {
    return db(s => s.from('v_public_announcements').select('*').order('is_pinned', { ascending: false }).order('published_at', { ascending: false }),
      { loaderText: 'กำลังโหลดข่าวสาร...', error: 'โหลดข่าวสารไม่สำเร็จ' });
  }
  const u = currentUser();
  let q = sb.from('announcements').select('*, organizations(name, short_name)').order('is_pinned', { ascending: false }).order('published_at', { ascending: false });
  if (!isSuperAdmin()) q = u.org_id ? q.or(`is_public.eq.true,org_id.eq.${u.org_id}`) : q.eq('is_public', true);
  const r = await db(() => q, { loaderText: 'กำลังโหลดข่าวสาร...', error: 'โหลดข่าวสารไม่สำเร็จ' });
  if (r.ok) {

}

      </div>

    footer: `<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-pink" type="submit" form="annForm">${ic('save')} บันทึก</button>`,
  });
  const cover = bindImagePicker(m.el, 'cover', { maxSide: 1200, quality: 0.7 });
  const form = $('#annForm', m.el);
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!requirePermission('announcements.manage')) return;
    const title = form.title.value.trim(), content = form.content.value.trim();
    if (!title || !content) return showToast('กรุณากรอกหัวข้อและเนื้อหา', 'warning');
    const d = form.published_at.value ? new Date(form.published_at.value + 'T08:00:00') : new Date();
    const keepTime = a && toInputDate(a.published_at) === form.published_at.value;
    const payload = {
      title, content, category: form.category.value, is_public: form.is_public.checked, is_pinned: form.is_pinned.checked,
      published_at: keepTime ? a.published_at : (toInputDate(d) === toInputDate() ? new Date().toISOString() : d.toISOString()),
    };
    const img = await resolveImageChange(cover, a?.cover_path || storagePathFromUrl(a?.cover_url), 'announcements');
    if (!img.ok) return;
    if (img.changed) { payload.cover_url = img.url; payload.cover_path = img.path; }
    const r = a
      ? await db(s => s.from('announcements').update(payload).eq('id', a.id), { loaderText: 'กำลังบันทึก...', success: 'บันทึกข่าวสารเรียบร้อย', error: 'บันทึกไม่สำเร็จ' })
      : await db(s => s.from('announcements').insert({ ...payload, org_id: me.org_id, created_by: me.id }).select().single(), { loaderText: 'กำลังบันทึก...', success: 'เพิ่มข่าวสารเรียบร้อย', error: 'เพิ่มข่าวสารไม่สำเร็จ' });
    if (!r.ok) { if (img.path) deleteFile(img.path); return; }
    if (img.oldToDelete) deleteFile(img.oldToDelete);   // ลบไฟล์เก่าใน Storage เมื่อเปลี่ยน/ลบรูป
    await logAudit(a ? 'update' : 'create', 'announcements', a?.id || r.data?.id, { title, is_public: payload.is_public, cover_changed: !!img.changed });
    form.reset();
    m.close();
    onSaved && onSaved();
  };
}
async function deleteAnnouncement(a, onDone) {
  if (!requirePermission('announcements.manage')) return;
  if (!canEditAnnouncement(a)) return showToast('ลบได้เฉพาะข่าวที่ตนเองบันทึก', 'error');
  const ok = await confirmModal({ title: 'ลบข่าวสาร/ประกาศ', message: `ต้องการลบ <b>${esc(a.title)}</b> ใช่หรือไม่?<br><span class="text-xs text-slate-400">ภาพปกใน Storage จะถูกลบด้วย</span>`, confirmText: 'ลบข่าว' });
  if (!ok) return;
  const r = await db(s => s.from('announcements').delete().eq('id', a.id), { loaderText: 'กำลังลบ...', success: 'ลบข่าวสารเรียบร้อย', error: 'ลบไม่สำเร็จ' });
  if (!r.ok) return;
  deleteFile(a.cover_path || storagePathFromUrl(a.cover_url));
  await logAudit('delete', 'announcements', a.id, { title: a.title });
  onDone && onDone();
}

Object.assign(TABLE_LABELS, { saraban_documents: 'เอกสารสารบรรณ', saraban_files: 'ไฟล์แนบสารบรรณ', saraban_categories: 'ประเภทเอกสาร' });

};

/** ปีงบประมาณไทย (1 ต.ค. – 30 ก.ย.) → พ.ศ. */
function thaiFiscalYear(value) {
  const d = value ? new Date(value) : new Date();
  if (isNaN(d)) return null;
  return d.getFullYear() + (d.getMonth() >= 9 ? 1 : 0) + 543;
}
const sarabanFY = (d) => d.reg_year || thaiFiscalYear(d.doc_date || d.created_at);
function sarabanFileMeta(name = '', mime = '') {
  const ext = String(name).split('.').pop().toLowerCase();
  if (ext === 'pdf' || mime === 'application/pdf') return { icon: 'file-text', color: '#D95C8A', kind: 'pdf' };
  if (/^(doc|docx|odt|txt)$/.test(ext)) return { icon: 'file-type', color: '#3B8FD4', kind: 'doc' };
  if (/^(xls|xlsx|ods|csv)$/.test(ext)) return { icon: 'file-spreadsheet', color: '#3AA57C', kind: 'sheet' };
  if (/^(ppt|pptx)$/.test(ext)) return { icon: 'presentation', color: '#F0A04B', kind: 'slide' };
  if (/^(jpg|jpeg|png|webp|gif)$/.test(ext) || /^image\//.test(mime)) return { icon: 'image', color: '#8670D6', kind: 'image' };
  if (ext === 'zip') return { icon: 'file-archive', color: '#64748B', kind: 'zip' };
  return { icon: 'file', color: '#64748B', kind: 'other' };
}
const sarabanDownloadUrl = (f) => sb.storage.from(STORAGE_BUCKET).getPublicUrl(f.file_path, { download: f.file_name }).data.publicUrl;
/** เลขที่หนังสือบังคับกรอกสำหรับหนังสือราชการ คำสั่ง/ประกาศ บันทึก/หนังสือเวียน (ระเบียบ คู่มือ แบบฟอร์ม ไม่บังคับ) */
const sarabanNeedsDocNo = (c) => !!c && !['regulation', 'manual'].includes(c.group_key);
const sarabanCanInternal = () => isLoggedIn() && hasPermission('saraban.view');
const sarabanCan = (d, action) => isLoggedIn() && hasPermission('saraban.' + action) && canEditRecord(d, 'saraban.view_all');
const urgencyBadge = (u) => u && u !== 'normal' ? `<span class="badge ${SARABAN_URGENCY[u].cls}">${ic('zap', 'w-3 h-3')} ${SARABAN_URGENCY[u].label}</span>` : '';
const accessBadge = (a) => { const m = SARABAN_ACCESS[a] || SARABAN_ACCESS.public; return `<span class="badge ${m.cls}">${ic(m.icon, 'w-3 h-3')} ${m.label}</span>`; };
const catBadge = (c) => c ? `<span class="badge border" style="background:${hexToRgba(c.color, .12)};color:${c.color};border-color:${hexToRgba(c.color, .3)}">${ic(c.icon, 'w-3 h-3')} ${esc(c.name)}</span>` : '';

/** โหลดประเภทเอกสาร + เอกสาร ตามสิทธิ์ของผู้ใช้ */
async function sarabanLoad() {
  if (!sarabanCanInternal()) {
    const r = await dbMany([
      s => s.from('saraban_categories').select('*').eq('is_active', true).order('sort_order'),
      s => s.from('v_public_saraban').select('*').order('created_at', { ascending: false }),
    ], { loaderText: 'กำลังโหลดเอกสาร...', error: 'โหลดเอกสารไม่สำเร็จ' });
    if (!r.ok) return false;
    Saraban.cats = r.data[0];
    Saraban.docs = r.data[1].map(d => ({
      ...d, access_level: 'public', files: null,
      cat: { cat_key: d.cat_key, name: d.category_name, group_key: d.group_key, group_name: d.group_name, icon: d.category_icon, color: d.category_color },
    }));
    return true;
  }
  const u = currentUser();
  let q = sb.from('saraban_documents')
    .select('*, saraban_categories(*), organizations(name, short_name), saraban_files(id, file_name, file_path, file_url, mime_type, file_size, sort_order)')
    .order('created_at', { ascending: false });
  if (!isSuperAdmin()) {
    const o = u.org_id;
    q = hasPermission('saraban.view_all')
      ? q.or(`access_level.eq.public,org_id.eq.${o}`)
      : q.or(`access_level.eq.public,and(org_id.eq.${o},access_level.eq.internal),and(org_id.eq.${o},created_by.eq.${u.id})`);
  }
  const r = await dbMany([s => s.from('saraban_categories').select('*').order('sort_order'), () => q], { loaderText: 'กำลังโหลดเอกสาร...', error: 'โหลดเอกสารไม่สำเร็จ' });
  if (!r.ok) return false;
  Saraban.cats = r.data[0];
  Saraban.docs = r.data[1].map(d => ({
    ...d, cat: d.saraban_categories, org_name: d.organizations?.name, org_short_name: d.organizations?.short_name,
    files: (d.saraban_files || []).sort((a, b) => a.sort_order - b.sort_order), file_count: (d.saraban_files || []).length,
  }));
  return true;
}

async function renderSaraban(el, mod) {

  Saraban.group = '';
  el.innerHTML = pageHeader({

  if (internal) filters.push({ key: 'access_level', label: 'ทุกระดับการเข้าถึง', options: [...Object.entries(SARABAN_ACCESS).map(([k, m]) => ({ value: k, label: m.label })), { value: '__mine', label: 'เอกสารที่ฉันบันทึก' }],

  const table = createDataTable($('#sbTable', el), {
    pageSize: 10, filters,
    searchKeys: ['title', 'doc_no', 'from_org', 'to_org', 'keywords', 'summary', 'cat.name'],
    searchPlaceholder: 'ค้นหาชื่อเรื่อง, เลขที่หนังสือ, เจ้าของหนังสือ, คำค้น...',
    columns: [
      { key: 'doc_no', label: 'เลขที่หนังสือ', class: 'whitespace-nowrap', render: d => `<span class="font-medium text-slate-700">${esc(d.doc_no || '-')}</span>` },
      { key: 'title', label: 'ชื่อเรื่อง', render: d => `<button type="button" class="text-left font-medium text-slate-700 hover:text-brand-600 line-clamp-2 max-w-md" data-act="view" data-id="${d.id}">${esc(d.title)}</button>
          <div class="flex flex-wrap gap-1 mt-1">${catBadge(d.cat)}${urgencyBadge(d.urgency)}${internal ? accessBadge(d.access_level) : ''}</div>` },

  });
  const applyGroup = () => {
    const groups = [];
    Saraban.cats.forEach(c => { if (!groups.some(g => g.key === c.group_key)) groups.push({ key: c.group_key, name: c.group_name, icon: c.icon, color: c.color }); });
    const count = (g) => Saraban.docs.filter(d => !g || d.cat?.group_key === g).length;
    $('#sbGroups', el).innerHTML = [{ key: '', name: 'ทั้งหมด', icon: 'layers', color: '#5AA9E6' }, ...groups].map(g => {

            SARABAN_URGENCY[x.urgency]?.label, SARABAN_ACCESS[x.access_level]?.label, x.file_count || 0, x.download_count || 0, x.org_name]));
        logAudit('export', 'saraban_documents', null, { count: rows.length });
        break;
      }

}

          ${row('สถิติ', `${ic('eye', 'w-3.5 h-3.5 inline')} ${formatNumber((d.view_count || 0) + 1)} ครั้ง · ${ic('download', 'w-3.5 h-3.5 inline')} <span data-dlcount>${formatNumber(d.download_count || 0)}</span> ครั้ง`)}
          ${d.summary ? `<div class="pt-3"><div class="text-slate-400 mb-1">สาระสำคัญ</div><div class="prose-sfh text-sm">${esc(d.summary)}</div></div>` : ''}
          ${d.keywords ? `<div class="pt-3 flex flex-wrap gap-1.5">${d.keywords.split(',').map(k => k.trim()).filter(Boolean).map(k => `<span class="badge bg-lilac-50 text-lilac-600 border border-lilac-100">#${esc(k)}</span>`).join('')}</div>` : ''}
        </dl>
        <div class="lg:col-span-3">
          <div class="text-sm font-medium text-slate-600 mb-2">${ic('paperclip', 'w-4 h-4 inline')} ไฟล์แนบ (${files.length})</div>
          ${files.length ? `<ul class="space-y-2">${files.map(f => { const fm = sarabanFileMeta(f.file_name, f.mime_type); return `<li class="flex items-center gap-3 rounded-2xl border border-slate-100 p-2.5 bg-white">
              <span class="w-10 h-10 rounded-xl grid place-items-center shrink-0" style="background:${hexToRgba(fm.color, .12)};color:${fm.color}">${ic(fm.icon, 'w-5 h-5')}</span>
              <div class="min-w-0 flex-1"><div class="text-sm text-slate-700 truncate" title="${esc(f.file_name)}">${esc(f.file_name)}</div><div class="text-xs text-slate-400">${formatBytes(f.file_size)}</div></div>
              ${['pdf', 'image'].includes(fm.kind) ? `<button type="button" class="btn btn-soft btn-sm" data-preview="${f.id}">${ic('eye', 'w-3.5 h-3.5')} <span class="hidden sm:inline">ดูตัวอย่าง</span></button>` : ''}
              <a class="btn btn-primary btn-sm" href="${esc(sarabanDownloadUrl(f))}" data-dl="${f.id}" rel="noopener">${ic('download', 'w-3.5 h-3.5')} <span class="hidden sm:inline">ดาวน์โหลด</span></a></li>`; }).join('')}</ul>
            <div id="sbPreview" class="mt-3"></div>`
          : `<div class="rounded-2xl bg-slate-50 p-6 text-center text-sm text-slate-400">${ic('file-x', 'w-6 h-6 mx-auto mb-1')} ไม่มีไฟล์แนบ</div>`}
        </div>
      </div>`,
    footer: `<button class="btn btn-ghost" data-close>ปิด</button>`,
  });
  m.el.addEventListener('click', (e) => {
    const pv = e.target.closest('[data-preview]');
    if (pv) {
      const f = files.find(x => x.id === pv.dataset.preview);
      const kind = sarabanFileMeta(f.file_name, f.mime_type).kind;
      $('#sbPreview', m.el).innerHTML = kind === 'pdf'
        ? `<iframe src="${esc(f.file_url)}" class="w-full h-[60vh] rounded-2xl border border-slate-100 bg-slate-50" title="${esc(f.file_name)}"></iframe>`
        : `<img src="${esc(f.file_url)}" alt="${esc(f.file_name)}" class="w-full max-h-[60vh] object-contain rounded-2xl bg-slate-50" onerror="imgError(this)">`;
      return;
    }
    if (e.target.closest('[data-dl]') && sb) {
      sb.rpc('sfh_saraban_hit', { p_doc_id: d.id, p_kind: 'download' }).then(() => {
        d.download_count = (d.download_count || 0) + 1;
        const c2 = $('[data-dlcount]', m.el); if (c2) c2.textContent = formatNumber(d.download_count);
      });
    }
  });
}

/** อัปโหลดไฟล์เอกสาร (รูปภาพบีบอัดเป็น WebP, ไฟล์อื่นอัปโหลดตามจริง) */
async function sarabanUpload(item, folder) {
  const ext = item.upload.type === 'image/webp' ? 'webp' : (String(item.name).split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, item.upload, { contentType: item.upload.type || 'application/octet-stream', cacheControl: '3600', upsert: false });
  if (error) throw error;
  return { path, url: sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl };
}

function openSarabanForm(d, onSaved) {

        <div><label class="label">เลขที่หนังสือ <span id="sbDocNoReq">*</span></label><input name="doc_no" class="input" value="${esc(d?.doc_no || '')}" placeholder="เช่น สท 52301/1520"></div>
