<style>

  body {

  .soon-badge { font-size: .65rem; padding: .1rem .45rem; border-radius: 999px; background: #FFF6DE; color: #A77A12; border: 1px solid #FFEDB8; white-space: nowrap; line-height: 1.3; }

  /* ----- Bottom Nav ----- */
  #bottomNav { padding-bottom: env(safe-area-inset-bottom); }
  .bn-item { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .35rem .15rem; border-radius: 1rem; color: #94A3B8; font-size: .68rem; transition: all .2s; }

  .bn-center.active .bn-center-btn { transform: rotate(45deg) scale(1.02); }
  .bn-center.active .bn-center-btn svg { transform: rotate(-45deg); }

  /* ----- Bottom Sheet ----- */
  #sheet { transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s; transform: translateY(calc(100% + 120px)); opacity: 0; pointer-events: none; }
  #sheet.open { transform: none; opacity: 1; pointer-events: auto; }

  /* ----- Animations ----- */
  .page { animation: pageIn .35s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn .2s ease; }
  .slide-up { animation: slideUp .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  .toast { animation: toastIn .3s cubic-bezier(.2,.8,.2,1); transition: all .25s; }
  .toast-out { opacity: 0; transform: translateY(-8px) scale(.98); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(.98); } to { opacity: 1; transform: none; } }
  .hover-lift { transition: transform .22s ease, box-shadow .22s ease; }
  .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -16px rgba(59,143,212,.35); }
  .float-slow { animation: floatY 5s ease-in-out infinite; }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* ----- Loader ----- */
  .spinner { width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(#5AA9E6, #EC7FA5, #F0C552, #5AA9E6); -webkit-mask: radial-gradient(farthest-side, transparent 60%, #000 62%); mask: radial-gradient(farthest-side, transparent 60%, #000 62%); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { background: linear-gradient(90deg, #EEF4FA 25%, #F8FBFE 37%, #EEF4FA 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* ----- Switch ----- */
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: #E2E8F0; border-radius: 999px; transition: .25s; cursor: pointer; }
  .switch .slider:before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .25s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked + .slider { background: linear-gradient(90deg, #5AA9E6, #EC7FA5); }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .switch input:focus-visible + .slider { box-shadow: 0 0 0 4px #DDEFFC; }
  .switch input:disabled + .slider { opacity: .55; cursor: not-allowed; }

  /* ----- Misc ----- */
  .img-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; color: #94A3B8; font-size: .8rem; text-align: center; padding: .5rem;
    background: repeating-linear-gradient(45deg, #F8FAFC, #F8FAFC 10px, #F1F5F9 10px, #F1F5F9 20px); }
  .prose-sfh { white-space: pre-line; line-height: 1.85; color: #475569; }
  table.sfh-table th { font-weight: 500; font-size: .8rem; text-align: left; padding: .75rem 1rem; white-space: nowrap; }

<script>
'use strict';
/* =====================================================================
   Smart Finance Hub (SFH) – index.html
   โครงสร้างสคริปต์
     CORE    : การเชื่อมต่อ, State, ฟังก์ชันกลาง (ใช้ร่วมกันทุกโมดูล)
     LAYOUT  : Sidebar / Topbar / Bottom Nav / Sheet
     ROUTER  : เปลี่ยนหน้าด้วยการแสดง/ซ่อน section
     PAGES   : หน้าแกนกลาง (หน้าแรก, Login, แดชบอร์ด, จัดการระบบ ...)
     MODULES : โมดูลงาน (ครอบด้วยคอมเมนต์ /* ===== MODULE: xxx ===== *\/)
     INIT    : เริ่มระบบ
   ===================================================================== */

/* ===== CORE: การเชื่อมต่อ Supabase ===== */
const STORAGE_BUCKET = 'sfh-files';
const SESSION_KEY = 'sfh_session_v1';
const CONFIG_OK = (typeof SUPABASE_URL === 'string' && typeof SUPABASE_ANON_KEY === 'string'
  && /^https?:\/\//.test(SUPABASE_URL) && !SUPABASE_URL.includes('YOUR_') && SUPABASE_ANON_KEY.length > 20
  && !SUPABASE_ANON_KEY.includes('YOUR_'));
// ห้ามตั้งชื่อตัวแปรว่า supabase (ชนกับชื่อ Library) → ใช้ sb
const sb = (() => {
  try { return (CONFIG_OK && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null; }
  catch (e) { console.error('[SFH] createClient error', e); return null; }
})();

/* ===== CORE: State ===== */
const State = {
  session: null,          // { user, role, organization, permissions[], saved_at }
  perms: new Set(),       // permission ของผู้ Login
  guestPerms: new Set(),  // permission ของ Role guest (จากเมนูที่เปิด)
  menus: [],              // เมนูที่ผู้ใช้ปัจจุบันเห็น
  allMenus: [],           // เมนูทั้งหมด (ผู้ Login)
  modules: [],            // ตาราง modules (ผู้ Login)
  guestMenus: [],         // ผลจาก sfh_guest_menus()
  settings: {},           // system_settings (สาธารณะ)
  current: null,
  charts: {},
  lastSessionCheck: 0,
};

/* ===== CORE: ตัวช่วยทั่วไป ===== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const ic = (name, cls = 'w-4 h-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
function refreshIcons() { try { if (window.lucide) lucide.createIcons(); } catch (e) { /* ignore */ } }
function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const esc = escapeHtml;
function debounce(fn, ms = 250) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function getVal(obj, path) { return String(path).split('.').reduce((a, k) => (a == null ? a : a[k]), obj); }
function initials(name) {
  const s = String(name || '').replace(/^(นางสาว|นาย|นาง|ดร\.|ว่าที่ร้อยตรี|ว่าที่ ร\.ต\.)\s*/, '').trim().replace(/^[เแโใไ]/, '');
  return s.slice(0, 1).toUpperCase() || '?';
}
function hexToRgba(hex, a = 1) {
  const h = String(hex || '#5AA9E6').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  if (isNaN(n)) return `rgba(90,169,230,${a})`;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function formatBytes(b) {
  if (!b && b !== 0) return '-';
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  return `${(b / 1024 / 1024).toFixed(2)} MB`;
}

/* ===== CORE: รูปแบบตัวเลข/วันที่ ===== */
const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

/** จำนวนเงิน → "1,234.50 บาท" */
function formatMoney(n, { unit = true, decimals = 2 } = {}) {
  const v = Number(String(n ?? 0).replace(/,/g, ''));
  const s = (isFinite(v) ? v : 0).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return unit ? `${s} บาท` : s;
}
function formatNumber(n) { return Number(n || 0).toLocaleString('en-US'); }

/** วันที่ → "30 ก.ย. 2569" (long: "30 กันยายน 2569", time: เพิ่มเวลา) */
function formatThaiDate(value, { long = false, time = false, weekday = false } = {}) {
  if (!value) return '-';
  const d = value instanceof Date ? value : new Date(value);
  if (isNaN(d)) return '-';
  let s = `${d.getDate()} ${(long ? TH_MONTHS : TH_MONTHS_SHORT)[d.getMonth()]} ${d.getFullYear() + 543}`;
  if (weekday) s = `วัน${TH_DAYS[d.getDay()]}ที่ ${s}`;
  if (time) s += ` ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} น.`;
  return s;
}
function toInputDate(value) {
  const d = value ? new Date(value) : new Date();
  if (isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function timeAgo(value) {
  if (!value) return '-';
  const diff = (Date.now() - new Date(value).getTime()) / 1000;
  if (diff < 0) return formatThaiDate(value, { time: true });
  if (diff < 60) return 'เมื่อสักครู่';
  if (diff < 3600) return `${Math.floor(diff / 60)} นาทีที่แล้ว`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} ชั่วโมงที่แล้ว`;
  if (diff < 86400 * 7) return `${Math.floor(diff / 86400)} วันที่แล้ว`;
  return formatThaiDate(value);
}

/** แปลงจำนวนเงินเป็นตัวอักษรไทย เช่น 1234.50 → "หนึ่งพันสองร้อยสามสิบสี่บาทห้าสิบสตางค์" */
function bahtText(input) {
  let num = Number(String(input ?? '').replace(/,/g, ''));
  if (!isFinite(num)) return '';
  const negative = num < 0;
  num = Math.abs(num);
  const [bahtStr, satangStr] = num.toFixed(2).split('.');
  const DIGITS = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
  const UNITS = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  const readGroup = (s) => {            // อ่านเลขไม่เกิน 6 หลัก (ตัดศูนย์นำหน้าแล้ว)
    let out = '';
    const len = s.length;
    for (let i = 0; i < len; i++) {
      const d = +s[i];
      const pos = len - i - 1;
      if (d === 0) continue;
      if (pos === 0 && d === 1 && len > 1) out += 'เอ็ด';
      else if (pos === 1 && d === 2) out += 'ยี่';
      else if (pos === 1 && d === 1) out += '';
      else out += DIGITS[d];
      out += UNITS[pos];
    }
    return out;
  };
  const readNumber = (s) => {
    s = s.replace(/^0+/, '');
    if (!s) return '';
    if (s.length > 6) return readNumber(s.slice(0, -6)) + 'ล้าน' + readGroup(s.slice(-6).replace(/^0+/, ''));
    return readGroup(s);
  };
  const baht = readNumber(bahtStr);
  const satang = readGroup(satangStr.replace(/^0+/, ''));
  if (!baht && !satang) return 'ศูนย์บาทถ้วน';
  let text = (baht ? baht + 'บาท' : '') + (satang ? satang + 'สตางค์' : 'ถ้วน');
  return (negative ? 'ลบ' : '') + text;
}

/* ===== CORE: Modal ===== */
function openModal({ title = '', body = '', footer = '', size = 'md', icon = null, onClose = null } = {}) {
  const sizes = { sm: 'sm:max-w-md', md: 'sm:max-w-lg', lg: 'sm:max-w-2xl', xl: 'sm:max-w-4xl' };
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-[70] flex items-end sm:items-center justify-center sm:p-4';
  wrap.innerHTML = `
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm fade-in" data-close></div>
    <div class="relative w-full ${sizes[size] || sizes.md} bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col slide-up">
      <div class="flex items-center gap-3 px-5 pt-5 pb-3 border-b border-slate-100">
        ${icon ? `<div class="w-10 h-10 shrink-0 rounded-2xl bg-gradient-to-br from-brand-100 to-blush-100 text-brand-600 grid place-items-center">${ic(icon, 'w-5 h-5')}</div>` : ''}
        <h3 class="font-semibold text-lg text-slate-800 flex-1 min-w-0 truncate">${title}</h3>
        <button type="button" class="btn-icon" data-close aria-label="ปิด">${ic('x', 'w-5 h-5')}</button>
      </div>
      <div class="modal-body overflow-y-auto px-5 py-4 flex-1">${body}</div>
      ${footer ? `<div class="px-5 py-4 border-t border-slate-100 flex flex-wrap justify-end gap-2 bg-slate-50/70 sm:rounded-b-3xl" style="padding-bottom:calc(1rem + env(safe-area-inset-bottom))">${footer}</div>` : ''}
    </div>`;
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    wrap.remove();
    document.removeEventListener('keydown', onKey);
    if (!$('#modalRoot').children.length) document.body.classList.remove('overflow-hidden');
    if (onClose) onClose();
  };
  const onKey = (e) => { if (e.key === 'Escape' && $('#modalRoot').lastElementChild === wrap) close(); };
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  $('#modalRoot').appendChild(wrap);
  document.body.classList.add('overflow-hidden');
  enhanceDatalists(wrap);
  refreshIcons();
  return { el: wrap, body: $('.modal-body', wrap), close };
}

/* ===== CORE: ช่องกรอกพร้อมรายการแนะนำ =====
   ใช้แทน <datalist> ของเบราว์เซอร์ ซึ่งมักแสดงรายการผิดตำแหน่งเมื่ออยู่ในหน้าต่าง Modal ที่เลื่อนได้
   รายการแสดงชิดใต้ช่องเสมอ (ถ้าพื้นที่ด้านล่างไม่พอจะเปิดขึ้นด้านบน) · ใช้แป้น ↑ ↓ Enter Esc ได้ */
const Suggest = { panel: null, input: null, list: [], active: -1 };
function suggestPanel() {
  if (Suggest.panel) return Suggest.panel;
  const p = document.createElement('div');
  p.className = 'fixed z-[85] hidden max-h-60 overflow-y-auto rounded-2xl border border-slate-200 bg-white py-1 text-sm shadow-soft';
  p.setAttribute('role', 'listbox');
  p.addEventListener('mousedown', (e) => {          // mousedown + preventDefault: ไม่ให้ช่องกรอกเสีย focus ก่อนเลือก
    const o = e.target.closest('[data-sg]');
    e.preventDefault();
    if (o) suggestPick(+o.dataset.sg);
  });
  document.body.appendChild(p);
  window.addEventListener('resize', suggestPlace);
  document.addEventListener('scroll', suggestPlace, true);   // true = จับการเลื่อนของ Modal ด้วย
  return (Suggest.panel = p);
}
function suggestPlace() {
  const p = Suggest.panel, inp = Suggest.input;
  if (!p || !inp || p.classList.contains('hidden')) return;
  const r = inp.getBoundingClientRect();
  if (!r.width || !document.body.contains(inp)) { suggestClose(); return; }
  const h = p.offsetHeight, below = window.innerHeight - r.bottom;   // offsetHeight รวมเส้นขอบ (สูงสุด 240px จาก max-h-60)
  p.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - Math.max(r.width, 200) - 8))}px`;
  p.style.width = `${Math.max(r.width, 200)}px`;
  p.style.top = `${below < h + 8 && r.top > below ? r.top - h - 4 : r.bottom + 4}px`;
}
function suggestOpen(inp) {
  const p = suggestPanel();
  const q = inp.value.trim().toLowerCase();
  const all = inp._sgOptions();
  const list = (q ? all.filter(o => o.toLowerCase().includes(q)) : all).slice(0, 60);
  if (!list.length || (list.length === 1 && list[0] === inp.value)) { suggestClose(); return; }
  Object.assign(Suggest, { input: inp, list, active: -1 });
  const mark = (o) => {
    const i = q ? o.toLowerCase().indexOf(q) : -1;
    return i < 0 ? esc(o) : `${esc(o.slice(0, i))}<b class="text-brand-600">${esc(o.slice(i, i + q.length))}</b>${esc(o.slice(i + q.length))}`;
  };
  p.innerHTML = list.map((o, i) => `<div data-sg="${i}" role="option" class="px-3 py-2 cursor-pointer truncate text-slate-700 hover:bg-brand-50">${mark(o)}</div>`).join('');
  p.classList.remove('hidden');
  p.scrollTop = 0;
  suggestPlace();
}
function suggestClose() {
  if (Suggest.panel) Suggest.panel.classList.add('hidden');
  Suggest.input = null; Suggest.active = -1;
}
function suggestPick(i) {
  const inp = Suggest.input;
  if (!inp || Suggest.list[i] == null) return;
  inp.value = Suggest.list[i];
  suggestClose();
  inp._sgPicking = true;
  inp.dispatchEvent(new Event('input', { bubbles: true }));   // ให้ฟอร์มรับรู้ค่าใหม่ (เช่น คำนวณยอด)
  inp._sgPicking = false;
}
function suggestMove(step) {
  const p = Suggest.panel;
  if (!Suggest.list.length) return;
  Suggest.active = (Suggest.active + step + Suggest.list.length) % Suggest.list.length;
  $$('[data-sg]', p).forEach((el, i) => el.classList.toggle('bg-brand-50', i === Suggest.active));
  $(`[data-sg="${Suggest.active}"]`, p)?.scrollIntoView({ block: 'nearest' });
}
/** ผูกรายการแนะนำกับช่องกรอก – getOptions() คืน array ของข้อความ */
function attachSuggest(inp, getOptions) {
  if (inp._sgOptions) return;
  inp._sgOptions = getOptions;
  inp.setAttribute('autocomplete', 'off');
  inp.addEventListener('focus', () => suggestOpen(inp));
  inp.addEventListener('input', () => { if (!inp._sgPicking) suggestOpen(inp); });
  inp.addEventListener('blur', () => setTimeout(() => { if (Suggest.input === inp) suggestClose(); }, 120));
  inp.addEventListener('keydown', (e) => {
    const open = Suggest.input === inp && !Suggest.panel.classList.contains('hidden');
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) suggestOpen(inp); else suggestMove(1); }
    else if (e.key === 'ArrowUp' && open) { e.preventDefault(); suggestMove(-1); }
    else if (e.key === 'Enter' && open && Suggest.active >= 0) { e.preventDefault(); suggestPick(Suggest.active); }
    else if (e.key === 'Escape' && open) { e.preventDefault(); e.stopPropagation(); suggestClose(); }
  });
}
/** เปลี่ยน <input list="..."> ภายใน root ให้ใช้รายการแนะนำของระบบแทน datalist ของเบราว์เซอร์ */
function enhanceDatalists(root) {
  $$('input[list]', root).forEach(inp => {
    const dl = document.getElementById(inp.getAttribute('list'));
    if (!dl) return;
    inp.removeAttribute('list');
    attachSuggest(inp, () => [...dl.options].map(o => o.value).filter(Boolean));
  });
}

/** Modal ยืนยัน → Promise<boolean> */
function confirmModal({ title = 'ยืนยันการทำรายการ', message = '', confirmText = 'ยืนยัน', cancelText = 'ยกเลิก', danger = true, icon = null, confirmIcon = null } = {}) {
  return new Promise((resolve) => {
    let answered = false;
    const m = openModal({
      title, size: 'sm', icon: icon || (danger ? 'alert-triangle' : 'help-circle'),
      body: `<div class="text-slate-600 leading-relaxed">${message}</div>`,
      footer: `<button type="button" class="btn btn-ghost" data-close>${esc(cancelText)}</button>
               <button type="button" class="btn ${danger ? 'btn-pink' : 'btn-primary'}" data-ok>${ic(confirmIcon || (danger ? 'trash-2' : 'check'))} ${esc(confirmText)}</button>`,
      onClose: () => { if (!answered) { answered = true; resolve(false); } },
    });
    $('[data-ok]', m.el).addEventListener('click', () => { answered = true; resolve(true); m.close(); });
  });
}

/* ===== CORE: เรียกฐานข้อมูล (Loader + Toast + try/catch) ===== */
function dbErrorMessage(e) {
  const msg = String(e?.message || e || '');
  if (!e?.code && /Failed to fetch|NetworkError|Load failed|fetch failed|ERR_NAME/i.test(msg))
    return 'เชื่อมต่อ Supabase ไม่ได้ กรุณาตรวจสอบ SUPABASE_URL / SUPABASE_ANON_KEY ในไฟล์ config.js และการเชื่อมต่ออินเทอร์เน็ต';
  if (/Invalid API key|No API key|JWT|apikey/i.test(msg)) return 'API Key ไม่ถูกต้อง กรุณาตรวจสอบ SUPABASE_ANON_KEY ในไฟล์ config.js';
  if (['PGRST202', 'PGRST205', '42P01', '42883'].includes(e?.code) || /Could not find the|does not exist/i.test(msg))
    return 'ไม่พบตาราง/ฟังก์ชันในฐานข้อมูล กรุณารันไฟล์ SQL ล่าสุด (เช่น module_security.sql) ใน Supabase SQL Editor';
  if (/^FORBIDDEN/.test(msg)) { const d = msg.replace(/^FORBIDDEN:?\s*/, ''); return /[ก-๙]/.test(d) ? d : 'คุณไม่มีสิทธิ์ทำรายการนี้'; }
  if (/SESSION_EXPIRED/.test(msg)) return 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';
  if (e?.code === '23505') return 'ข้อมูลซ้ำกับที่มีอยู่แล้ว (เช่น ชื่อผู้ใช้หรือรหัสซ้ำ)';
  if (e?.code === '23503') return 'ไม่สามารถดำเนินการได้ เนื่องจากมีข้อมูลอื่นอ้างอิงอยู่';
  if (e?.code === '42501') return 'ไม่มีสิทธิ์เข้าถึงข้อมูล (ตรวจสอบ RLS Policy)';
  if (/row-level security/i.test(msg)) return 'ถูกปฏิเสธโดย RLS Policy กรุณาตรวจสอบการตั้งค่า';
  if (/Bucket not found/i.test(msg)) return 'ไม่พบ Storage bucket "sfh-files" กรุณารัน database.sql';
  return msg || 'ไม่ทราบสาเหตุ';
}

/**
 * db(task, options) – เรียก Supabase พร้อม Loader/Toast
 * task: (sb) => query   คืน { ok, data, count, error }
 */
async function db(task, { loader = true, loaderText = 'กำลังโหลดข้อมูล...', success = '', error = 'เกิดข้อผิดพลาด', silent = false } = {}) {
  if (!sb) { if (!silent) showToast('ยังไม่ได้ตั้งค่าการเชื่อมต่อ กรุณาตรวจสอบไฟล์ config.js', 'error', 6000); return { ok: false, data: null, error: new Error('NO_CONFIG') }; }
  if (loader) showLoader(true, loaderText);
  try {
    const res = await task(sb);
    if (res && res.error) throw res.error;
    if (success) showToast(success, 'success');
    return { ok: true, data: res ? (res.data ?? null) : null, count: res ? (res.count ?? null) : null };
  } catch (e) {
    console.error('[SFH]', e);
    if (/SESSION_EXPIRED/.test(String(e?.message || '')) && State.session) { sessionExpired(); return { ok: false, data: null, error: e }; }
    if (!silent) showToast(`${error}: ${dbErrorMessage(e)}`, 'error', 6500);
    return { ok: false, data: null, error: e };
  } finally {
    if (loader) showLoader(false);
  }
}
/** พารามิเตอร์สำหรับฟังก์ชันฐานข้อมูลที่ตรวจ session token: s.rpc('sfh_xxx', tk({ ... })) */
const tk = (params = {}) => ({ p_token: State.session?.token || null, ...params });
/** เรียกหลาย query พร้อมกัน → data เป็น array (ถ้า query เป็น head:true จะได้ count) */
async function dbMany(tasks, opts = {}) {
  return db(async (s) => {
    const rs = await Promise.all(tasks.map(t => t(s)));
    const bad = rs.find(r => r && r.error);
    if (bad) return { error: bad.error };
    return { data: rs.map(r => (r.data ?? r.count ?? null)) };
  }, opts);
}

/* ===== CORE: Audit Log ===== */
async function logAudit(action, tableName = null, recordId = null, details = {}) {
  if (!sb) return;
  try {   // ผู้ใช้ระบุจาก session token ฝั่งฐานข้อมูล (ไม่มี token = guest)
    const { error } = await sb.rpc('sfh_log', tk({
      p_action: action, p_table: tableName, p_record: recordId != null ? String(recordId) : null, p_details: details || {},
      p_user_agent: navigator.userAgent.slice(0, 250),
    }));
    if (error) console.warn('[SFH] audit', error);
  } catch (e) { console.warn('[SFH] audit', e); }
}

/* ===== CORE: Session & Permission ===== */
const isLoggedIn = () => !!State.session;
const currentUser = () => State.session?.user || null;
const currentRole = () => State.session?.role || null;
const roleKey = () => State.session?.role?.role_key || 'guest';
const isSuperAdmin = () => roleKey() === 'super_admin';
const isOrgAdmin = () => roleKey() === 'org_admin';

/** ตรวจสิทธิ์ – ผู้ Login ใช้ permission ของตนเอง, Guest ใช้ permission ของ Role guest */
function hasPermission(perm) {
  if (!perm) return true;
  if (!isLoggedIn()) return State.guestPerms.has(perm);
  if (isSuperAdmin()) return true;
  return State.perms.has(perm);
}
const hasAnyPermission = (...perms) => perms.some(hasPermission);
/** ตรวจสิทธิ์ซ้ำก่อนเรียกฐานข้อมูล */
function requirePermission(perm, msg = 'คุณไม่มีสิทธิ์ทำรายการนี้') {
  if (hasPermission(perm)) return true;
  showToast(msg, 'error');
  return false;
}
/** เจ้าหน้าที่แก้ได้เฉพาะรายการที่ตนเองบันทึก เว้นแต่มีสิทธิ์ view_all / เป็น admin */
function canEditRecord(rec, viewAllPerm = null) {
  const u = currentUser();
  if (!u || !rec) return false;
  if (isSuperAdmin()) return true;
  if (isOrgAdmin() && rec.org_id && rec.org_id === u.org_id) return true;
  if (viewAllPerm && hasPermission(viewAllPerm) && rec.org_id === u.org_id) return true;
  return rec.created_by === u.id;
}

function readSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; } }
function saveSession(payload) {
  const prev = State.session || readSession();
  const s = { user: payload.user, role: payload.role, organization: payload.organization || null, permissions: payload.permissions || [],
    token: payload.token || prev?.token || null,   // session token จาก sfh_login (ใช้กับข้อมูลอ่อนไหว)
    saved_at: new Date().toISOString() };
  State.session = s;
  State.perms = new Set(s.permissions);
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch { /* ignore */ }
}
function clearSession() {
  State.session = null; State.perms = new Set();
  try { localStorage.removeItem(SESSION_KEY); } catch { /* ignore */ }
}
/** เซสชันหมดอายุ → ล้าง session แล้วพาไปหน้า Login (ไม่รีโหลดหน้า) */
async function sessionExpired(msg = 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่') {
  clearSession();
  await reloadNavigation();
  showToast(msg, 'warning', 6000);
  navigate('login');
}
/**
 * rpcSecure(fn, params, options) – เรียกฟังก์ชันฐานข้อมูลที่ตรวจ session token (ใช้กับข้อมูลอ่อนไหว เช่น เงินเดือน)
 * ส่ง p_token ให้อัตโนมัติ · token หมดอายุ → พาไปหน้า Login · ไม่มีสิทธิ์ → แจ้งเตือน
 */
async function rpcSecure(fn, params = {}, { loader = true, loaderText = 'กำลังโหลดข้อมูล...', error = 'เกิดข้อผิดพลาด', success = '' } = {}) {
  const token = State.session?.token;
  if (!token) { await sessionExpired(); return { ok: false, data: null, error: new Error('SESSION_EXPIRED') }; }
  const r = await db(s => s.rpc(fn, { p_token: token, ...params }), { loader, loaderText, silent: true });
  if (r.ok) { if (success) showToast(success, 'success'); return r; }
  const msg = String(r.error?.message || '');
  if (/SESSION_EXPIRED/.test(msg)) await sessionExpired();
  else if (/^FORBIDDEN/.test(msg)) showToast('คุณไม่มีสิทธิ์ทำรายการนี้', 'error');
  else showToast(`${error}: ${dbErrorMessage(r.error)}`, 'error', 6500);
  return r;
}

/* ===== CORE: รูปภาพ (บีบอัด / อัปโหลด / ลบ) ===== */
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ไม่สามารถอ่านไฟล์รูปภาพได้')); };
    img.src = url;
  });
}
/** บีบอัดรูปด้วย canvas → WebP ด้านยาวไม่เกิน maxSide px คุณภาพ ~0.7 */
async function compressImage(file, { maxSide = 1200, quality = 0.7 } = {}) {
  if (!file || !/^image\//.test(file.type)) throw new Error('ไฟล์ที่เลือกไม่ใช่รูปภาพ');
  const img = await loadImageFromFile(file);
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  const toBlob = (type) => new Promise(res => canvas.toBlob(res, type, quality));
  let blob = await toBlob('image/webp');
  if (!blob || blob.type !== 'image/webp') {       // เบราว์เซอร์เก่าที่ไม่รองรับ WebP → JPEG
    ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    blob = await toBlob('image/jpeg');
  }
  if (!blob) throw new Error('บีบอัดรูปภาพไม่สำเร็จ');
  return {
    blob, type: blob.type, ext: blob.type === 'image/webp' ? 'webp' : 'jpg',
    originalSize: file.size, compressedSize: blob.size, width: w, height: h,
    previewUrl: URL.createObjectURL(blob),
  };
}
/** เรียก Edge Function "sfh-storage" (ตรวจ session token + สิทธิ์ฝั่งเซิร์ฟเวอร์) – หน้าเว็บไม่มีสิทธิ์เขียน Storage ตรง */
async function storageFn(body) {
  const { data, error } = await sb.functions.invoke('sfh-storage', { body: { ...body, token: State.session?.token || null } });
  if (error) {
    let msg = error.message || 'Storage error';
    try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch { /* ignore */ }
    throw new Error(msg);
  }
  return data;
}
/** ขอลิงก์อัปโหลดครั้งเดียว แล้วอัปโหลดไฟล์ → { path, url } (โยน Error ถ้าไม่สำเร็จ) */
async function storageUpload(blob, folder, ext, contentType) {
  const { path, token } = await storageFn({ action: 'sign', folder, ext });
  const { error } = await sb.storage.from(STORAGE_BUCKET).uploadToSignedUrl(path, token, blob, { contentType: contentType || blob.type || 'application/octet-stream', cacheControl: '3600' });
  if (error) throw error;
  return { path, url: sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl };
}
/** อัปโหลดไฟล์ไป Storage bucket sfh-files → { ok, path, url } */
async function uploadFile(blob, folder = 'uploads', ext = 'webp') {
  const r = await db(async () => ({ data: await storageUpload(blob, folder, ext, blob.type || 'image/webp') }),
    { loaderText: 'กำลังอัปโหลดไฟล์...', error: 'อัปโหลดไฟล์ไม่สำเร็จ' });
  if (!r.ok) return { ok: false };
  return { ok: true, path: r.data.path, url: r.data.url };
}
/** ลบไฟล์ใน Storage (เซิร์ฟเวอร์ลบเฉพาะไฟล์ที่ไม่มีข้อมูลใดอ้างอิงแล้ว) */
async function deleteFile(path) {
  const paths = (Array.isArray(path) ? path : [path]).filter(Boolean);
  if (!paths.length || !sb || !State.session?.token) return;
  try { await storageFn({ action: 'delete', paths }); } catch (e) { console.warn('[SFH] remove file', e); }
}

function bindImagePicker(root, id, { maxSide = 1200, quality = 0.7 } = {}) {
  const box = $(`[data-picker="${id}"]`, root);
  const st = { file: null, removed: false };
  const input = $('[data-pk-input]', box), preview = $('[data-pk-preview]', box), info = $('[data-pk-info]', box), rm = $('[data-pk-remove]', box);
  $('[data-pk-choose]', box).onclick = () => input.click();
  input.onchange = async () => {
    const f = input.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'warning'); input.value = ''; return; }
    showLoader(true, 'กำลังบีบอัดรูปภาพ...');
    try {
      const c = await compressImage(f, { maxSide, quality });
      st.file = c; st.removed = false;
      preview.innerHTML = `<img src="${c.previewUrl}" alt="" class="w-full max-h-56 object-contain rounded-xl bg-white">`;
      preview.classList.remove('hidden');
      const pct = Math.max(0, Math.round((1 - c.compressedSize / c.originalSize) * 100));
      info.innerHTML = `${ic('zap', 'w-3.5 h-3.5 inline text-cream-500')} ก่อนบีบอัด <b>${formatBytes(c.originalSize)}</b> → หลังบีบอัด <b class="text-mint-600">${formatBytes(c.compressedSize)}</b>
        (ลดลง ${pct}%) · ${c.width}×${c.height}px · ${c.ext.toUpperCase()}`;
      info.classList.remove('hidden'); rm.classList.remove('hidden');
      refreshIcons();
    } catch (e) { showToast('บีบอัดรูปภาพไม่สำเร็จ: ' + e.message, 'error'); }
    finally { showLoader(false); input.value = ''; }
  };
  rm.onclick = () => { st.file = null; st.removed = true; preview.innerHTML = ''; preview.classList.add('hidden'); info.classList.add('hidden'); rm.classList.add('hidden'); };
  return st;
}
/** อัปโหลดรูปใหม่ (ถ้ามี) → คืนค่าที่ต้องบันทึก + path เก่าที่ต้องลบหลังบันทึกสำเร็จ */
async function resolveImageChange(pickerState, oldPath, folder) {
  if (pickerState.file) {
    const up = await uploadFile(pickerState.file.blob, folder, pickerState.file.ext);
    if (!up.ok) return { ok: false };
    return { ok: true, changed: true, url: up.url, path: up.path, oldToDelete: oldPath || null };
  }
  if (pickerState.removed) return { ok: true, changed: true, url: null, path: null, oldToDelete: oldPath || null };
  return { ok: true, changed: false };
}

/* ===== CORE: CSV (มี BOM ให้ Excel อ่านภาษาไทยได้) ===== */
function downloadCSV(filename, headers, rows) {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [headers.map(cell).join(','), ...rows.map(r => r.map(cell).join(','))];
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename.endsWith('.csv') ? filename : `${filename}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  showToast(`ดาวน์โหลด ${a.download} แล้ว (${rows.length} รายการ)`, 'success');
}

/* ===== CORE: ตารางข้อมูล (ค้นหา / กรอง / แบ่งหน้า / มือถือแสดงเป็นการ์ด) ===== */
function pagerHtml(total, page, size) {
  if (!total) return '';
  const pages = Math.max(1, Math.ceil(total / size));
  const from = (page - 1) * size + 1, to = Math.min(total, page * size);
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return `<div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-slate-500">
    <div>แสดง ${formatNumber(from)}–${formatNumber(to)} จาก ${formatNumber(total)} รายการ</div>
    ${pages > 1 ? `<div class="flex items-center gap-1">
      <button class="pg-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="ก่อนหน้า">${ic('chevron-left')}</button>
      ${nums.map(n => n === '…' ? '<span class="px-1">…</span>' : `<button class="pg-btn ${n === page ? 'pg-active' : ''}" data-page="${n}">${n}</button>`).join('')}
      <button class="pg-btn" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="ถัดไป">${ic('chevron-right')}</button>
    </div>` : ''}
  </div>`;
}
/**
 * createDataTable(container, options)
 * options: columns[{key,label,render(row),class,hideOnCard}], searchKeys[], filters[{key,label,options[{value,label}],match(row,val)}],
 *          actions(row)→html, card(row)→html, grid(bool), gridClass, pageSize, toolbar(html), emptyText, searchPlaceholder
 */
function createDataTable(container, opts) {
  const o = {
    pageSize: 10, searchKeys: [], filters: [], columns: [], actions: null, card: null, grid: false,
    gridClass: 'grid gap-4 sm:grid-cols-2 xl:grid-cols-3', emptyText: 'ไม่พบข้อมูล', searchPlaceholder: 'ค้นหา...', toolbar: '', ...opts,
  };
  const st = { rows: [], q: '', f: {}, page: 1 };
  container.innerHTML = `
    <div class="flex flex-wrap gap-2 items-center mb-4">
      <div class="relative flex-1 basis-full md:basis-64 min-w-[14rem]">   <!-- ช่องค้นหาไม่หดจนทับปุ่ม: ปุ่มเยอะ → ขึ้นบรรทัดใหม่แทน -->
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">${ic('search')}</span>
        <input type="search" class="input" style="padding-left:2.5rem" placeholder="${esc(o.searchPlaceholder)}" data-dt-q>
      </div>
      <div class="flex flex-wrap gap-2">
        ${o.filters.map(f => `<select class="input !w-auto flex-1 sm:flex-none min-w-[8.5rem]" data-dt-f="${f.key}">
          <option value="">${esc(f.label)}</option>${f.options.map(op => `<option value="${esc(op.value)}">${esc(op.label)}</option>`).join('')}</select>`).join('')}
        ${o.toolbar}
      </div>
    </div>
    <div data-dt-body></div>
    <div data-dt-pager class="mt-4"></div>`;
  const body = $('[data-dt-body]', container), pager = $('[data-dt-pager]', container);
  $('[data-dt-q]', container).addEventListener('input', debounce((e) => { st.q = e.target.value; st.page = 1; render(); }, 200));
  $$('[data-dt-f]', container).forEach(sel => sel.addEventListener('change', () => { st.f[sel.dataset.dtF] = sel.value; st.page = 1; render(); }));
  pager.addEventListener('click', (e) => {
    const b = e.target.closest('[data-page]');
    if (!b || b.disabled) return;
    st.page = +b.dataset.page; render();
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const cellHtml = (c, r) => (c.render ? c.render(r) : esc(getVal(r, c.key) ?? '-'));
  function filtered() {
    const q = st.q.trim().toLowerCase();
    return st.rows.filter(r => {
      if (q && !o.searchKeys.some(k => String(getVal(r, k) ?? '').toLowerCase().includes(q))) return false;
      for (const f of o.filters) {
        const v = st.f[f.key];
        if (v && !(f.match ? f.match(r, v) : String(getVal(r, f.key)) === v)) return false;
      }
      return true;
    });
  }
  function defaultCard(r) {
    const [first, ...rest] = o.columns.filter(c => !c.hideOnCard);
    return `<div class="rounded-2xl border border-slate-100 bg-white p-4 shadow-sm">
      <div class="mb-3">${first ? cellHtml(first, r) : ''}</div>
      <dl class="grid grid-cols-[auto,1fr] gap-x-3 gap-y-1.5 text-sm">
        ${rest.map(c => `<dt class="text-slate-400 whitespace-nowrap">${esc(c.label)}</dt><dd class="text-right text-slate-700 min-w-0 break-words">${cellHtml(c, r)}</dd>`).join('')}
      </dl>
      ${o.actions ? `<div class="flex flex-wrap justify-end gap-1.5 mt-3 pt-3 border-t border-slate-100">${o.actions(r)}</div>` : ''}
    </div>`;
  }
  function render() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / o.pageSize));
    st.page = Math.min(Math.max(1, st.page), pages);
    const slice = list.slice((st.page - 1) * o.pageSize, st.page * o.pageSize);
    if (!slice.length) body.innerHTML = `<div class="card">${emptyState(o.emptyText, 'search-x')}</div>`;
    else if (o.grid) body.innerHTML = `<div class="${o.gridClass}">${slice.map(o.card).join('')}</div>`;
    else body.innerHTML = `
      <div class="hidden md:block overflow-x-auto rounded-2xl border border-slate-100 bg-white">
        <table class="sfh-table w-full text-sm">
          <thead class="bg-gradient-to-r from-brand-50 via-white to-blush-50 text-slate-500"><tr>
            ${o.columns.map(c => `<th class="${c.class || ''}">${esc(c.label)}</th>`).join('')}${o.actions ? '<th class="text-right">จัดการ</th>' : ''}
          </tr></thead>
          <tbody class="divide-y divide-slate-100">
            ${slice.map(r => `<tr>${o.columns.map(c => `<td class="${c.class || ''}">${cellHtml(c, r)}</td>`).join('')}
              ${o.actions ? `<td class="text-right"><div class="inline-flex gap-1">${o.actions(r)}</div></td>` : ''}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="md:hidden space-y-3">${slice.map(o.card || defaultCard).join('')}</div>`;
    pager.innerHTML = pagerHtml(list.length, st.page, o.pageSize);
    refreshIcons();
  }
  return { setRows(rows) { st.rows = rows || []; render(); }, render, getFiltered: filtered, get rows() { return st.rows; } };
}

/* =====================================================================
   LAYOUT: เมนู (สร้างจากตาราง menus + modules กรองด้วย Permission)
   ===================================================================== */
const HOME_FALLBACK = [{ menu_key: 'home', label: 'หน้าแรก', icon: 'home', menu_group: 'main', sort_order: 1, show_on_mobile: true, module: null, module_key: null }];

function normalizeGuestMenu(r) {
  return {
    ...r,
    module: r.module_key ? {
      module_key: r.module_key, name: r.module_name, description: r.module_description, status: r.module_status,
      color: r.module_color, icon: r.module_icon, version: r.module_version, planned_features: r.module_features || [],
    } : null,
  };
}
function computeUserMenus() {
  const modMap = Object.fromEntries(State.modules.map(m => [m.module_key, m]));
  return State.allMenus
    .filter(m => m.is_active)
    .map(m => ({ ...m, module: m.module_key ? (modMap[m.module_key] || null) : null }))
    .filter(m => !m.module || m.module.status !== 'disabled')
    .filter(m => !m.required_permission || hasPermission(m.required_permission))
    .sort((a, b) => a.sort_order - b.sort_order);
}
async function loadSettings() {
  if (!sb) return;
  const r = await db(s => s.from('v_public_settings').select('*'), { loader: false, silent: true });
  if (r.ok) State.settings = Object.fromEntries((r.data || []).map(x => [x.setting_key, x.setting_value]));
  else if (r.error) showToast('โหลดการตั้งค่าไม่สำเร็จ: ' + dbErrorMessage(r.error), 'error', 7000);
}
async function loadMenus() {
  if (!sb) { State.guestMenus = HOME_FALLBACK; State.guestPerms = new Set(); State.menus = HOME_FALLBACK; return; }
  const g = await db(s => s.rpc('sfh_guest_menus'), { loader: false, error: 'โหลดเมนูสาธารณะไม่สำเร็จ' });
  State.guestMenus = (g.ok && g.data?.length) ? g.data.map(normalizeGuestMenu) : HOME_FALLBACK;
  State.guestPerms = new Set(State.guestMenus.map(m => m.public_permission).filter(Boolean));
  if (isLoggedIn()) {
    const r = await dbMany([
      s => s.from('menus').select('*').order('sort_order'),
      s => s.from('modules').select('*').order('sort_order'),
    ], { loader: false, error: 'โหลดเมนูไม่สำเร็จ' });
    if (r.ok) [State.allMenus, State.modules] = r.data;
    State.menus = computeUserMenus();
    if (!State.menus.length) State.menus = HOME_FALLBACK;
  } else {
    State.menus = State.guestMenus;
  }
}

};
function defaultPage() {
  if (!isLoggedIn()) return 'home';
  return State.menus.some(m => m.menu_key === 'dashboard') ? 'dashboard' : 'home';

/** สถานะย่อยของหน้า (ทะเบียน/แท็บ/ปี) เก็บใน query ของ hash เช่น #/register?v=tuition&tab=family
 *  → รีเฟรชแล้วกลับมาที่เดิม · ใช้ replaceState จึงไม่เกิด hashchange (ไม่โหลดหน้าใหม่) */
function pageState(key) { const q = location.hash.split('?')[1]; return q ? new URLSearchParams(q).get(key) : null; }
function setPageState(values) {
  const [base, q] = location.hash.split('?'), p = new URLSearchParams(q || '');
  Object.entries(values).forEach(([k, v]) => (v == null || v === '' ? p.delete(k) : p.set(k, String(v))));
  const next = base + (p.toString() ? '?' + p.toString() : '');
  if (next !== location.hash) history.replaceState(null, '', next);
}
function navigate(key, replace = false) {
  const h = '#/' + key;
  if (location.hash === h) { route(); return; }
  if (replace) { history.replaceState(null, '', h); route(); }
  else location.hash = h;
}
function getModuleInfo(key) {
  if (isLoggedIn()) { const m = State.modules.find(x => x.module_key === key); if (m) return m; }
  return State.guestMenus.find(m => m.module_key === key)?.module || { module_key: key, name: key, status: 'coming_soon', planned_features: [] };
}
async function showPage(key, menu = null) {
  destroyCharts();
  $$('.page').forEach(p => p.classList.add('hidden'));
  const sec = $('#page-' + key);
  sec.onclick = null; sec.oninput = null; sec.onchange = null; sec.onsubmit = null;
  sec.classList.remove('hidden');
  sec.style.animation = 'none'; void sec.offsetHeight; sec.style.animation = '';
  State.current = menu?.menu_key || key;
  document.body.classList.toggle('auth-page', key === 'login');
  const title = menu?.label || PAGES[key]?.title || '';
  document.title = `${title ? title + ' | ' : ''}${State.settings.site_name || 'Smart Finance Hub'} (${State.settings.site_short || 'SFH'})`;
  updateActiveNav();
  window.scrollTo({ top: 0 });
  try {
    if (key === 'module') {
      const reg = MODULES[menu.module_key] || { render: renderComingSoon };
      await reg.render(sec, getModuleInfo(menu.module_key), menu);
    } else {
      await PAGES[key].render(sec, menu);
    }
  } catch (err) {
    console.error(err);
    sec.innerHTML = errorState('เกิดข้อผิดพลาดในการแสดงหน้านี้', err.message);
  }
  refreshIcons();
}
async function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, '').split('?')[0]);
  if (!raw) return navigate(defaultPage(), true);
  const key = raw;
  closeSheet();
  if (key === 'login') return isLoggedIn() ? navigate(defaultPage(), true) : showPage('login');
  if (key === 'home') return showPage('home', State.menus.find(m => m.menu_key === 'home'));
  if (key === 'profile') return isLoggedIn() ? showPage('profile') : navigate('login', true);
  const menu = State.menus.find(m => m.menu_key === key);
  if (!menu) {
    if (!isLoggedIn()) { showToast('เมนูนี้ยังไม่เปิดให้บริการ', 'warning'); return navigate('home', true); }
    const known = State.allMenus.some(m => m.menu_key === key);
    showToast(known ? 'คุณไม่มีสิทธิ์เข้าถึงเมนูนี้ หรือเมนูถูกปิดใช้งาน' : 'ไม่พบหน้าที่ต้องการ', 'warning');
    return navigate(defaultPage(), true);
  }
  if (menu.module_key) return showPage('module', menu);
  if (PAGES[key]) return showPage(key, menu);
  return showPage('module', menu);
}

/* ===== ROUTER: คลิกเมนูทั้งระบบ (event delegation) ===== */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); closeSheet(); navigate(nav.dataset.nav); return; }
  if (e.target.closest('[data-sheet-close]') || e.target.id === 'sheetBackdrop') { closeSheet(); return; }
  const sh = e.target.closest('[data-sheet]');
  if (sh) { openNavSheet(sh.dataset.sheet); return; }
  if (e.target.closest('[data-logout]')) { logout(); }
});

/* =====================================================================
   AUTH: Login / Logout / ตรวจ session
   ===================================================================== */
async function doLogin(username, password) {
  const r = await db(s => s.rpc('sfh_login', { p_username: username, p_password: password }), { loaderText: 'กำลังเข้าสู่ระบบ...', error: 'เข้าสู่ระบบไม่สำเร็จ' });
  if (!r.ok) return { ok: false, message: dbErrorMessage(r.error) };
  if (!r.data?.success) return { ok: false, message: r.data?.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' };
  saveSession(r.data);
  State.lastSessionCheck = Date.now();
  await reloadNavigation();
  showToast(`ยินดีต้อนรับ ${r.data.user.full_name}`, 'success');
  navigate(defaultPage());
  return { ok: true };
}
async function logout() {
  const ok = await confirmModal({ title: 'ออกจากระบบ', message: 'ต้องการออกจากระบบใช่หรือไม่?', confirmText: 'ออกจากระบบ', icon: 'log-out', confirmIcon: 'log-out', danger: true });
  if (!ok) return;
  await logAudit('logout', 'users', currentUser()?.id);
  if (State.session?.token && sb) { try { await sb.rpc('sfh_logout', { p_token: State.session.token }); } catch { /* ignore */ } }
  clearSession();
  State.allMenus = []; State.modules = [];
  await reloadNavigation();
  showToast('ออกจากระบบเรียบร้อย', 'info');
  navigate('home');
}
/** ตรวจ is_active + permission ล่าสุดจากฐานข้อมูล */
async function verifySession({ silent = false } = {}) {
  const saved = State.session || readSession();
  if (!saved?.user?.id || !sb) return false;
  if (!saved.token) {   // session รุ่นเก่า (ก่อนมี token) → ให้เข้าสู่ระบบใหม่
    clearSession();
    showToast('ระบบปรับปรุงความปลอดภัย กรุณาเข้าสู่ระบบใหม่อีกครั้ง', 'info', 6000);
    return false;
  }
  const r = await db(s => s.rpc('sfh_refresh_session', { p_user_id: saved.user.id, p_token: saved.token }), { loader: !silent, loaderText: 'กำลังตรวจสอบบัญชี...', silent: true });
  State.lastSessionCheck = Date.now();
  if (!r.ok) { State.session = saved; State.perms = new Set(saved.permissions || []); return true; } // เครือข่ายขัดข้อง → ใช้ session เดิมชั่วคราว
  if (!r.data?.success) {
    clearSession();
    showToast(r.data?.message || 'กรุณาเข้าสู่ระบบใหม่', 'warning', 6000);
    return false;
  }
  saveSession(r.data);
  return true;
}

          </form>
        </div>
      </div>
    </div></div>`;
  refreshIcons();
  const form = $('#loginForm', el), pass = $('#lgPass', el), errBox = $('#loginError', el);
  const showErr = (msg) => { errBox.innerHTML = `${ic('alert-circle', 'w-4 h-4 mt-0.5 shrink-0')}<span>${esc(msg)}</span>`; errBox.classList.remove('hidden'); refreshIcons(); };
  $('#togglePwd', el).onclick = (e) => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    e.currentTarget.innerHTML = ic(show ? 'eye-off' : 'eye', 'w-[18px] h-[18px]');
    refreshIcons();
  };
  el.onclick = null;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const username = form.username.value.trim(), password = pass.value;
    if (!username || !password) return showErr('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');

function last14Days() {
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push(d); }
  return days;
}
function loginSeries(rows) {
  const days = last14Days();
  const key = (d) => toInputDate(d);
  const counts = Object.fromEntries(days.map(d => [key(d), 0]));
  (rows || []).forEach(r => { const k = key(new Date(r.created_at)); if (k in counts) counts[k]++; });
  return { labels: days.map(d => `${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]}`), data: days.map(d => counts[key(d)]) };
}
function loginChart(id, rows) {
  const s = loginSeries(rows);
  makeChart(id, {
    type: 'bar',
    data: { labels: s.labels, datasets: [{ label: 'จำนวนครั้งที่เข้าสู่ระบบ', data: s.data, backgroundColor: s.data.map((_, i) => i === s.data.length - 1 ? '#EC7FA5' : '#93CDEF'), borderRadius: 10, maxBarThickness: 28 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#EEF4FA' } }, x: { grid: { display: false } } } },

}

/** แปลง public URL ของ Storage กลับเป็น path (ใช้ลบไฟล์เก่า) */
function storagePathFromUrl(url) {
  const marker = `/object/public/${STORAGE_BUCKET}/`;
  const i = String(url || '').indexOf(marker);
  return i >= 0 ? decodeURIComponent(url.slice(i + marker.length).split('?')[0]) : null;
}

const PERM_GROUP_LABELS = {
  dashboard: 'แดชบอร์ด', announcements: 'ข่าวสาร/ประกาศ', users: 'ผู้ใช้งาน', roles: 'Role & Permission', organizations: 'หน่วยงาน',
  modules: 'โมดูล', public_menu: 'เมนูสาธารณะ', settings: 'ตั้งค่าระบบ', audit: 'Audit Log',
};
function permGroupLabel(key, modules = State.modules) { return modules.find(m => m.module_key === key)?.name || PERM_GROUP_LABELS[key] || key; }
function groupPermissions(perms) {
  const groups = {};
  perms.forEach(p => { (groups[p.module_key] ||= []).push(p); });
  return Object.entries(groups).sort((a, b) => Math.min(...a[1].map(p => p.sort_order)) - Math.min(...b[1].map(p => p.sort_order)));
}
/** ผู้จัดการคนปัจจุบันจัดการบัญชีนี้ได้หรือไม่ */
function canManageUser(target) {
  if (!hasPermission('users.manage') || !target) return false;
  if (isSuperAdmin()) return true;
  const me = currentUser();
  return target.org_id === me.org_id && (target.roles?.level ?? 999) < (currentRole()?.level ?? 0);
}

    const r = await db(s => s.rpc('sfh_admin_users_list', tk()), { error: 'โหลดข้อมูลผู้ใช้ไม่สำเร็จ' });

    searchPlaceholder: 'ค้นหาชื่อ, username, ตำแหน่ง, อีเมล...',
    filters: [
      { key: 'role_id', label: 'ทุก Role', options: data.roles.map(r => ({ value: r.id, label: r.name })) },
      { key: 'is_active', label: 'ทุกสถานะ', options: [{ value: 'true', label: 'ใช้งาน' }, { value: 'false', label: 'ปิดใช้งาน' }] },
      ...(isSuperAdmin() ? [{ key: 'org_id', label: 'ทุกหน่วยงาน', options: data.orgs.map(o => ({ value: o.id, label: o.short_name || o.name })) }] : []),
    ],
    columns: [
      { key: 'full_name', label: 'ผู้ใช้งาน', render: u => `<div class="flex items-center gap-3 min-w-0">${avatarHtml(u, 'w-10 h-10', 'text-sm')}
          <div class="min-w-0"><div class="font-medium text-slate-700 truncate">${esc(u.full_name)} ${u.id === me.id ? '<span class="text-xs text-brand-400">(คุณ)</span>' : ''}</div>
          <div class="text-xs text-slate-400 truncate">@${esc(u.username)}${u.email ? ' · ' + esc(u.email) : ''}</div></div></div>` },
      { key: 'organizations.name', label: 'หน่วยงาน', render: u => esc(u.organizations?.short_name || u.organizations?.name || '-') },
      { key: 'roles.name', label: 'Role', render: u => roleBadge(u.roles) },
      { key: 'position', label: 'ตำแหน่ง', render: u => `<span class="text-slate-600">${esc(u.position || '-')}</span>` },
      { key: 'is_active', label: 'สถานะ', render: u => activeBadge(u.is_active) },
      { key: 'last_login_at', label: 'เข้าระบบล่าสุด', render: u => `<span class="text-slate-500 text-xs">${u.last_login_at ? timeAgo(u.last_login_at) : 'ยังไม่เคย'}</span>` },
    ],
    actions: (u) => {
      if (!canManageUser(u)) return '<span class="text-xs text-slate-300">—</span>';
      const self = u.id === me.id;
      return `<button class="btn-icon" data-act="edit" data-id="${u.id}" title="แก้ไข">${ic('pencil')}</button>
        <button class="btn-icon" data-act="perm" data-id="${u.id}" title="สิทธิ์รายบุคคล">${ic('shield-plus')}</button>
        <button class="btn-icon" data-act="pwd" data-id="${u.id}" title="รีเซ็ตรหัสผ่าน">${ic('key-round')}</button>

        ${isSuperAdmin() && !self ? `<button class="btn-icon hover:!text-blush-500 hover:!bg-blush-50" data-act="delete" data-id="${u.id}" title="ลบ">${ic('trash-2')}</button>` : ''}`;
    },
    emptyText: 'ไม่พบผู้ใช้งานตามเงื่อนไข',
  });
  const refresh = async () => {
    const d = await load();
    if (!d) return;
    data = d;
    const act = data.users.filter(u => u.is_active).length;
    $('#userStats', el).innerHTML = [
      `<div class="card p-3 text-center"><div class="text-xs text-slate-400">ทั้งหมด</div><div class="text-xl font-semibold text-brand-500">${data.users.length}</div></div>`,

    const b = e.target.closest('[data-act]');
    if (!b) return;
    const u = data.users.find(x => x.id === b.dataset.id);
    switch (b.dataset.act) {
      case 'add': openUserForm(null, data, refresh); break;
      case 'edit': openUserForm(u, data, refresh); break;
      case 'perm': openUserPermissions(u, refresh); break;
      case 'pwd': openResetPassword(u); break;

        if (!requirePermission('users.manage') || !canManageUser(u)) return;
        const ok = await confirmModal({ title: u.is_active ? 'ปิดการใช้งานบัญชี' : 'เปิดการใช้งานบัญชี', danger: u.is_active, confirmIcon: u.is_active ? 'user-x' : 'user-check',

        const r = await db(s => s.rpc('sfh_admin_user_set_active', tk({ p_id: u.id, p_active: !u.is_active })), { loaderText: 'กำลังบันทึก...', success: 'เปลี่ยนสถานะบัญชีเรียบร้อย', error: 'เปลี่ยนสถานะไม่สำเร็จ' });
        if (r.ok) refresh();
        break;
      }
      case 'delete': {
        if (!isSuperAdmin() || !requirePermission('users.manage')) return;
        const ok = await confirmModal({ title: 'ลบผู้ใช้งาน', message: `ต้องการลบบัญชี <b>${esc(u.full_name)}</b> (@${esc(u.username)}) ถาวรใช่หรือไม่?<br><span class="text-xs text-slate-400">แนะนำให้ "ปิดบัญชี" แทนการลบ เพื่อเก็บประวัติการใช้งาน</span>`, confirmText: 'ลบผู้ใช้' });
        if (!ok) return;
        const r = await db(s => s.rpc('sfh_admin_user_delete', tk({ p_id: u.id })), { loaderText: 'กำลังลบ...', success: 'ลบผู้ใช้งานเรียบร้อย', error: 'ลบไม่สำเร็จ' });
        if (r.ok) refresh();
        break;
      }
      case 'export': {
        if (!requirePermission('users.export')) return;
        const rows = table.getFiltered();
        downloadCSV(`users_${toInputDate()}`, ['ชื่อผู้ใช้', 'ชื่อ-นามสกุล', 'ตำแหน่ง', 'หน่วยงาน', 'Role', 'อีเมล', 'โทรศัพท์', 'สถานะ', 'เข้าระบบล่าสุด'],
          rows.map(u => [u.username, u.full_name, u.position, u.organizations?.name, u.roles?.name, u.email, u.phone, u.is_active ? 'ใช้งาน' : 'ปิดใช้งาน', u.last_login_at ? formatThaiDate(u.last_login_at, { time: true }) : '-']));
        logAudit('export', 'users', null, { count: rows.length });
        break;
      }
    }
  };
}
